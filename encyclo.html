                { keys: ['music', 'composer', 'song', 'opera', 'symphony', 'jazz', 'album', 'band', 'singer'],
                  label: 'lyric',     root: 174.61, intervals: [0, 4, 7, 11, 14] },    // F maj9
                { keys: ['classical music', 'baroque', 'romantic music', 'sonata', 'concerto'],
                  label: 'salon',     root: 196.00, intervals: [0, 4, 7, 9, 14] },     // G6 add9
                { keys: ['physics', 'astronom', 'space', 'galaxy', 'planet', 'cosmolog', 'star', 'nebula'],
                  label: 'cosmic',    root: 98.00,  intervals: [0, 7, 12, 16] },        // G sus open
                { keys: ['science', 'chemistry', 'mathematic', 'geometry', 'algebra'], label:'logic',root:164.81,intervals:[0,5,10] },
                { keys: ['technology', 'computing', 'computer', 'software', 'internet', 'digital', 'algorithm'],
                  label: 'circuit',   root: 220.00, intervals: [0, 2, 5, 7] },         // A2 add4
                { keys: ['nature', 'animal', 'plant', 'forest', 'flora', 'fauna', 'bird', 'fish', 'insect', 'mammal', 'reptile', 'botan', 'species', 'octopus', 'fung', 'ecolog', 'zoolog', 'tree'],
                  label: 'verdant',   root: 146.83, intervals: [0, 4, 7, 9] },         // D6
                { keys: ['ocean', 'sea', 'river', 'lake', 'water', 'island', 'coast', 'maritime', 'reef'],
                  label: 'aquatic',   root: 87.31,  intervals: [0, 7, 9, 14] },        // F sus7
                { keys: ['mountain', 'desert', 'volcano', 'glacier', 'arctic', 'tundra', 'plateau', 'basalt', 'rock', 'geology', 'igneous', 'mineral'],
                  label: 'austere',   root: 73.42,  intervals: [0, 7, 12, 16] },           // low D5
                { keys: ['religion', 'theology', 'church', 'monastery', 'saint', 'mystic', 'spiritual', 'cathedral', 'priest'],
                  label: 'sacred',    root: 130.81, intervals: [0, 7, 12, 19] },       // open fifths
                { keys: ['mythology', 'legend', 'folklore', 'mythical', 'deity'],
                  label: 'mythic',    root: 116.54, intervals: [0, 3, 7, 14] },        // dorian-ish
                { keys: ['art', 'painting', 'sculpture', 'literature', 'poem', 'novel', 'museum', 'poet'],
                  label: 'gallery',   root: 196.00, intervals: [0, 4, 7, 11] },        // G maj7
                { keys: ['philosoph', 'ethic', 'epistemolog', 'metaphysic', 'ontolog'],
                  label: 'logic',     root: 164.81, intervals: [0, 5, 10] },           // E sus quartal
                { keys: ['biograph', 'people', 'born', 'died', 'living person', 'novelist', 'actor', 'actress'],
                  label: 'humane',    root: 164.81, intervals: [0, 4, 7, 9] },         // E6
                { keys: ['city', 'cities', 'town', 'village', 'urban', 'capital', 'metropolitan', 'borough'],
                  label: 'civic',     root: 110.00, intervals: [0, 4, 7, 11] },        // A maj7
                { keys: ['sport', 'athlet', 'olympic', 'football', 'basketball', 'soccer', 'baseball', 'tennis'],
                  label: 'kinetic',   root: 220.00, intervals: [0, 5, 7, 10] },        // A sus7
                { keys: ['food', 'cuisine', 'recipe', 'cooking', 'beverage', 'wine', 'beer'],
                  label: 'hearth',    root: 174.61, intervals: [0, 4, 7] },            // F major
                { keys: ['film', 'cinema', 'movie', 'television', 'tv series', 'director', 'producer'],
                  label: 'reel',      root: 138.59, intervals: [0, 3, 7, 10] },        // C# m7
                { keys: ['politic', 'election', 'government', 'parliament', 'senate', 'president'],
                  label: 'forum',     root: 123.47, intervals: [0, 4, 7, 9] },         // B6
                { keys: ['economic', 'finance', 'market', 'currency', 'bank', 'stock'],
                  label: 'ledger',    root: 155.56, intervals: [0, 3, 7, 10] },        // Eb m7
                { keys: ['transport', 'aviation', 'aircraft', 'railway', 'ship', 'train', 'automobile', 'printing press', 'bicycle', 'locomotive', 'airport'],
                  label: 'transit',   root: 103.83, intervals: [0, 5, 7, 9] },         // Ab sus6
                { keys: ['language', 'linguistic', 'grammar', 'dialect', 'phonolog'],
                  label: 'lexical',   root: 185.00, intervals: [0, 4, 7, 14] },        // F# maj add9
                { keys: ['medicine', 'medical', 'disease', 'pathology', 'anatom', 'biology'],
                  label: 'clinical',  root: 138.59, intervals: [0, 5, 7] },            // C# sus
                { keys: ['fashion', 'design', 'style', 'textile', 'jewelry'],
                  label: 'couture',   root: 207.65, intervals: [0, 4, 9, 11] },        // G# maj7add6
                { keys: ['archaeology', 'ancient', 'prehistor', 'fossil', 'ruin', 'antiquit', 'sundial'],
                  label: 'antique',   root: 92.50,  intervals: [0, 4, 7, 14] },        // F# minor low
            ];

            const clean=x=>String(x||'').toLowerCase().replace(/[_–—-]/g,' ');
            const heading=clean(title),cats=categories.map(clean).filter(x=>!/^\d{3,4}s? (births|deaths)/.test(x)&&!/(articles (with|containing|needing|lacking)|language sources|wikipedia|wikidata|cs1 |use dmy|use mdy|short description|pages (with|using)|coordinates|webarchive)/.test(x)),lead=clean(excerpt).slice(0,1400);
            const stems=new Set(['mathematic','astronom','cosmolog','philosoph','ethic','epistemolog','metaphysic','ontolog','athlet','politic','economic','phonolog','anatom','prehistor','antiquit','botan','fung','ecolog','zoolog']);
            const hit=(text,key)=>new RegExp('\\b'+(stems.has(key)?key+'[a-z]*':key.endsWith('y')?key.slice(0,-1)+'(?:y|ies)':key+'(?:s|es)?')+'\\b','i').test(text);
            const ranked=moods.map(m=>({...m,score:m.keys.reduce((n,k)=>n+(hit(heading,k)?12:0)+Math.min(3,cats.filter(c=>hit(c,k)).length)*3+(hit(lead,k)?1:0),0)})).sort((a,b)=>b.score-a.score);
            let selected=ranked[0]?.score>0?ranked[0]:{label:'neutral',root:130.81,intervals:[0,4,7,14]};
            // Specific musical traditions take precedence over generic composer/music categories.
            if(/\b(jazz|bebop|swing)\b/i.test([title,...categories].join(' ')))selected={label:'jazz',root:146.83,intervals:[0,3,7,10,14]};
            else if(/\b(classical|baroque|sonata|concerto|symphony)\b/i.test([title,...categories].join(' ')))selected={label:'salon',root:196,intervals:[0,4,7,9,14]};
            return {...selected,profile:SOUND_PALETTES[selected.label]||SOUND_PALETTES.neutral};
        }

        function extractSentencesFromParagraph(pEl, pageId, initialCounter) {
            let sentenceIdCounter = initialCounter;
            return splitSentences(flattenToChars(pEl)).map(chars => ({ id: `${pageId}-${sentenceIdCounter++}`, chars }));
        }
        // Split on .!? followed by trailing citations + space + capital letter.
        function splitSentences(cleaned) {
            const sentences = [];
            let current = [];
            let i = 0;
            while (i < cleaned.length) {
                if (current.length === 0 && cleaned[i].c === ' ') { i++; continue; }
                current.push(cleaned[i]);

                if (!cleaned[i].cit && /[.!?]/.test(cleaned[i].c)) {
                    let j = i + 1;
                    const trailingCit = [];
                    while (j < cleaned.length && cleaned[j].cit) {
                        trailingCit.push(cleaned[j]);
                        j++;
                    }

                    let hasSpace = false;
                    if (j < cleaned.length && cleaned[j].c === ' ') { hasSpace = true; j++; }

                    const atEnd = j >= cleaned.length;
                    const startsNew = hasSpace && !atEnd && /[A-Z]/.test(cleaned[j].c);

                    if (atEnd || startsNew) {
                        if (trailingCit.length > 0) current.push(...trailingCit);
                        sentences.push(current);
                        current = [];
                        i = j - 1;
                    }
                }
                i++;
            }
            if (current.length > 0) sentences.push(current);
            return sentences;
        }

        /* ================================================================
           RENDERED TEXT — formatted span tree from char array
           ================================================================ */
        // Every non-citation format mask gets deliberate ink rather than a muddy average.
        // B=1, I=2, Link=4, Bullet=8. Hue plus a constituent-color ribbon identifies each mix.
        const FORMAT_PALETTE = {
            0:'#243041', 1:'#aa460a', 2:'#6e3ac2', 4:'#1456c7', 8:'#177238',
            3:'#cb1573', 5:'#166e8d', 9:'#796917', 6:'#92519a', 10:'#75404b', 12:'#0e564b',
            7:'#cc173a', 11:'#724019', 13:'#384984', 14:'#bb18a8', 15:'#94173d'
        };
        const FORMAT_BITS = {b:1,i:2,l:4,bul:8};
        const FORMAT_LABELS = {b:'Bold',i:'Italic',l:'Link',bul:'Bullet',cit:'Citation'};
        function formatInk(format) {
            const keys=Object.keys(FORMAT_BITS).filter(k=>format[k]);
            const mask=keys.reduce((n,k)=>n|FORMAT_BITS[k],0);
            const colors=keys.map(k=>FORMAT_PALETTE[FORMAT_BITS[k]]);
            const ribbon=colors.length>1?`linear-gradient(90deg,${colors.map((c,i)=>`${c} ${i/colors.length*100}% ${(i+1)/colors.length*100}%`).join(',')})`:'none';
            const label=[...keys.map(k=>FORMAT_LABELS[k]),...(format.cit?['Citation']:[])].join(' + ')||'Plain text';
            return {count:keys.length,mask,color:FORMAT_PALETTE[mask],ribbon,label};
        }
        // Word index of every character, split exactly as scoreSentence splits words (-1: spaces and citations).
        function charWordIndex(chars) {
            const out = []; let w = 0, open = false;
            chars.forEach(c => {
                if (c.cit) { out.push(-1); return; }
                if (c.c === ' ') { if (open) { w++; open = false; } out.push(-1); }
                else { open = true; out.push(w); }
            });
            return out;
        }
        const RenderedText = React.memo(({ chars, matchState, onNavigate, typedLength, sid, mark, heat }) => {
            // Group consecutive chars sharing the same format (and, when hoverable, the same word) into spans
            const spans = useMemo(() => {
            const spans = [];
            let buf = [];
            let curFmt = null;
            let curTarget = null;
            let bufWords = [];
            const wordOf = sid ? charWordIndex(chars) : null;

            const flush = () => {
                if (buf.length > 0) {
                    // Hoverable text also records which word each run of characters belongs to.
                    const pieces = [];
                    if (wordOf) buf.forEach((c, k) => { const last = pieces[pieces.length - 1]; if (last && last.word === bufWords[k]) last.text += c; else pieces.push({ text: c, word: bufWords[k] }); });
                    spans.push({ text: buf.join(''), fmt: curFmt, target: curTarget, pieces: wordOf ? pieces : null });
                    buf = []; bufWords = [];
                }
            };

            chars.forEach((charObj, k) => {
                const fmtStr = `${charObj.b}-${charObj.i}-${charObj.l}-${charObj.cit}-${!!charObj.bul}-${!!charObj.exp}`;
                if (fmtStr !== curFmt || charObj.target !== curTarget) {
                    flush();
                    curFmt = fmtStr;
                    curTarget = charObj.target;
                }
                buf.push(charObj.c);
                if (wordOf) bufWords.push(wordOf[k]);
            });
            flush();
            return spans;
            }, [chars, sid]);

            const containerClass =
                matchState === 'GREEN'    ? 'state-locked'   :
                matchState === 'USED'     ? 'state-used'     :
                matchState === 'COMPLETE' ? 'state-complete' :
                matchState === 'YELLOW'   ? 'state-yellow'   : '';

            return (
                <span className={`excerpt-text relative ${containerClass}${mark ? ' is-loupe' : ''}${heat ? ` heat-${heat}` : ''}`} data-sid={sid}>
                    {(() => {
                        let charOffset = 0;
                        return spans.map((span, idx) => {
                            const [b, i, l, cit, bul, exp] = span.fmt.split('-');
                            const classes = [];
                            if (b === 'true')   classes.push('fmt-bold');
                            if (i === 'true')   classes.push('fmt-italic');
                            if (l === 'true')   classes.push('fmt-link');
                            if (cit === 'true') classes.push('fmt-cit');
                            if (exp === 'true' && cit !== 'true') classes.push('fmt-exponent');
                            if (bul === 'true') classes.push('fmt-bullet');
                            const ink = formatInk({b:b==='true',i:i==='true',l:l==='true',bul:bul==='true',cit:cit==='true'});
                            if (ink.count>1) classes.push('fmt-mixed');
                            const inkStyle = {'--format-ink':cit==='true'&&!ink.count?'#576579':ink.color,'--format-ribbon':ink.ribbon};

                            // Only split at the typing boundary, not at every character.
                            // The range-based inspector still reads the exact hovered character.
                            const typedIn = (text, start) => Math.max(0, Math.min(text.length, (typedLength || 0) - start));
                            const spanStart = charOffset;
                            charOffset += span.text.length;
                            const typed = typedIn(span.text, spanStart);
                            let pieceStart = spanStart;
                            const inner = <span className="typeable-char" data-fmt={span.fmt}>
                                {span.pieces ? span.pieces.map((piece, k) => {
                                    const t = typedIn(piece.text, pieceStart); pieceStart += piece.text.length;
                                    const body = <>{t > 0 && <span className="char-typed">{piece.text.slice(0, t)}</span>}{piece.text.slice(t)}</>;
                                    return piece.word >= 0 ? <span key={k} data-w={piece.word}>{body}</span> : <React.Fragment key={k}>{body}</React.Fragment>;
                                }) : <>
                                    {typed > 0 && <span className="char-typed">{span.text.slice(0,typed)}</span>}
                                    {span.text.slice(typed)}
                                </>}
                            </span>;

                            // Render hyperlinks as clickable anchors (except inside locked or fully-typed sentences)
                            if (l === 'true' && span.target && onNavigate && matchState !== 'GREEN' && matchState !== 'USED' && matchState !== 'COMPLETE') {
                                return (
                                    <a
                                        key={idx}
                                        style={inkStyle}
                                        className={classes.join(' ') + " cursor-pointer hover:bg-blue-100/50 hover:text-blue-900 rounded px-0.5 transition-colors"}
                                        onClick={(e) => { e.preventDefault(); e.stopPropagation(); onNavigate(span.target); }}
                                        title={`${ink.label} · Open ${span.target}`}
                                    >
                                        {inner}
                                    </a>
                                );
                            }

                            return <span key={idx} style={inkStyle} title={sid ? undefined : ink.label} data-format-mask={ink.mask} className={classes.join(' ')}>{inner}</span>;
                        });
                    })()}
                </span>
            );
        });

        /* ================================================================
           HTML BLOCK W/ FRAGMENTS — preserves raw Wikipedia layout
           (infoboxes, tables, captions, headings, hatnotes) and portals
           a typeable RenderedText into each [data-frag-id] node.
           ================================================================ */
        const HtmlBlockWithFragments = ({ block, lockedSentences, usedSentenceIds, matchStates, typedLength, onNavigate, loupeIds, heatMap }) => {
            const containerRef = React.useRef(null);
            const [portalTargets, setPortalTargets] = useState([]);

            // After the raw HTML mounts, locate every fragment-bearing node,
            // strip its original text, and remember it so we can portal a
            // RenderedText component into it on every render.
            useEffect(() => {
                if (!containerRef.current) return;
                const els = Array.from(containerRef.current.querySelectorAll('[data-frag-id]'));
                const targets = [];
                els.forEach(el => {
                    // Drop the original text (RenderedText reproduces it) but keep text-free media such as flag icons.
                    Array.from(el.childNodes).forEach(n => {
                        const media = n.nodeType === 1 && !n.textContent.trim() && (n.matches('img,svg,video,audio,picture') || n.querySelector('img,svg,video,audio,picture'));
                        if (!media) el.removeChild(n);
                    });
                    el.classList.add('frag-host');
                    // A long caption holds several targets, one span each.
                    el.getAttribute('data-frag-id').split(' ').forEach((fragId, i) => {
                        if (i || el.firstChild) el.appendChild(document.createTextNode(' '));
                        const host = document.createElement('span');
                        host.className = 'frag-text';
                        el.appendChild(host);
                        targets.push({ fragId, el: host });
                    });
                });
                setPortalTargets(targets);
            }, [block.id]);

            const fragmentMap = useMemo(() => {
                const m = new Map();
                (block.fragments || []).forEach(f => m.set(f.id, f));
                return m;
            }, [block.fragments]);

            return (
                <>
                    <div ref={containerRef} dangerouslySetInnerHTML={{ __html: block.html }} style={{ display: 'contents' }} />
                    {portalTargets.map(({ fragId, el }) => {
                        const sentence = fragmentMap.get(fragId);
                        if (!sentence) return null;
                        let state = 'NONE';
                        if (lockedSentences.some(ls => ls.id === fragId))   state = 'GREEN';
                        else if (usedSentenceIds && usedSentenceIds.has(fragId)) state = 'USED';
                        else if (matchStates[fragId] === 'COMPLETE')        state = 'COMPLETE';
                        else if (matchStates[fragId] === 'YELLOW')          state = 'YELLOW';
                        return ReactDOM.createPortal(
                            <RenderedText chars={sentence.chars} sid={fragId} mark={state === 'NONE' && !!loupeIds?.has(fragId)} heat={state === 'NONE' ? heatMap?.get(fragId) : undefined} matchState={state} typedLength={state === 'YELLOW' ? typedLength : null} onNavigate={onNavigate} />,
                            el,
                            fragId
                        );
                    })}
                </>
            );
        };

        /* ================================================================
           SCORING OVERLAY — animated yield ledger
           ================================================================ */
        /* ================================================================
           SENTENCE SCORING — shared by ScoringOverlay and live preview
           ================================================================ */
        function findIdleHint(sentences,buffer,locked,used) {
            if(!buffer.length)return null;
            const eligible=sentences.filter(s=>!used.has(s.id)&&!locked.some(x=>x.id===s.id));
            const matches=(s,n)=>s.chars.length>=n&&buffer.slice(0,n).every((b,i)=>{const c=s.chars[i];return charMatch(b.c,c.c)&&['b','i','l','cit','bul'].every(k=>!!b[k]===!!c[k]);});
            let candidates=eligible.filter(s=>matches(s,buffer.length));
            let index=buffer.length,correction=false;
            if(!candidates.length&&buffer.length>1){index--;correction=true;candidates=eligible.filter(s=>matches(s,index));}
            if(!candidates.length||candidates.some(s=>s.chars.length<=index))return null;
            const char=candidates[0].chars[index];
            if(!candidates.every(s=>{const c=s.chars[index];return c.c===char.c&&['b','i','l','cit','bul'].every(k=>!!c[k]===!!char[k]);}))return null;
            return {char,correction};
        }

        // Scores are pure functions of (excerpt, build, rules); memoise them so the HUD and pace
        // meter can re-read locked excerpts on every keystroke without rescoring.
        const wordOutline = chars => ({ text: chars.map(c => c.c).join(''), len: chars.length, fmt: { b: chars.some(c => c.b), i: chars.some(c => c.i), l: chars.some(c => c.l), bul: chars.some(c => c.bul) } });
        const sentenceScoreCache = new WeakMap();
        function scoreSentence(s, upgrades, rules = DEFAULT_SCORING) {
            upgrades = expandUnderstudy(upgrades);
            let byUpgrades = sentenceScoreCache.get(s);
            if (!byUpgrades) { byUpgrades = new WeakMap(); sentenceScoreCache.set(s, byUpgrades); }
            let byRules = byUpgrades.get(upgrades);
            if (!byRules) { byRules = new WeakMap(); byUpgrades.set(upgrades, byRules); }
            let result = byRules.get(rules);
            if (!result) { result = computeSentenceScore(s, upgrades, rules); byRules.set(rules, result); }
            return result;
        }
        function computeSentenceScore(s, upgrades, rules) {
            const wordUpgrades = upgrades.filter(u => u.type === 'WORD');
            const words = [];
            let current = [];
            let citationBlocks = 0;
            const citationTexts = [];
            let inCit = false;

            s.chars.forEach(charObj => {
                if (charObj.cit) {
                    if (!inCit) { citationBlocks++; citationTexts.push(''); inCit = true; }
                    citationTexts[citationTexts.length-1] += charObj.c;
                } else {
                    inCit = false;
                    if (charObj.c === ' ') {
                        if (current.length > 0) { words.push(current); current = []; }
                    } else {
                        current.push(charObj);
                    }
                }
            });
            if (current.length > 0) words.push(current);

            // Outline of every word, so word upgrades can look at neighbours (Alliterative) and the whole excerpt (Summit).
            const outline = words.map(wordOutline);
            // Score each word
            const wordScores = words.map((wChars, idx) => {
                const text = wChars.map(c => c.c).join('');
                const charDetails = wChars.map(co => ({
                    c: co.c,
                    score: getBoostedCharScore(co.c, upgrades, rules),
                    boost: letterBoost(co.c, upgrades),
                    b: co.b, i: co.i, l: co.l, bul: !!co.bul, cit: false
                }));

                let base = charDetails.reduce((acc, cd) => acc + cd.score, 0);
                const len     = wChars.length;
                const isFirst = idx === 0;
                const isLast  = idx === words.length - 1;

                const lenMult = len > rules.lengthStart ? (1 + (len - rules.lengthStart) * rules.lengthStep) : 1;

                let formatMult = 1.0;
                let formatAdd  = 0;
                if (wChars.some(c => c.b)) formatMult *= rules.bold;
                if (wChars.some(c => c.i)) formatMult *= rules.italic;
                if (wChars.some(c => c.l)) formatAdd += rules.link;

                const posMult = 1; // Position rewards are purchased word upgrades.

                let upgradeBase = 0;
                let upgradeMult = 0;
                let upgradeTimes = 1;
                const appliedWordUpgrades = [];
                const wordEffects = [];

                wordUpgrades.forEach(u => {
                    const effect = u.action({ len, isFirst, isLast, index: idx, count: words.length, charDetails, text, prev: outline[idx - 1] || null, words: outline, title: s.articleTitle || '' });
                    if (effect) {
                        if (effect.baseAdd) upgradeBase += effect.baseAdd * rules.wordBonus;
                        if (effect.multAdd) upgradeMult += effect.multAdd * rules.wordBonus;
                        const times = effect.multMul ? 1 + (effect.multMul - 1) * rules.wordBonus : 1;
                        upgradeTimes *= times;
                        appliedWordUpgrades.push(u.name);
                        wordEffects.push({name:u.name,base:(effect.baseAdd||0)*rules.wordBonus,mult:(effect.multAdd||0)*rules.wordBonus,times});
                    }
                });

                const characterBase=base, formatBaseMult=formatMult;
                base       += formatAdd + upgradeBase;
                formatMult += upgradeMult;
                // × buffs multiply the word multiplier after every addition.
                formatMult *= upgradeTimes;

                const total = Math.floor(base * lenMult * formatMult) * posMult;

                return {
                    chars: wChars,
                    charDetails,
                    base, characterBase, upgradeBase, upgradeMult, upgradeTimes, formatBaseMult, len, lenMult, formatMult, formatAdd,
                    isFirstLast: isFirst || isLast,
                    posMult, total,
                    text,
                    appliedWordUpgrades, wordEffects
                };
            });

            let sBase = wordScores.reduce((acc, w) => acc + w.total, 0);
            let sMult = Math.pow(rules.citation, citationBlocks);
            const appliedSentenceUpgrades = [];
            const sentenceEffects = [];
            const triggeredUpgrades = new Set(wordScores.flatMap(w => w.appliedWordUpgrades));

            if (citationBlocks > 0) appliedSentenceUpgrades.push(`${citationBlocks} Citation(s)`);

            upgrades.filter(u => u.type === 'SENTENCE').forEach(u => {
                const effect = u.action({ words: wordScores, citationBlocks, citationTexts, sentence: s });
                if (effect) {
                    if (effect.baseAdd) sBase += effect.baseAdd * rules.sentenceBonus;
                    if (effect.multAdd) sMult += effect.multAdd * rules.sentenceBonus;
                    appliedSentenceUpgrades.push(u.name);
                    sentenceEffects.push({name:u.name,base:(effect.baseAdd||0)*rules.sentenceBonus,mult:(effect.multAdd||0)*rules.sentenceBonus});
                    triggeredUpgrades.add(u.name);
                }
            });

            // Each distinct WORD/SENTENCE upgrade that actually fires extends
            // a purchased Chain. Additional triggers keep increasing the bonus without a cap.
            const chainStrength = hasUpgrade(upgrades,'chain-forged') ? 2 : 1;
            const chainMultiplier = hasUpgrade(upgrades,'chain') ? 1 + rules.chain * chainStrength * Math.max(0, triggeredUpgrades.size - 1) : 1;
            const sentenceTotal = Math.floor(sBase * sMult * chainMultiplier);
            return {
                id: s.id,
                text: s.chars.map(c => c.c).join(''),
                words: wordScores,
                citationBlocks, citationTexts, sentenceBase: sBase, sentenceMultiplier: sMult, chainMultiplier, triggeredUpgrades: [...triggeredUpgrades],
                sentenceTotal,
                appliedSentenceUpgrades, sentenceEffects
            };
        }

        /* ================================================================
           PACE METER — see CSS comment for the model.
           progress(list): 3 − (excerpts left) × (score each still needs ÷ starting pace).
             · exactly on pace after k excerpts  → k
             · target already guaranteed        → 3 (GOAL)
             · final excerpt: 3 + (score − needed) ÷ pace, so it can pass GOAL.
           ratio(list): average excerpt strength vs starting pace (geometric), for the headline %.
           ================================================================ */
        const PACE_MAX=3.5;
        // Exact (un-rounded) pace basis: base³ = target ÷ guaranteed run multiplier, in (score + Symmetric) units.
        function paceBasis(upgrades,rules,target){
            const sym=hasUpgrade(upgrades,'symmetric')?rules.symmetric:0;
            const M=guaranteedRunMultiplier(upgrades,rules);
            return {sym,M,base:Math.cbrt(Math.max(0,target)/M)};
        }
        function meterProgress(list,upgrades,rules,target){
            const k=list.length,{sym,M,base}=paceBasis(upgrades,rules,target);
            if(!k||!(base>0))return 0;
            if(k<REQUIRED_SENTENCES){
                const P=list.reduce((n,x)=>n*(scoreSentence(x,upgrades,rules).sentenceTotal+sym),1);
                if(!(P>0))return -Infinity;
                const n=REQUIRED_SENTENCES-k;
                return REQUIRED_SENTENCES-n*Math.pow(target/(M*P),1/n)/base;
            }
            const req=thirdExcerptRequirement(list.slice(0,2),list[2],upgrades,rules,target).needed;
            const sc=scoreSentence(list[2],upgrades,rules).sentenceTotal;
            return Number.isFinite(req)?REQUIRED_SENTENCES+(sc-req)/base:-Infinity;
        }
        function meterRatio(list,upgrades,rules,target){
            const k=list.length,{sym,base}=paceBasis(upgrades,rules,target);
            if(!k||!(base>0))return null;
            if(k<REQUIRED_SENTENCES){
                const P=list.reduce((n,x)=>n*(scoreSentence(x,upgrades,rules).sentenceTotal+sym),1);
                return Math.pow(Math.max(0,P),1/k)/base;
            }
            return Math.cbrt(Math.max(0,scoreRun(list,upgrades,rules).runTotal)/target);
        }
        const fmtLead=r=>r===null?'—':!Number.isFinite(r)?'MAX':(()=>{const p=Math.round((r-1)*100);return p===0?'±0%':`${p>0?'+':'−'}${Math.abs(p)>999?'999':Math.abs(p)}%`;})();

        const PaceMeter=React.memo(({locked,live,liveScore,needed,upgrades,rules,target})=>{
            const k=locked.length;
            const preview=live&&k<REQUIRED_SENTENCES&&!locked.some(x=>x.id===live.id)?[...locked,live]:null;

            const banked=meterProgress(locked,upgrades,rules,target);
            const ahead=preview?meterProgress(preview,upgrades,rules,target):null;
            const r=meterRatio(locked,upgrades,rules,target);
            const rNext=preview?meterRatio(preview,upgrades,rules,target):null;
            const pct=r===null?null:Math.round((r-1)*100);
            const state=k===0?'idle':!Number.isFinite(r)||pct>0?'ahead':pct<0?'behind':'even';

            const clamp=x=>Math.max(0,Math.min(PACE_MAX,x));
            const pos=x=>clamp(x)/PACE_MAX*100;
            const b=pos(banked),g=ahead===null?null:pos(ahead),notch=pos(k);
            const need=Number.isFinite(needed)?needed:null;
            const good=liveScore!==null&&need!==null&&liveScore>=need;
            const isLast=k===REQUIRED_SENTENCES-1;
            const landsAhead=rNext!==null&&rNext>=1; // ghost colour: where you'd stand after locking

            let next='',nextCls='';
            if(preview&&isLast){
                const f=scoreRun(preview,upgrades,rules).runTotal/target;
                next=f>=1?'clears ✓':`${Math.min(99,Math.ceil((1-f)*100))}% short`;nextCls=f>=1?'up':'down';
            }else if(preview){
                next=`→ ${fmtLead(rNext)}`;nextCls=rNext>=1?'up':'down';
            }

            const aria=k===0?'No excerpts banked yet':`${k} of 3 excerpts banked, ${pct===null?'':Math.abs(pct)+' percent '+(pct>=0?'above':'below')+' pace'}`;
            return <aside className={`pace-meter ${state}`} aria-label="Round pace"
                title={'Solid fill: what you have banked. Notch: where exactly-on-pace excerpts would put you — fill above it means you are ahead.\nStriped: the excerpt you are typing, if you lock it now. Reach GOAL to clear the round.\nHeadline: how far your locked excerpts average above or below the pace.'}>
                <span className="pm-label">Pace</span>
                {(()=>{const t=k?fmtLead(r):'—';return <strong key={k} className={`pm-head ${k?'pop':''} ${t.length>5?'xlong':t.length>4?'long':''}`}>{t}</strong>;})()}
                <span className="pm-sub">{state==='ahead'?'ahead':state==='behind'?'behind':state==='even'?'on pace':'none banked'}</span>
                <div className="pm-bar" role="progressbar" aria-valuemin={0} aria-valuemax={3} aria-valuenow={Math.round(clamp(banked)*100)/100} aria-valuetext={aria}>
                    <div className="pm-clip">
                        <i className="pm-zone" style={{bottom:`${pos(3)}%`,top:0}}/>
                        <i className="pm-fill" style={{height:`${b}%`}}/>
                        {state==='behind'&&g===null&&<i className="pm-gap" style={{bottom:`${b}%`,height:`${Math.max(0,notch-b)}%`}}/>}
                        {g!==null&&g>b&&<i className={`pm-ghost ${landsAhead?'good':'bad'}`} style={{bottom:`${b}%`,height:`${g-b}%`}}/>}
                        {g!==null&&g<b&&<i className="pm-loss" style={{bottom:`${g}%`,height:`${b-g}%`}}/>}
                        {k>0&&<i key={`f${k}`} className="pm-flash"/>}
                        {[1,2].map(t=><span key={t} className="pm-tick" style={{bottom:`${pos(t)}%`}}/>)}
                    </div>
                    {[1,2].map(t=><span key={t} className="pm-tickmark" style={{bottom:`${pos(t)}%`}}/>)}
                    <span className="pm-goal" style={{bottom:`${pos(3)}%`}}><em>Goal</em></span>
                    {k>0&&k<REQUIRED_SENTENCES&&<span className="pm-notch" style={{bottom:`${notch}%`}}/>}
                </div>
                <div className={`pm-live ${liveScore===null?'':good?'good':'bad'}`}>
                    <span className="pm-cap">{isLast?'Last one':k>=REQUIRED_SENTENCES?'Done':'This one'}</span>
                    <span className="pm-score"><b>{liveScore===null?'—':formatScore(liveScore)}</b><small>/{need===null?'∞':formatScore(need)}</small></span>
                    <span className={`pm-next ${nextCls}`}>{next}</span>
                </div>
            </aside>;
        });

        // Hover any word of an excerpt: a small card shows its base, its word multiplier and their product.
        const fmtMult = x => Number(x.toFixed(x < 10 ? 2 : 1)).toLocaleString();
        /* ================================================================
           WHERE THE POINTS COME FROM — one vocabulary everywhere:
           a word is BASE × MULT; an excerpt is WORDS × MULT; a round multiplies three excerpts.
           ================================================================ */
        function wordBreakdown(w, rules) {
            const boosted = w.charDetails.filter(c => c.boost);
            const base = [{ label: boosted.length ? `letters (${[...new Set(boosted.map(c => `${c.c} +${c.boost}`))].join(', ')})` : 'letters', v: w.characterBase }];
            if (w.formatAdd) base.push({ label: 'link', v: w.formatAdd });
            w.wordEffects.filter(e => e.base).forEach(e => base.push({ label: e.name, v: e.base, buff: true }));
            const format = [];
            if (w.chars.some(c => c.b)) format.push({ label: 'bold', v: '×' + rules.bold });
            if (w.chars.some(c => c.i)) format.push({ label: 'italic', v: '×' + rules.italic });
            w.wordEffects.filter(e => e.mult).forEach(e => format.push({ label: e.name, v: '+' + fmtMult(e.mult), buff: true }));
            w.wordEffects.filter(e => e.times && e.times !== 1).forEach(e => format.push({ label: e.name, v: '×' + fmtMult(e.times), buff: true }));
            return { base, format, length: w.lenMult, formatMult: w.formatMult, mult: w.lenMult * w.formatMult, total: w.total };
        }
        // An excerpt in steps: the words' sum, then sentence base bonuses (add to WORDS), then citations,
        // sentence multiplier bonuses and chain (change MULT), in the order the scorer applies them.
        function excerptBreakdown(d) {
            const words = d.words.reduce((n, w) => n + w.total, 0), steps = [];
            let chips = words, mult = 1;
            d.sentenceEffects.filter(e => e.base).forEach(e => { chips += e.base; steps.push({ kind: 'base', label: e.name, text: `+${e.base.toLocaleString()}`, chips, mult }); });
            if (d.citationBlocks) { mult = d.sentenceMultiplier - d.sentenceEffects.reduce((n, e) => n + (e.mult || 0), 0); steps.push({ kind: 'x', label: `${d.citationBlocks} citation${d.citationBlocks === 1 ? '' : 's'}`, text: `×${fmtMult(mult)}`, chips, mult }); }
            d.sentenceEffects.filter(e => e.mult).forEach(e => { mult += e.mult; steps.push({ kind: 'add', label: e.name, text: `+${fmtMult(e.mult)}`, chips, mult }); });
            if (d.chainMultiplier !== 1) { mult *= d.chainMultiplier; steps.push({ kind: 'x', label: `Chain · ${d.triggeredUpgrades.length} buffs`, text: `×${fmtMult(d.chainMultiplier)}`, chips, mult }); }
            // Word buffs, summed over the excerpt: they are what makes WORDS bigger than plain letters.
            const wb = new Map();
            d.words.forEach(w => w.wordEffects.forEach(e => { const g = wb.get(e.name) || { base: 0, mult: 0, times: 1, words: 0 }; g.base += e.base || 0; if (e.mult) g.mult = Math.max(g.mult, e.mult); if (e.times && e.times !== 1) g.times = e.times; g.words++; wb.set(e.name, g); }));
            const wordBuffs = [...wb].map(([label, g]) => ({ label, text: gainText(g) }));
            // Letter packs: extra base on every boosted character.
            const boosted = d.words.flatMap(w => w.charDetails.filter(c => c.boost));
            if (boosted.length) wordBuffs.unshift({ label: `Letters ${[...new Set(boosted.map(c => c.c.toUpperCase()))].slice(0, 6).join(' ')}`, text: `+${boosted.reduce((n, c) => n + c.boost, 0).toLocaleString()} base · ${boosted.length} chars` });
            return { words, chips: d.sentenceBase, mult: d.sentenceMultiplier * d.chainMultiplier, steps, wordBuffs, total: d.sentenceTotal };
        }
        // What each buff adds to one excerpt, for the buffs list.
        function buffGains(d) {
            const out = new Map(), get = n => { if (!out.has(n)) out.set(n, { base: 0, mult: 0, times: 1, words: 0 }); return out.get(n); };
            d?.words.forEach(w => w.wordEffects.forEach(e => { const g = get(e.name); g.base += e.base || 0; if (e.mult) g.mult = Math.max(g.mult, e.mult); if (e.times && e.times !== 1) g.times = e.times; g.words++; }));
            d?.sentenceEffects.forEach(e => { const g = get(e.name); g.base += e.base || 0; g.mult += e.mult || 0; g.sentence = true; });
            return out;
        }
        const gainText = g => {
            const parts = [];
            if (g.base) parts.push(`+${g.base.toLocaleString()} ${g.sentence ? 'words' : 'base'}`);
            if (g.mult) parts.push(`+${fmtMult(g.mult)} mult${!g.sentence && g.words > 1 ? ' each' : ''}`);
            if (g.times !== 1) parts.push(`×${fmtMult(g.times)} mult${g.words > 1 ? ' each' : ''}`);
            return parts.join(' · ') + (!g.sentence && g.words ? ` · ${g.words} word${g.words === 1 ? '' : 's'}` : '');
        };
        // Floating score pops: own state, so a pop never re-renders the page around it.
        function usePops() {
            const emit = useRef(() => {});
            const Host = useMemo(() => function PopHost() {
                const [pops, setPops] = useState([]);
                useEffect(() => { let id = 0; emit.current = p => { const k = ++id; setPops(ps => [...ps.slice(-30), { ...p, k }]); setTimeout(() => setPops(ps => ps.filter(x => x.k !== k)), p.ms || 950); }; return () => { emit.current = () => {}; }; }, []);
                return <div className="pop-layer" aria-hidden="true">{pops.map(p => <span key={p.k} className={`score-pop ${p.kind || ''}`} style={{ left: p.x, top: p.y }}>{p.text}</span>)}</div>;
            }, []);
            const at = (el, text, kind, ms) => { if (!el) return; const r = el.getBoundingClientRect(), sc = el.closest('.overflow-y-auto')?.getBoundingClientRect(); if (!r.width || sc && (r.bottom < sc.top || r.top > sc.bottom)) return; emit.current({ x: r.left + r.width / 2, y: r.top, text, kind, ms }); };
            return { at, node: <Host/> };
        }
        const pulseRail = name => document.querySelectorAll('.build-rail .rail-item').forEach(li => { if (li.dataset.name === name) { li.classList.remove('pulse'); void li.offsetWidth; li.classList.add('pulse'); } });
        // The live WORDS × MULT = SCORE readout for the excerpt being typed.
        const ScoreBar = ({ detail, compact = false }) => {
            const b = detail ? excerptBreakdown(detail) : null;
            return <div className={`score-bar${b ? '' : ' is-empty'}${compact ? ' is-compact' : ''}`} tabIndex={b ? 0 : -1}>
                <span className="sb-box sb-words"><b key={b ? b.chips : 'x'}>{b ? b.chips.toLocaleString() : '—'}</b><small>words</small></span>
                <i>×</i>
                <span className="sb-box sb-mult"><b key={b ? fmtMult(b.mult) : 'x'}>{b ? fmtMult(b.mult) : '—'}</b><small>mult</small></span>
                <i>=</i>
                <strong key={b ? b.total : 'x'} title={b ? b.total.toLocaleString() : ''}>{b ? formatScore(b.total) : '—'}</strong>
                {b && <div className="sb-pop" role="tooltip">
                    <p><span>{detail.words.length} words scored</span><b>{b.words.toLocaleString()}</b></p>
                    {b.wordBuffs.map((x, i) => <p key={'w' + i} className="is-word"><span>↳ {x.label}</span><b>{x.text}</b></p>)}
                    {b.steps.map((st, i) => <p key={i} className={`is-${st.kind}`}><span>{st.label}</span><b>{st.text}</b></p>)}
                    <p className="sb-sum"><span>{b.chips.toLocaleString()} × {fmtMult(b.mult)}</span><b>{b.total.toLocaleString()}</b></p>
                    <small>Click any word in the article for its own base × mult.</small>
                </div>}
            </div>;
        };

        /* ================================================================
           ROUND CARD — the target and a log-scale gauge. Excerpt scores multiply, so on a log scale
           they add: each excerpt is a block, three on-pace blocks exactly reach the goal, and
           guaranteed multipliers (Glass Cannon, Carbon Copy) are a gold block you start with.
           ================================================================ */
        const RoundCard = ({ ante, target, locked, live, progress = 0, upgrades, rules, aim, bonus, forecast }) => {
            const L = Math.log(Math.max(2, target)), sym = hasUpgrade(upgrades, 'symmetric') ? rules.symmetric : 0;
            const G = guaranteedRunMultiplier(upgrades, rules);
            const val = x => scoreSentence(x, upgrades, rules).sentenceTotal + sym;
            const wOf = x => x > 1 ? Math.log(x) / L : 0;
            const blocks = [];
            if (G > 1.001) blocks.push({ kind: 'gold', w: wOf(G), label: `×${fmtMult(G)}`, title: 'Guaranteed multipliers' });
            locked.forEach((x, i) => { const v = val(x); blocks.push({ kind: 'locked', w: wOf(v), label: formatScore(v), title: `Excerpt ${i + 1}: ${v.toLocaleString()}` }); });
            const liveNew = live && !locked.some(x => x.id === live.id) && locked.length < REQUIRED_SENTENCES;
            let liveV = null;
            if (liveNew) { liveV = val(live); blocks.push({ kind: 'live', w: wOf(liveV), label: formatScore(liveV), title: `The excerpt you are typing, if you lock it now: ${liveV.toLocaleString()}` }); }
            // On the last excerpt the scorer knows everything: show the run bonuses that would actually land.
            if (liveNew && locked.length === REQUIRED_SENTENCES - 1 && forecast) {
                const product = G * [...locked, live].reduce((n, x) => n * val(x), 1), extra = product > 0 ? forecast / product : 1;
                if (extra > 1.001) blocks.push({ kind: 'bonus-in', w: wOf(extra), label: `×${fmtMult(extra)}`, title: 'Run bonuses that land with this excerpt' });
            } else if (bonus > 1.001 && locked.length < REQUIRED_SENTENCES) blocks.push({ kind: 'bonus', w: wOf(bonus), label: `×${fmtMult(bonus)}?`, title: 'Run bonuses you can still earn this round' });
            const solid = blocks.filter(b => b.kind !== 'bonus').reduce((n, b) => n + b.w, 0), total = blocks.reduce((n, b) => n + b.w, 0);
            const R = Math.max(1.14, total + .04), pos = x => `${x / R * 100}%`;
            const g0 = G > 1.001 ? wOf(G) : 0, ticks = [1, 2].map(k => g0 + (1 - g0) * k / 3);
            let at = 0;
            const left = REQUIRED_SENTENCES - locked.length;
            const liveGood = liveV !== null && Number.isFinite(aim) && liveV - sym >= aim;
            const foot = left === 0 ? 'Scoring…'
                : forecast ? <>Round if locked <b>{formatScore(forecast)}</b> · {forecast >= target ? <em className="is-good">clears</em> : <em className="is-bad">{formatScore(target - forecast)} short</em>}</>
                : <>{left === 3 ? 'Aim' : left === 1 ? 'Last one needs' : `Next ${left} need`} <b>{Number.isFinite(aim) ? formatScore(aim) : '—'}</b>{left > 1 ? ' each' : ''}{liveV !== null && <> · this one <em className={liveGood ? 'is-good' : 'is-bad'}>{formatScore(liveV - sym)}</em></>}</>;
            return <div className={`round-card${solid >= 1 ? ' is-clear' : ''}`} title={'Scores multiply, so this gauge adds them on a log scale: three on-pace excerpts fill it exactly.\nBlue: locked excerpts. Striped: the one you are typing. Gold: guaranteed multipliers. Dashed: run bonuses you can still earn.'}>
                <div className="rc-head"><span>Round {ante} of {MAX_ANTE}</span><b>{formatScore(target)}</b><small>to clear</small></div>
                <div className="rc-bar" role="progressbar" aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(Math.min(1, solid) * 100)} aria-label="Progress to the round target">
                    {blocks.map((b, i) => { const x = at; at += b.w; return b.w > 0 && <span key={i} className={`rc-block is-${b.kind}${b.kind === 'locked' ? ` is-n${i}` : ''}`} style={{ left: pos(x), width: pos(b.w) }} title={b.title}>{b.kind === 'live' && <b className="rc-progress" style={{ width: `${Math.min(100, progress * 100)}%` }}/>}{b.w / R > (b.label.length > 5 ? .075 : .045) && <i>{b.label}</i>}</span>; })}
                    {ticks.map((t, i) => <span key={i} className="rc-tick" style={{ left: pos(t) }}/>)}
                    <span className="rc-goal" style={{ left: pos(1) }}><em>Goal</em></span>
                </div>
                <div className="rc-foot">{foot}</div>
            </div>;
        };

        const WordTipCard = ({ tip }) => { const b = wordBreakdown(tip.word, tip.rules || DEFAULT_SCORING); return <div className={`word-tip ${tip.below ? 'is-below' : ''}`} style={{ left: tip.x, top: tip.y }} role="tooltip">
            <div className="wt-eq">
                <span className="wt-base"><b>{tip.word.base.toLocaleString()}</b><small>base</small></span><i>×</i>
                <span className="wt-mult"><b>{fmtMult(b.mult)}</b><small>mult</small></span><i>=</i>
                <span className="is-total"><b>{tip.word.total.toLocaleString()}</b><small>score</small></span>
            </div>
            <p className="wt-line wt-base-line"><i>base</i>{b.base.map((x, i) => <span key={i} className={x.buff ? 'is-buff' : ''}>{i ? '+ ' : ''}{x.v.toLocaleString()} {x.label} </span>)}</p>
            <p className="wt-line wt-mult-line"><i>mult</i>{b.length !== 1 || b.format.length ? <>{b.length !== 1 && <span>×{fmtMult(b.length)} long word </span>}{b.format.length > 0 && <span>{b.length !== 1 ? '× ' : ''}{fmtMult(b.formatMult)} from {b.format.map((x, i) => <em key={i} className={x.buff ? 'is-buff' : ''}>{i ? ', ' : ''}{x.label} {x.v}</em>)}</span>}</> : <span>×1, plain short word</span>}</p>
        </div>; };
        // Word score card. mode 'click' (default): click a word to open its card, click it again or anywhere
        // else, scroll or type to close it. mode 'hover': the card follows the pointer.
        function useWordHover(detailFor, rules = DEFAULT_SCORING, mode = 'hover') {
            // The card keeps its own state, so showing it never re-renders the article around it.
            const show = useRef(() => {});
            const cur = useRef({ key: null, els: [] });
            const Host = useMemo(() => function WordTipHost() {
                const [tip, setTip] = useState(null);
                useEffect(() => { show.current = setTip; return () => { show.current = () => {}; }; }, []);
                return tip ? <WordTipCard tip={tip}/> : null;
            }, []);
            const clear = () => {
                if (!cur.current.key) return;
                cur.current.els.forEach(x => x.classList.remove('word-hover'));
                cur.current = { key: null, els: [] }; show.current(null);
            };
            const showFor = (e, toggle) => {
                const el = e.target.closest?.('[data-w]'), host = el?.closest('[data-sid]');
                if (!el || !host) { clear(); return; }
                const key = host.dataset.sid + ':' + el.dataset.w;
                if (key === cur.current.key) { if (toggle) clear(); return; }
                const word = detailFor(host.dataset.sid)?.words[Number(el.dataset.w)];
                if (!word) { clear(); return; }
                cur.current.els.forEach(x => x.classList.remove('word-hover'));
                const els = [...host.querySelectorAll(`[data-w="${el.dataset.w}"]`)];
                els.forEach(x => x.classList.add('word-hover'));
                cur.current = { key, els };
                const r = el.getBoundingClientRect(), below = r.top < 90;
                show.current({ x: Math.max(150, Math.min(window.innerWidth - 150, r.left + r.width / 2)), y: below ? r.bottom + 8 : r.top - 8, below, word, rules });
            };
            const clearRef = useRef(clear); clearRef.current = clear;
            useEffect(() => {
                if (mode !== 'click') { clearRef.current(); return; }
                const away = e => { if (!e.target.closest?.('[data-w]')) clearRef.current(); };
                const key = e => { if (!['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) clearRef.current(); };
                document.addEventListener('pointerdown', away, true); document.addEventListener('keydown', key, true);
                return () => { document.removeEventListener('pointerdown', away, true); document.removeEventListener('keydown', key, true); };
            }, [mode]);
            // Links keep navigating on click; the card never opens for them in click mode.
            const onClick = e => { if (e.target.closest?.('a')) return; showFor(e, true); };
            return mode === 'click'
                ? { onClick, clear, node: <Host/> }
                : { onMouseOver: e => showFor(e, false), onMouseLeave: clear, clear, node: <Host/> };
        }

        // The tally scores like a slot machine you can read: each word adds to WORDS, each sentence bonus
        // changes MULT, then the three excerpts multiply and run bonuses land one by one.
        function tallySchedule(details, bks, runSteps) {
            let t = 250; const ex = [];
            details.forEach((d, i) => {
                const n = d.words.length, step = Math.max(16, Math.min(42, 700 / Math.max(1, n)));
                const wordsAt = d.words.map((_, j) => t + j * step); t += n * step + 90;
                const stepsAt = bks[i].steps.map((_, k) => t + k * 210); t += bks[i].steps.length * 210;
                ex.push({ wordsAt, stepsAt, totalAt: t }); t += 260;
            });
            const eqAt = t; t += 260;
            const runAt = runSteps.map((_, k) => t + k * 280); t += runSteps.length * 280;
            const finalAt = t; t += 550;
            return { ex, eqAt, runAt, finalAt, end: t + 150 };
        }
        const ScoringOverlay = ({sentences,onComplete,targetScore,ante,upgrades,rules,market,practice=false,tipMode='click'}) => {
            const dialogRef=useRef(null), ledgerRef=useRef(null), lastT=useRef(0);
            const details=useMemo(()=>sentences.map(s=>scoreSentence(s,upgrades,rules)),[sentences,upgrades,rules]);
            const result=useMemo(()=>scoreRun(sentences,upgrades,rules,details),[sentences,upgrades,rules,details]);
            const bks=useMemo(()=>details.map(excerptBreakdown),[details]);
            const symmetric=upgrades.some(u=>u.id==='symmetric')?rules.symmetric:0;
            // Round steps: Symmetric and Safety Net change the excerpt totals, run buffs multiply.
            const runSteps=useMemo(()=>{
                const out=[];const exp=expandUnderstudy(upgrades);
                result.appliedRunUpgrades.forEach(name=>{
                    if(name==='Symmetric')out.push({label:'Symmetric',text:`+${symmetric} each`});
                    else if(name==='Safety Net')out.push({label:'Safety Net',text:'weakest lifted'});
                    else{const u=exp.find(x=>x.name===name);const e=u?.action?.(sentences);out.push({label:name,text:`×${fmtMult((1+((e?.multAdd)||0)*rules.runBonus)*rules.runTrigger)}`});}
                });
                return out;
            },[result,upgrades,sentences,rules,symmetric]);
            const plan=useMemo(()=>tallySchedule(details,bks,runSteps),[details,bks,runSteps]);
            const [t,setT]=useState(0);
            const done=t>=plan.end;
            const hover=useWordHover(sid=>details[sentences.findIndex(s=>s.id===sid)],rules,tipMode);
            const pops=usePops();
            const success=result.runTotal>=targetScore;
            useEffect(()=>{const dialog=dialogRef.current;dialog.showModal();return ()=>dialog.close();},[]);
            useEffect(()=>{if(done)return;const timer=setInterval(()=>setT(x=>Math.min(plan.end,x+32)),32);return ()=>clearInterval(timer);},[done,plan.end]);
            // Side effects of time passing: light each scored word, pop its points, tick.
            useEffect(()=>{
                const from=lastT.current;lastT.current=t;
                const root=ledgerRef.current;if(!root)return;
                const skipping=t-from>200;
                plan.ex.forEach((e,i)=>{
                    const host=root.querySelector(`[data-row="${i}"] [data-sid]`);if(!host)return;
                    e.wordsAt.forEach((at,j)=>{
                        if(at>t||at<=from)return;
                        host.querySelectorAll(`[data-w="${j}"]`).forEach(x=>x.classList.add('is-scored'));
                        if(!skipping){const el=host.querySelector(`[data-w="${j}"]`);pops.at(el,`+${details[i].words[j].total.toLocaleString()}`,details[i].words[j].wordEffects.length?'is-buffed':'is-words',800);if(j%2===0)AudioEngine.playTick?.();}
                    });
                    if(!skipping&&e.totalAt>from&&e.totalAt<=t)AudioEngine.playKey?.();
                });
                if(!skipping&&plan.finalAt>from&&plan.finalAt<=t)AudioEngine.playLock();
            },[t,plan,details,pops]);
            const skip=()=>{setT(plan.end);};
            const count=(from,to,at,dur=450)=>t<at?null:t>=at+dur?to:Math.round(from+(to-from)*(1-Math.pow(1-(t-at)/dur,3)));
            const finalShown=count(0,result.runTotal,plan.finalAt,550);
            return <dialog ref={dialogRef} className="tally-dialog is-simple is-live" aria-labelledby="tally-title" onCancel={e=>e.preventDefault()} onClick={e=>{if(!done&&!e.target.closest('button'))skip();}}>
                <header className="tally-head"><div><span className="print-label">Round {ante} of {MAX_ANTE}</span><h1 id="tally-title">Tally</h1></div>{!done && <button onClick={skip}>Skip</button>}</header>
                <section ref={ledgerRef} className="tally-ledger" aria-label="Excerpt scores" onMouseOver={hover.onMouseOver} onMouseLeave={hover.onMouseLeave} onClick={hover.onClick}>
                    {details.map((d,i)=>{const e=plan.ex[i],b=bks[i];
                        const shownWords=d.words.reduce((n,w,j)=>e.wordsAt[j]<=t?n+w.total:n,0);
                        const shownSteps=b.steps.filter((_,k)=>e.stepsAt[k]<=t);
                        const last=shownSteps[shownSteps.length-1];
                        const chips=last?last.chips:shownWords, mult=last?last.mult:1, active=t>=e.wordsAt[0]&&t<e.totalAt+300;
                        return <article key={d.id} data-row={i} className={`tally-row${active?' is-active':''}${t>=e.totalAt?' is-done':''}`}>
                            <p className="tally-quote"><RenderedText chars={sentences[i].chars} sid={sentences[i].id} matchState="NONE"/></p>
                            <div className="tally-math">
                                <span className="sb-box sb-words"><b key={chips}>{t>=e.wordsAt[0]?chips.toLocaleString():'—'}</b><small>words</small></span><i>×</i>
                                <span className="sb-box sb-mult"><b key={fmtMult(mult)}>{t>=e.wordsAt[0]?fmtMult(mult):'—'}</b><small>mult</small></span><i>=</i>
                                <strong key={t>=e.totalAt?'y':'n'} className={t>=e.totalAt?'is-in':''} title={result.finalSentenceTotals[i].toLocaleString()}>{t>=e.totalAt?formatScore(d.sentenceTotal):'—'}</strong>
                            </div>
                            {(shownSteps.length>0||(b.wordBuffs.length>0&&t>=e.wordsAt[e.wordsAt.length-1]))&&<ul className="tally-steps">
                                {t>=e.wordsAt[e.wordsAt.length-1]&&b.wordBuffs.map((x,k)=><li key={'w'+k} className="is-word">{x.label} <b>{x.text}</b></li>)}
                                {shownSteps.map((st,k)=><li key={k} className={`is-${st.kind}`}>{st.label} <b>{st.text}</b></li>)}</ul>}
                        </article>;
                    })}
                </section>
                <footer className="tally-footer">
                    <div className="tally-result"><div>
                        <span className="print-label">{!done?'Counting…':practice?'Practice complete':success?'Target cleared':'Below target'}</span>
                        <p className="tally-equation">{t>=plan.eqAt?result.finalSentenceTotals.map(n=>formatScore(n)).join(' × '):'—'}</p>
                        {runSteps.length>0&&<ul className="tally-steps is-run">{runSteps.map((st,k)=>t>=plan.runAt[k]&&<li key={k}>{st.label} <b>{st.text}</b></li>)}</ul>}
                    </div>
                        <strong className={done?'is-in':''} title={result.runTotal.toLocaleString()}>{finalShown===null?'—':formatScore(finalShown)}</strong></div>
                    {done&&!practice&&<span className={`tally-stamp ${success?'is-win':'is-loss'}`} aria-hidden="true">{success?(result.runTotal>=targetScore*10?'Crushed it':'Cleared'):'Short'}</span>}
                    {!practice&&done&&market&&(()=>{const pay=shopIncome(sentences,upgrades,market,{runScore:result.runTotal,target:targetScore});return <p className={`tally-pay ${success?'':'is-lost'}`}>{success?<>Payout <b>+{pay.earned}¢</b> · {pay.lastWords} words{pay.lastIncome.interest?` · interest +${pay.lastIncome.interest}¢`:''} · you’ll have <b>{market.credits+pay.earned}¢</b></>:<>No payout · {pay.lastWords} words would have paid +{pay.earned}¢</>}</p>;})()}
                    <div className="tally-next">{!practice&&done&&<p>Target <b>{formatScore(targetScore)}</b> · {success?'surplus':'short'} <b>{formatScore(Math.abs(result.runTotal-targetScore))}</b></p>}<button autoFocus disabled={!done} onClick={()=>onComplete(result.runTotal,success)}>{practice?'Finish practice':success?(ante>=MAX_ANTE?'Complete the run':'Visit the shop'):'See results'}</button></div>
                </footer>
                {hover.node}
                {pops.node}
            </dialog>;
        };

        /* ================================================================
           MAIN APP
           ================================================================ */
        const ScoreEffects = ({detail:d,rules,compact=false}) => {
            const count=key=>d.words.filter(w=>w.chars.some(c=>c[key])).length;
            const facts=[
                ['bold',count('b'),`Bold ×${rules.bold}`],['italic',count('i'),`Italic ×${rules.italic}`],['link',count('l'),`Link +${rules.link}`],
                ['citation',d.citationBlocks,`Citations ×${Number(Math.pow(rules.citation,d.citationBlocks).toFixed(3))}`]
            ];
            if(compact)return <div className="score-effects compact" aria-label="Active bonuses">{d.triggeredUpgrades.slice(0,3).map(name=><span key={name}>{name}</span>)}{d.triggeredUpgrades.length>3&&<span title={d.triggeredUpgrades.slice(3).join(', ')}>+{d.triggeredUpgrades.length-3}</span>}{d.chainMultiplier>1&&<span>Chain ×{Number(d.chainMultiplier.toFixed(2))}</span>}</div>;
            return <div className={`score-effects ${compact?'compact':''}`} aria-label="Active score contributions">{facts.filter(([,n])=>n>0).map(([key,n,label])=><span className={`effect-${key}`} key={key}>{label}<small>{n} {key==='citation'?'blocks':'words'}</small></span>)}
                {d.words.some(w=>w.lenMult>1)&&<span>Length ×{[...new Set(d.words.filter(w=>w.lenMult>1).map(w=>Number(w.lenMult.toFixed(2))))].sort((a,b)=>a-b).filter((x,i,a)=>i===0||i===a.length-1).join('–')}<small>{d.words.filter(w=>w.lenMult>1).length} words</small></span>}
                {d.words.some(w=>w.upgradeBase>0)&&<span>Word upgrades +{d.words.reduce((n,w)=>n+w.upgradeBase,0)}<small>base points</small></span>}
                {d.words.some(w=>w.upgradeMult>0)&&<span>Word format +{[...new Set(d.words.filter(w=>w.upgradeMult>0).map(w=>w.upgradeMult))].sort((a,b)=>a-b).filter((v,i,a)=>i===0||i===a.length-1).join('–')}<small>multiplier</small></span>}
                {d.sentenceEffects.some(e=>e.base)&&<span>Sentence +{d.sentenceEffects.reduce((n,e)=>n+e.base,0)}</span>}
                {d.sentenceEffects.some(e=>e.mult)&&<span>Sentence ×{Number(d.sentenceMultiplier.toFixed(3))}<small>combined</small></span>}
                {d.chainMultiplier>1&&<span className="effect-chain" title={d.triggeredUpgrades.join(' + ')}>Chain ×{Number(d.chainMultiplier.toFixed(2))}<small>{d.triggeredUpgrades.length} triggers</small></span>}
            </div>;
        };

        const ManualDialog = ({ onClose, children }) => {
            const ref = useRef(null);
            useEffect(() => {
                const previous = document.activeElement;
                const dialog = ref.current;
                dialog.showModal();
                return () => { dialog.close(); previous?.focus(); };
            }, []);
            return <dialog ref={ref} className="manual-dialog" aria-label="Rules" onCancel={e => { e.preventDefault(); onClose(); }}>{children}</dialog>;
        };

        const RestartDialog = ({practice,onCancel,onRestart}) => {
            const ref=useRef(null);
            useEffect(()=>{const prior=document.activeElement;ref.current.showModal();return ()=>{prior?.focus({preventScroll:true});};},[]);
            return <dialog ref={ref} className="restart-dialog" aria-labelledby="restart-title" aria-describedby="restart-description" onCancel={e=>{e.preventDefault();onCancel();}}>
                <h2 id="restart-title">Restart {practice?'practice':'this run'}?</h2>
                <p id="restart-description">{practice?'Start the three practice sentences again.':'Round 1. New article. Upgrades and credits reset.'}</p>

            </dialog>;
        };

        // Card text with ⟦…⟧ around the detail a family card names; RichText tints it.
        const RichText = ({ text }) => String(text ?? '').split(/⟦([^⟧]*)⟧/).map((part, i) => i % 2 ? <span key={i} className={/^[^\p{L}\p{N}]+$/u.test(part.replace(/ or /g, '')) ? 'rolled is-glyph' : 'rolled'}>{part}</span> : part);
        const upgradeDescription = (u, rules = DEFAULT_SCORING) => {
            if(u.template)return u.condition?runCondition(u.runBonus,u.condition,rules):u.richDesc||u.desc;
            if(SHOP_BALANCE[u.id]?.desc)return u.desc;
            const precise = {
                plain: '+3 word base when no character is bold, italic or linked. Bullet text can qualify.',
                capitalist: '+20 word base for an A–Z capital at the start of any word except the first word.',
                doubled: '+25 word base for adjacent repeated characters, ignoring letter case.',
                syllabic: '+0.10 to the sentence multiplier per word of 8+ characters, with no cap.',
                palindromic: '+140 word base when the letters and digits read the same backwards, ignoring case and punctuation; at least 3 letters or digits required.',
                consonantal: '+45 word base for words containing letters but no A, E, I, O or U; Y counts as a consonant.',
                tonal: '×1.35 round score when all three excerpts end with the same character (trailing spaces ignored).',
                vintage: '×1.2 round score if an excerpt contains a whole year from 1000 through 2029.',
                orthography: '×1.25 round score if no excerpt contains ! ? " ( ) [ ] { } — or –.',
                pyramidal: '×1.5 round score if each locked excerpt has more characters than the previous one, including spaces and citations.'
            };
            const runEffects = {
                mosaic: [8, 'the three excerpts collectively contain bold, italic, linked and citation characters'],
                encyclopedist: [11, 'all three excerpts come from different articles and each contains a citation'],
                rooted: [2, 'all three excerpts come from the same article'],
                divergent: [5, 'all three excerpts come from different articles'],
                pyramidal: [1.5, 'each excerpt has more characters than the previous one, in lock order (spaces and citations included)'],
                bibliophile: [3, 'every excerpt contains a citation'],
                orthography: [1.6, 'no excerpt contains ! ? " ( ) [ ] { } — or –'],
                vintage: [0.6, 'any excerpt contains a whole year from 1000 through 2029'],
                tonal: [2, 'all three excerpts end with the same character, ignoring trailing spaces']
            };
            if (u.id === 'symmetric') return `Add ${rules.symmetric} to each excerpt total before multiplying.${rules.runTrigger !== 1 ? ` Then multiply the round score by ${rules.runTrigger}.` : ''} Always applies.`;
            if (runEffects[u.id]) {
                const [bonus, condition] = runEffects[u.id];
                const factor = Number(((1 + bonus * rules.runBonus) * rules.runTrigger).toFixed(4));
                return `Multiply the round score by ${factor} when ${condition}.`;
            }
            const desc = (precise[u.id] || u.desc).replace(/Base Score/g, 'word base').replace(/Base/g, 'sentence base');
            return desc.endsWith('.') ? desc : desc + '.';
        };
        // Shop card copy: short and exact. The full wording stays in the card tooltip, the build list and the rules.
        const SHOP_BLURBS = {
            bookends:'+40 word base for the first and last word of each excerpt.',
            illuminated:'+0.75 word format multiplier for linked words of 8+ characters.',
            echo:'+70 sentence base per distinct repeated word, ignoring case.',
            footnotes:'+90 sentence base per citation block.',
            resonance:'+0.4 sentence multiplier per distinct word upgrade triggered. Needs two or more.',
            singularity:'+0.4 sentence multiplier per distinct word upgrade triggered. Needs three or more.',
            overprint:'+450 sentence base when an excerpt has a citation and bold or italic text.',
            breathing:'+8 seconds after each of your first two locks every round.',
            scout:'One free article link each round before the clock starts.',
            curator:'Shops and restocks offer five upgrades instead of four.',
            mulligan:'Your first restock in every shop is free.',
            naturalist:'+18 seconds on the first nature article each round.',

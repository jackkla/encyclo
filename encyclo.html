                return <main className="home">{rulebook}
                    <div className="home-inner">
                        <p className="home-kicker">A typing roguelike on Wikipedia</p>
                        <h1 className="home-wordmark">Ency<span>clo</span></h1>
                        <p className="home-lede">Land on a random article. Type three of its sentences, formatting and all. Their scores multiply. Clear eight rounds.</p>
                        <nav className="home-menu" aria-label="Game menu">
                            {completedPractice && <p className="home-note">Practice complete. You’re ready for a real run.</p>}
                            {savedRun && <button className="home-primary" onClick={resumeRun}>Continue<span>Round {savedRun.ante} of {MAX_ANTE}</span></button>}
                            <button className={savedRun ? 'home-option' : 'home-primary'} onClick={handleStartNewGame}>{savedRun ? 'New run' : 'Play'}<span>{savedRun ? 'Replaces your save' : 'Eight rounds'}</span></button>
                            <button className="home-option" onClick={startPractice}>Practice<span>No clock</span></button>
                            <button className="home-option" onClick={() => setShowCommandsModal(true)}>Rules<span>How scoring works</span></button>
                        </nav>
                    </div>
                </main>;
            }


            // LOADING SCREEN
            if (gameState === 'LOADING') {
                return <main className="home home-loading" role="status"><span className="home-spinner" aria-hidden="true"/><p>Finding an article…</p></main>;
            }

            // FETCH ERROR SCREEN
            if (gameState === 'FETCH_ERROR') {
                return <main className="home"><div className="home-inner">
                    <p className="home-kicker">A small interruption</p><h1 className="home-title">The article couldn’t load.</h1>
                    <p className="home-lede">Check your connection and try again, or play the practice round while Wikipedia is unavailable.</p>
                    <nav className="home-menu"><button className="home-primary" onClick={() => startRound()}>Try again<span>New article</span></button><button className="home-option" onClick={startPractice}>Practice<span>No clock</span></button><button className="home-option" onClick={() => setGameState('START')}>Home<span>Back to the start</span></button></nav>
                </div></main>;
            }

            // SHOP
            if (gameState === 'UPGRADE_SELECT') {
                const lastRoundScore = lockedSentences.length===3 ? scoreRun(lockedSentences,activeUpgrades,rules).runTotal : null;
                const nextClock = upgrades => roundTimeBudget(ante+1,upgrades,market)+articleTimeReward(articleMeta,upgrades).seconds;
                const income = market.lastIncome;
                const clockNow = nextClock(activeUpgrades);
                const owned = activeUpgrades.filter(u=>!u.temporary);
                const freeRestock = hasUpgrade(activeUpgrades,'mulligan')&&!market.freeUsed;
                const restockCost = freeRestock?0:3+market.rerolls*2;
                const itemFor = id => CONSUMABLES.find(c=>c.id===id);
                const shortBy = price => `Need ${price-market.credits}¢ more`;
                return (
                    <div className="shop print-stage">
                        {rulebook}
                        <header className="shop-head">
                            <div>
                                <p className="shop-kicker">Round {ante} cleared</p>
                                <h1 className="shop-title">Shop</h1>
                            </div>
                            <dl className="shop-ledger">
                                <div><dt>Round {ante+1} target</dt><dd>{formatScore(getRoundTarget(ante+1))}</dd></div>
                                <div className="is-clock"><dt>Clock</dt><dd>{clockNow}s</dd>
                                    <div className="shop-time" role="group" aria-label="Buy time">{TIME_OFFERS.map(o=><button key={o.key} onClick={()=>buyTime(o.key)} disabled={market.credits<o.price} title={o.key==='all'?`+${o.seconds}s on every future round (you have +${market.extraSeconds||0}s)`:`+${o.seconds}s on round ${ante+1} only (you have +${market.nextSeconds||0}s)`}>+{o.seconds}s <span>{o.label}</span><b>{o.price}¢</b></button>)}</div>
                                </div>
                                <div className="is-credits"><dt>Credits{market.earned>0&&<span>+{market.earned}</span>}</dt><dd aria-live="polite" aria-atomic="true">{market.credits}¢</dd></div>
                            </dl>
                        </header>

                        {income&&<section className="shop-receipt" aria-live="polite" aria-label="Round earnings">
                            <span className="shop-receipt-title">You earned <b>+{market.earned}¢</b></span>
                            <span>{income.excerpts.map((c,i)=><i key={i}>Excerpt {i+1} <b>+{formatCredits(c)}</b></i>)}</span>
                            <span>{income.words} words ÷ {WORDS_PER_CREDIT} = {formatCredits(income.base)}</span>
                            {income.royalty>0&&<span>Royalties +{formatCredits(income.royalty)}</span>}
                            {income.patron>0&&<span>Patron +{formatCredits(income.patron)}</span>}
                            {income.tips>0&&<span>Tip Jar +{income.tips}¢</span>}
                            {income.bounty>0&&<span>Bounty +{income.bounty}¢</span>}
                            {income.longForm>0&&<span>Long Form +{income.longForm}¢</span>}
                            {income.frugal>0&&<span>Frugal +{income.frugal}¢</span>}
                            {income.clear>0&&<span>Round cleared +{income.clear}¢</span>}
                            {income.interest>0&&<span>Interest +{income.interest}¢</span>}
                            {income.carryIn>0&&<span>Carried in +{formatCredits(income.carryIn)}</span>}
                            <span>Next round carries {formatCredits(income.carryOut)}</span>
                            <span className="shop-receipt-total">Run total {market.totalEarned||market.earned}¢ earned</span>
                        </section>}
                        <main className="shop-floor">
                            <section className="shop-shelf shop-upgrades" aria-labelledby="shop-upgrades">
                                <div className="shop-label"><h2 id="shop-upgrades">Upgrades</h2><span>{slotUse(owned)} of {BUFF_SLOTS} slots used</span></div>
                                <div className={`shop-cards cols-${Math.max(4,upgradeOptions.length)}`} style={{'--cols':Math.max(4,upgradeOptions.length)}}>
                                    {upgradeOptions.map(opt => {
                                        const sold=activeUpgrades.some(u=>u.id===opt.id);
                                        const price=shopPrice(opt), afford=market.credits>=price, slotsFull=!sold&&slotUse(owned)+(opt.slots||1)>BUFF_SLOTS;
                                        const canSwap=slotsFull&&slottedBuffs(owned).some(u=>market.credits+sellValue(u)>=price&&slotUse(owned.map(x=>x===u?opt:x))<=BUFF_SLOTS);
                                        const withUpgrade=sold?activeUpgrades:[...activeUpgrades,opt];
                                        const replay=(opt.type!=='UTILITY'||['chain','chain-forged'].includes(opt.id))&&lastRoundScore!==null?scoreRun(lockedSentences,withUpgrade,rules).runTotal:null;
                                        const clock=nextClock(withUpgrade);
                                        const preview=sold?null:replay!==null?{label:'Last round',from:formatScore(lastRoundScore),to:replay===lastRoundScore?null:formatScore(replay)}:clock!==clockNow?{label:'Clock',from:`${clockNow}s`,to:`${clock}s`}:null;
                                        const blurb=shopBlurb(opt,rules), full=upgradeDescription(opt,rules);
                                        return (
                                            <button key={opt.id} className={`shop-card type-${opt.type.toLowerCase()}${sold?' is-owned':''}`} onClick={() => slotsFull?setSwapFor(opt):handleSelectUpgrade(opt)} disabled={sold||(slotsFull?!canSwap:!afford)} title={slotsFull?'All buff slots are full: choose one to swap out.':blurb!==full?plainText(full):undefined}>
                                                <span className="shop-card-body">
                                                    <span className="shop-card-meta"><span className="shop-type">{opt.type}</span><span className={`rarity-badge rarity-${opt.rarity}`}>{RARITIES[opt.rarity].label}</span></span>
                                                    <h3><RichText text={opt.richName||opt.name}/></h3>
                                                    <p><RichText text={blurb}/></p>
                                                    {preview&&<span className="shop-preview"><small>{preview.label}</small>{preview.to?<span>{preview.from}<i aria-hidden="true">→</i><b>{preview.to}</b></span>:<span>No change</span>}</span>}
                                                </span>
                                                <span className="shop-buy"><b>{price}¢</b><span>{sold?'Owned':slotsFull?(canSwap?'Swap…':'Slots full'):afford?'Buy':shortBy(price)}</span></span>
                                                {sold&&<span className="shop-stamp" aria-hidden="true">Sold</span>}
                                            </button>
                                        );
                                    })}
                                </div>
                            </section>

                            <section className="shop-shelf" aria-labelledby="shop-packs">
                                <div className="shop-label"><h2 id="shop-packs">Letter packs</h2><span>Keep 1 character</span></div>
                                <div className="shop-row">{PACKS.map((pack,kind) => {
                                    const opened=(market.packsBought||[]).includes(kind), afford=market.credits>=pack.price, options=kind&&!packCandidates.some(u=>u.rarity!=='common')?0:packPoolSize;
                                    const desc=!options?(kind?'All uncommon-or-better characters are at level 3.':'Every character is at level 3.'):`Pick 1 of ${pack.size} characters. Common letters start at +6. ${kind ? 'Guaranteed uncommon or better. ' : ''}Rare symbols pay much more.`;
                                    return (
                                        <button key={kind} className={`shop-pack pack-${kind?'large':'small'}`} onClick={() => openBooster(kind)} disabled={!!market.pack||opened||!options||!afford}>
                                            <span className="shop-card-body">
                                                <span className="shop-pack-art" aria-hidden="true">{pack.art.map(g=><span key={g}>{g}</span>)}</span>
                                                <h3>{pack.name}</h3>
                                                <p>{desc}</p>
                                            </span>
                                            <span className="shop-buy"><b>{pack.price}¢</b><span>{opened?'Opened':!options?'Sold out':afford?'Open':shortBy(pack.price)}</span></span>
                                        </button>
                                    );
                                })}</div>
                            </section>

                            <section className="shop-shelf" aria-labelledby="shop-items">
                                <div className="shop-label"><h2 id="shop-items">Items</h2><span>Single use</span></div>
                                <div className="shop-row">
                                    {market.stock.map(id => {
                                        const item=itemFor(id), full=bagCount(market.bag)>=BAG_SLOTS, afford=market.credits>=item.price;
                                        return (
                                            <button key={id} className={`shop-item item-${id}`} onClick={() => buyConsumable(item)} disabled={full||!afford}>
                                                <span className="shop-card-body"><ItemIcon id={id}/><h3>{item.name}</h3><p>{ITEM_BLURBS[id]||item.desc}</p></span>
                                                <span className="shop-buy"><b>{item.price}¢</b><span>{full?'Bag full':afford?'Buy':shortBy(item.price)}</span></span>
                                            </button>
                                        );
                                    })}
                                    {Array.from({length:Math.max(0,2-market.stock.length)},(_,i)=><div key={`sold-${i}`} className="shop-item is-empty">Sold out</div>)}
                                </div>
                            </section>
                        </main>

                        <BuildRail upgrades={owned} rules={rules} onSell={sellBuff} onMove={moveBuff}/>
                        <footer className="shop-foot">
                            <div className="shop-kit">
                                <div className="shop-bag" role="group" aria-label={`Bag, ${bagCount(market.bag)} of 3. Use items mid-round with ${ITEM_KEY_HINT}.`}>
                                    <span className="shop-foot-label">Bag</span>
                                    {normalizeBag(market.bag).map((id,i) => {
                                        const item=id&&itemFor(id);
                                        return item
                                            ? <span key={i} className={`shop-slot item-${id}`} title={`Slot ${i+1}: ${item.name} — ${item.desc} Use mid-round with ${itemKeyLabel(i)}.`}><kbd>{itemKeyLabel(i)}</kbd><ItemIcon id={id}/><span>{item.name}</span></span>
                                            : <span key={i} className="shop-slot is-empty" title={`Slot ${i+1} is empty (${itemKeyLabel(i)})`}><kbd>{i+1}</kbd></span>;
                                    })}
                                </div>
                                <BuildDrawer upgrades={owned} rules={rules} onSell={sellBuff} onMove={moveBuff}/>
                            </div>
                            <div className="shop-exit">
                                <button className="shop-link" onClick={() => setShowCommandsModal(true)}>Rules</button>
                                <button className="shop-link" onClick={leaveRun}>Save &amp; leave</button>
                                <button className="shop-restock" onClick={restockShop} disabled={market.credits<restockCost} title="Swap in new upgrades and items">Restock <b>{freeRestock?'Free':`${restockCost}¢`}</b></button>
                                <button className="shop-go" onClick={leaveShop} disabled={!!market.pack}>Round {ante+1}<span aria-hidden="true">→</span></button>
                            </div>
                        </footer>

                        {swapFor&&<SwapDialog opt={swapFor} owned={owned} credits={market.credits} locked={lockedSentences} lastScore={lastRoundScore} rules={rules} onSwap={id=>swapBuff(swapFor,id)} onClose={()=>setSwapFor(null)}/>}
                        {market.pack&&<PackDialog pack={market.pack} sentences={shopSentences} owned={activeUpgrades} rules={rules} locked={lockedSentences} lastScore={lastRoundScore} onChoose={chooseBooster} onSkip={() => updateMarket({...marketRef.current,pack:null})}/>}
                    </div>
                );
            }

            // MAIN PLAY SCREEN
            const timePercentage = Math.min(100,(timeLeft / Math.max(1,roundClock)) * 100);
            const timeColorClass = timeLeft <= 10 ? 'bg-red-600' : (timeLeft <= 30 ? 'bg-orange-500' : 'bg-blue-600');
            

            return (
                <div className="game-shell flex flex-col h-screen overflow-hidden relative font-sans" style={{backgroundColor: '#f4f6fc'}}>
                    {/* Threshold flash overlay */}
                    {flash && (
                        <div className="absolute inset-0 pointer-events-none z-50" style={{
                            background: flash === 'mid'   ? 'radial-gradient(circle at 50% 50%, transparent 40%, rgba(234,88,12,0.18) 100%)'
                                      : flash === 'late'  ? 'radial-gradient(circle at 50% 50%, transparent 30%, rgba(220,38,38,0.22) 100%)'
                                      : 'radial-gradient(circle at 50% 50%, transparent 20%, rgba(220,38,38,0.32) 100%)',
                            animation: flash === 'final' ? 'flash-pulse 1s ease-in-out infinite' : 'flash-once 0.7s ease-out forwards'
                        }} />
                    )}
                    {/* Final-phase red border ring */}
                    {flash === 'final' && (
                        <div className="absolute inset-0 pointer-events-none z-50" style={{
                            boxShadow: 'inset 0 0 0 4px rgba(220,38,38,0.45)',
                            animation: 'flash-pulse 1s ease-in-out infinite'
                        }} />
                    )}


                    {/* Top HUD — minimal, transparent */}
                    <div className="hud-header z-10 shrink-0 relative">
                        {/* Timer progress bar — full width, sits at very top */}
                        <div className="w-full h-1 bg-zinc-300/40 relative">
                            <div className={`h-full origin-left transition-transform duration-1000 ease-linear ${timeColorClass}`} style={{ transform: `scaleX(${timePercentage/100})` }}></div>
                            {/* third markers */}
                            <div className="absolute top-0 bottom-0 w-px bg-zinc-900/40" style={{left: '33.33%'}}></div>
                            <div className="absolute top-0 bottom-0 w-px bg-zinc-900/40" style={{left: '66.66%'}}></div>
                        </div>

                        <div className="play-toolbar flex justify-between items-center gap-2">
                            {/* Left: ante + title */}
                            <div className="flex items-center gap-3 min-w-0 flex-1"><span className="hud-brand" aria-hidden="true">Ency<span>clo</span></span>
                                {isPractice&&<span className="round-pill">Practice</span>}
                                <h2 className="text-lg md:text-xl font-serif font-bold text-zinc-900 truncate min-w-0">
                                    {article}
                                </h2>
                                {navHistory.length > 0 && (
                                    <button onClick={handleBack} className="text-[10px] font-mono font-bold text-zinc-500 hover:text-blue-700 uppercase tracking-[0.15em] shrink-0" title={navHistory.join(' / ')}>
                                        ← back
                                    </button>
                                )}
                                {isNavigating && <span className="text-blue-600 font-mono animate-pulse text-[10px] uppercase tracking-widest shrink-0">…</span>}

                            </div>

                            {/* Right: score · timer · controls */}
                            <div className="play-actions flex items-center gap-2 shrink-0">
                                <span className={`font-mono font-black tabular-nums text-2xl leading-none ${
                                    isDevMode             ? 'text-orange-600' :
                                    timeLeft <= 10        ? 'text-red-600 animate-pulse' :
                                    timeLeft <= 30        ? 'text-orange-600' : 'text-zinc-900'
                                }`}>
                                    {isPractice ? 'Untimed' : `${isDevMode||menuOpen||restartOpen ? 'Ⅱ ' : ''}${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, '0')}`}
                                </span>
                                <button type="button" className="restart-action" title="Restart from round 1" disabled={isNavigating} onClick={()=>setRestartOpen(true)}>↻ <span>Restart</span></button>
                                <details className="play-menu" onToggle={e=>{if(e.target===e.currentTarget)setMenuOpen(e.currentTarget.open);}}><summary aria-label="Game menu">Menu ≡</summary><div className="play-menu-panel" onClick={e=>{if(e.target.closest('button'))e.currentTarget.parentElement.open=false;}}><div className="menu-heading">{isPractice?'Practice':'Clock paused'}</div>                                <button
                                    onClick={() => { setIsDevMode(prev => !prev); setShowSandbox(false); }} aria-pressed={isDevMode}
                                    className={isDevMode ? 'is-on' : ''}
                                    title="Dev mode pauses the timer"
                                >{isDevMode ? 'Dev mode · paused' : 'Dev mode'}</button>
                                <button onClick={leaveRun} disabled={isNavigating}>{isPractice ? 'Exit practice' : 'Save & leave'}</button>
                                {isDevMode && <button onClick={() => setShowSandbox(true)} className="is-on">Scoring sandbox</button>}
                                <button
                                    onClick={() => { const next = !muted; setMuted(next); AudioEngine.setMuted(next); }}
                                                                        aria-label={muted ? "Unmute sound" : "Mute sound"} aria-pressed={muted} title={muted ? "Unmute" : "Mute"}
                                >
                                    {muted ? 'Sound off' : 'Sound on'}
                                </button>
                                <button onClick={toggleHeat} aria-pressed={showHeat} title="Mark the best unused excerpts on the page for your current buffs: filled for the top 3, hollow for the next 5">Score heat<small>{showHeat?'on':'off'}</small></button>
                                <button onClick={toggleWordTips} aria-pressed={wordTipMode==='hover'} title="How to open a word's score card: click the word, or just point at it">Word scores<small>{wordTipMode==='click'?'on click':'on hover'}</small></button>
                                <button
                                    onClick={() => setShowCommandsModal(true)}
                                    aria-label="Open rules"
                                >Rules</button>
                                {!isPractice&&<div className="bag-menu"><div className="menu-heading">Bag {bagCount(market.bag)}/3 · {market.credits}¢</div>{bagCount(market.bag)?normalizeBag(market.bag).map((id,i)=>{if(!id)return <p key={i} className="bag-empty-slot"><kbd className="menu-kbd">{itemKeyLabel(i)}</kbd>Empty slot</p>;const item=CONSUMABLES.find(c=>c.id===id),active=item.effect&&hasUpgrade(activeUpgrades,item.effect);return <button key={i} onClick={()=>useConsumable(i)} disabled={isNavigating||active}><b><kbd className="menu-kbd">{itemKeyLabel(i)}</kbd>{active?'Active this round':`Use ${item.name}`}</b><small>{item.desc}</small></button>}):<p>Buy single-use supplies at the next shop.</p>}</div>}
                                <details className="build-menu"><summary>Your build <b>{activeUpgrades.length}</b></summary><div>{activeUpgrades.length?activeUpgrades.map(u=><article key={u.id}><span className={`rarity-badge rarity-${u.rarity}`}>{RARITIES[u.rarity].label}</span><h3><RichText text={u.richName||u.name}/>{u.temporary?' · this round':''}</h3><p><RichText text={upgradeDescription(u,rules)}/></p></article>):<p>No upgrades yet.</p>}</div></details>
                                {(hasUpgrade(activeUpgrades,'naturalist')||hasUpgrade(activeUpgrades,'historian'))&&<p className="menu-article-type">Article · {articleTraits(articleMeta).nature?'nature ':''}{articleTraits(articleMeta).history?'history':''}{!articleTraits(articleMeta).nature&&!articleTraits(articleMeta).history?'other':''}</p>}
                                {!roundStarted&&hasUpgrade(activeUpgrades,'scout')&&!scoutUsed&&<p className="menu-article-type">Free scouting click ready</p>}
                                </div></details>
                            </div>
                        </div>
                        {!isPractice&&<RoundCard ante={ante} target={targetScore} locked={lockedSentences} live={liveExcerpt} progress={liveExcerpt?buffer.length/liveExcerpt.chars.length:0} upgrades={activeUpgrades} rules={rules} aim={requiredPace} bonus={bonusOutlook.multiplier} forecast={roundForecast}/>}
                        <section className="score-hud" aria-label="Round score dashboard">
                            <div className="score-hud-metrics">
                                <div className="current-excerpt-score" aria-live="polite" aria-atomic="true"><span>This sentence</span><ScoreBar detail={liveDetail}/>{!isPractice&&liveIncome&&<em className="hud-earn" title={`${liveIncome.words} words · paid if the round clears`}>+{formatCredits(liveIncome.credits)}</em>}{(liveDetail||typedWords>0)&&<em className="hud-words" title="Words typed / words in this sentence">{liveDetail?`${Math.min(typedWords,liveDetail.words.length)}/${liveDetail.words.length}`:typedWords} {(liveDetail?liveDetail.words.length:typedWords)===1?'word':'words'}</em>}
                                {typeEta&&buffer.length<(liveExcerpt?.chars.length||0)&&<em className={`hud-eta${!isPractice&&!isDevMode&&typeEta.secs>timeLeft?' is-late':''}`} title={`About ${typeEta.secs}s to finish at ${typeEta.wpm} WPM (your pace this round), including format switches.`}>{!isPractice&&!isDevMode&&typeEta.secs>timeLeft?`~${typeEta.secs}s · won’t fit`:`~${typeEta.secs}s left`}</em>}</div>
                                {!isPractice&&<div className="hud-credits" title={`${market.credits}¢ in hand. Locked excerpts pay ${formatCredits(pendingCredits)} when the round clears (1¢ per ${WORDS_PER_CREDIT} words${hasUpgrade(activeUpgrades,'patron')||hasUpgrade(activeUpgrades,'royalties')?', plus bonuses':''}).`}><span>Credits</span><strong>{market.credits}¢</strong><em className="hud-earn">{pendingCredits>0?`+${formatCredits(pendingCredits)} on clear`:''}</em></div>}
                                {!isPractice&&bagCount(market.bag)>0&&<div className="quick-bag" role="group" aria-label={`Items — use with ${ITEM_KEY_HINT}`}>
                                    {normalizeBag(market.bag).map((id,k)=>{const item=CONSUMABLES.find(c=>c.id===id);if(!item)return <span key={`empty-${k}`} className="qb-slot is-empty" aria-label={`Slot ${k+1} empty`}><kbd>{itemKeyLabel(k)}</kbd></span>;const active=item.effect&&hasUpgrade(activeUpgrades,item.effect);const nudged=itemNudge?.slot===k;
                                        return <button key={`${k}-${item.id}-${nudged?itemNudge.n:0}`} type="button" data-rarity={item.rarity} className={`qb-slot ${active?'is-active':''} ${nudged?'nudge':''}`}
                                            onMouseDown={e=>e.preventDefault()} onClick={()=>{useItemByKey(k);document.querySelector('[data-typing-surface]')?.focus({preventScroll:true});}}
                                            disabled={isNavigating} aria-keyshortcuts={`Control+${k+1}`}
                                            title={`Slot ${k+1}: ${item.name}${active?' (already active this round)':''}\n${item.desc}\nShortcut: ${itemKeyLabel(k)}`}>
                                            <kbd>{itemKeyLabel(k)}</kbd><ItemIcon id={item.id}/><span className="qb-name">{item.name}</span><b>{active?'ON':ITEM_TAGS[item.id]}</b>
                                        </button>;})}
                                </div>}

                            </div>
                            <div className="score-feedback"><span className="excerpt-counter">Sentence {Math.min(3,lockedSentences.length+1)} / 3</span>{(<div className="hud-locks" aria-label="Locked excerpt scores">{[0,1,2].map(i=>{const locked=lockedSentences[i];return <span key={i} className={locked?'locked':i===lockedSentences.length?'active':''} title={locked?locked.chars.map(c=>c.c).join(''):''}><b>0{i+1}</b>{locked?formatScore(scoreSentence(locked,activeUpgrades,rules).sentenceTotal):'—'}{locked&&!isPractice&&<small className="lock-earn">+{formatCredits(lockedIncome[i].credits)}</small>}{locked&&<i aria-label="Locked">✓</i>}</span>;})}</div>)}</div>
                            

                        </section>
                        {/* Subtle bottom hairline */}
                        <div className="absolute bottom-0 left-0 right-0 h-px bg-zinc-900/15"></div>
                        {!isPractice&&utilityNotice&&<div className="utility-status under-hud" role="status"><span>{utilityNotice}</span></div>}
                    </div>

                    {isPractice && <div className="practice-guide" role="status"><span className="eyebrow">Practice / {Math.min(lockedSentences.length + 1, 3)} of 3</span><strong>{lockedSentences.length === 0 ? 'Curiosity opens doors. / PLAIN' : lockedSentences.length === 1 ? 'Small details matter. / BOLD' : 'Follow the unexpected. / ITALIC'}</strong></div>}
                    
                    {saveNotice.startsWith('Saving is unavailable') && <div role="alert" className="px-5 py-2 bg-orange-50 text-orange-800 text-sm">{saveNotice}</div>}
                    {navigationError && <div role="status" className="px-5 py-2 bg-red-50 text-red-800 text-sm flex justify-between gap-2">{navigationError}<button onClick={() => setNavigationError('')} aria-label="Dismiss message">✕</button></div>}
                    
                    {/* Wikipedia article canvas */}
                    {!isPractice&&<BuildRail upgrades={activeUpgrades} rules={rules} detail={liveDetail} fired={liveDetail?.triggeredUpgrades||[]} lost={bonusOutlook.lost.map(u=>u.name)}/>}
                    {articleHover.node}
                    {pops.node}
                    <div className="flex-1 overflow-y-auto px-6 pt-3 pb-24 font-article relative" onScroll={articleHover.clear} style={{
                        backgroundImage: halftoneBg ? `url("${halftoneBg}")` : 'none',
                        backgroundRepeat: 'repeat-y',
                        backgroundSize: '100% auto',
                        backgroundPosition: halftoneBg ? 'top center' : undefined,
                        backgroundAttachment: halftoneBg ? 'local' : undefined,
                        backgroundColor: '#efe9dc',
                        transition: 'background-image 0.6s ease'
                    }}>
                        <div className="max-w-4xl mx-auto bg-white border-2 border-zinc-900 p-8 md:p-10 wiki-content relative" onClick={e=>{handleWikiClick(e);articleHover.onClick?.(e);}} onMouseOver={articleHover.onMouseOver} onMouseLeave={articleHover.onMouseLeave}
                             style={{boxShadow: '6px 6px 0 -1px #d6d3d1', borderRadius:'4px 16px 6px 12px / 12px 6px 16px 4px', zIndex: 1}}>
                            <div className="tape absolute -top-2 left-1/2 transform -translate-x-1/2 w-24 h-5 wobble-l"></div>

                            {contentBlocks.map((block) => {
                                if (block.type === 'HTML') {
                                    if (block.fragments && block.fragments.length > 0) {
                                        return (
                                            <HtmlBlockWithFragments
                                                key={block.id}
                                                block={block}
                                                lockedSentences={lockedSentences}
                                                usedSentenceIds={usedSentenceIds}
                                                matchStates={matchStates}
                                                typedLength={buffer.length}
                                                onNavigate={handleNavigation}
                                                loupeIds={loupeIds}
                                                heatMap={heatMap}
                                            />
                                        );
                                    }
                                    return <div key={block.id} dangerouslySetInnerHTML={{ __html: block.html }} style={{ display: 'contents' }} />;
                                }

                                const innerContent = block.sentences.map((s) => {
                                    let state = 'NONE';
                                    if      (lockedSentences.some(ls => ls.id === s.id)) state = 'GREEN';
                                    else if (usedSentenceIds.has(s.id))                  state = 'USED';
                                    else if (matchStates[s.id] === 'COMPLETE')           state = 'COMPLETE';
                                    else if (matchStates[s.id] === 'YELLOW')             state = 'YELLOW';

                                    return (
                                        <React.Fragment key={s.id}>
                                            <RenderedText chars={s.chars} sid={s.id} mark={state === 'NONE' && loupeIds.has(s.id)} heat={state === 'NONE' ? heatMap?.get(s.id) : undefined} matchState={state} typedLength={state === 'YELLOW' ? buffer.length : null} onNavigate={handleNavigation} />
                                            {' '}
                                        </React.Fragment>
                                    );
                                });

                                if (block.tag === 'blockquote') return <blockquote key={block.id}>{innerContent}</blockquote>;
                                return <p key={block.id}>{innerContent}</p>;
                            })}
                            <div className="clear-both"></div>
                        </div>
                    </div>

                    {/* Bottom control deck */}
                    <div className="typing-deck shrink-0 z-20 relative" style={{backgroundColor: '#f4f6fc'}}>
                        {(charPanel.open||charPanel.pinned)&&specialChars.length>0&&<CharPanel entries={specialChars} prefix={charPanel.prefix} pinned={charPanel.pinned} onPick={c=>insertSpecialRef.current?.(c)} onClose={()=>setCharPanel({open:false,pinned:false,prefix:''})}/>}
                        {idleHint&&<div className="idle-hint" role="status"><span className="print-label">{idleHint.correction?'Fix the last character':'Next character'}</span><kbd>{idleHint.char.c===' '?'SPACE':idleHint.char.c}</kbd><span>{idleHint.correction?'Backspace, then ':''}{hintByChar.get(idleHint.char.c)?`Ctrl+${hintByChar.get(idleHint.char.c).toUpperCase().split('').join(', Ctrl+')}. `:''}{getComposeSequence(idleHint.char.c)?`Compose: ${getComposeSequence(idleHint.char.c)}. `:''}{[['b','Bold'],['i','Italic'],['l','Link'],['cit','Citation'],['bul','Bullet']].filter(([k])=>!!format[k]!==!!idleHint.char[k]).map(([k,label])=>`${label} ${idleHint.char[k]?'on':'off'}`).join(' · ')||([['b','Bold'],['i','Italic'],['l','Link'],['cit','Citation'],['bul','Bullet']].filter(([k])=>idleHint.char[k]).map(([,label])=>label).join(' + ')||'Plain text')}</span></div>}
                        <div className="absolute top-0 left-0 right-0 h-px bg-zinc-900/15"></div>
                        <div className="px-5 py-2 space-y-2">
                            {/* Format toggles + input buffer */}
                            <div className="typing-row flex items-stretch gap-2">
                                <div className="format-controls" role="group" aria-label="Text formatting">
                                    {[
                                        ['b','B','Bold','B'],['i','I','Italic','I'],['l','↗','Link','L'],['cit','[ ]','Citation',';'],['bul','•','Bullet','O']
                                    ].map(([key,glyph,label,shortcut])=><button type="button" key={key} aria-label={label} aria-pressed={format[key]}
                                        className={`format-key format-key-${key}`} style={{'--key-ink':key==='cit'?'#576579':FORMAT_PALETTE[FORMAT_BITS[key]]}}
                                        title={`${label} · Ctrl / ⌘ + ${shortcut}`} onClick={()=>toggleFormat(key)}><b aria-hidden="true">{glyph}</b><span>{label}</span></button>)}
                                    <span className="format-divider" aria-hidden="true"/>
                                    <button type="button" aria-label="Compose character" aria-pressed={isComposing} className="compose-key" onClick={()=>{setIsComposing(!isComposing);setComposeSeq('');document.querySelector('[data-typing-surface]')?.focus({preventScroll:true});}} title="Compose an accent · Ctrl / ⌘ + M">é<span>Compose</span></button>
                                    {specialChars.length>0&&<button type="button" className={`char-toggle ${charPanel.open||charPanel.pinned?'is-open':''}`} aria-expanded={charPanel.open||charPanel.pinned} aria-label="Special characters" title="Special characters · hold Ctrl" onClick={()=>setCharPanel(p=>p.pinned||p.open?{open:false,pinned:false,prefix:''}:{open:true,pinned:true,prefix:''})}>Ω</button>}
                                    <span className="active-ink" style={{color:formatInk(format).color,'--format-ribbon':formatInk(format).ribbon}} role="status" title={formatInk(format).label}>{isRed?'Check text & format':matchStates._completeCount?'Ready to lock':formatInk(format).label}</span>
                                </div>

                                <div data-typing-surface aria-invalid={isRed} tabIndex={0} role="textbox" aria-label="Type an excerpt" aria-multiline="false" className={`flex-1 min-h-[44px] min-w-0 h-11 bg-white/80 backdrop-blur-sm border-2 overflow-x-auto whitespace-nowrap px-3 flex items-center font-article text-lg no-scrollbar relative transition-all
                                    ${isRed ? 'input-error text-red-900 bg-red-50/90 border-red-600' : (buffer.length > 0 || isComposing ? 'border-orange-600' : 'border-zinc-900/30')}
                                `} style={{borderRadius:'3px 10px 4px 8px'}}>
                                    {buffer.length === 0 && !isComposing ? (
                                        <span className="typing-placeholder">{!roundStarted?'Type a sentence from the article…':'Choose another sentence…'}</span>
                                    ) : (
                                        <div className="flex items-center min-w-max input-buffer">
                                            <RenderedText chars={buffer} matchState="NONE" />
                                            {isComposing && (
                                                <span className="ml-2 px-2 py-0.5 bg-purple-100 text-purple-900 font-mono text-sm flex items-center h-7 font-bold" style={{borderRadius:'3px'}}>
                                                    {composeSeq}
                                                    <span className="w-1.5 h-3.5 bg-purple-600 animate-pulse ml-1 inline-block"></span>
                                                </span>
                                            )}
                                            {!isComposing && (() => {
                                                const ac = matchStates._activeCount || 0;
                                                const cc = matchStates._completeCount || 0;
                                                let bg = 'bg-orange-600', w = 'w-2', extra = 'animate-pulse opacity-90';
                                                if (cc >= 1)        { bg = 'bg-green-500';  w = 'w-2.5'; extra = 'opacity-100 animate-pulse'; }
                                                else if (ac === 0 && buffer.length > 0) { bg = 'bg-red-600'; w = 'w-2'; extra = 'animate-pulse'; }
                                                else if (ac === 1)  { bg = 'bg-orange-600'; w = 'w-2'; extra = 'opacity-100'; }
                                                else if (ac > 5)    { bg = 'bg-zinc-400';   w = 'w-px'; extra = 'animate-pulse opacity-60'; }
                                                else if (ac > 1)    { bg = 'bg-orange-400'; w = 'w-1';  extra = 'animate-pulse opacity-80'; }
                                                return <div ref={inputEndRef} className={`${w} h-5 ${bg} ml-1 inline-block ${extra}`} title={`${ac} possible match${ac === 1 ? '' : 'es'}`}></div>;
                                            })()}
                                        </div>
                                    )}
                                </div>
                                <button type="button" className="clear-action" aria-label="Clear sentence" title="Clear sentence and formatting · Esc" disabled={!buffer.length&&!isComposing&&!Object.values(format).some(Boolean)} onClick={clearDraft}>Clear</button>
                                <button className="lock-action" disabled={isRed||!matchStates._completeCount||gameState!=='PLAYING'} onClick={lockCurrentExcerpt} aria-label="Lock complete excerpt" title="Match a whole sentence and its formatting, then lock">Lock ↵</button>
                            </div>
                        </div>
                    </div>

                    {restartOpen&&<RestartDialog practice={isPractice} onCancel={()=>setRestartOpen(false)} onRestart={isPractice?startPractice:handleStartNewGame}/>}
                    {showSandbox && <ScoringSandbox rules={scoringRules} onChange={setScoringRules} onClose={() => setShowSandbox(false)} sentences={flatSentences} locked={lockedSentences} upgrades={activeUpgrades} target={targetScore} applied={useCustomScoring} onApply={setUseCustomScoring} article={article} categories={articleMeta.categories || []} ante={ante} onRules={() => { setShowSandbox(false); setShowCommandsModal(true); }} />}
                    {rulebook}

                    {/* Scoring overlay */}
                    {gameState === 'SCORING' && (
                        <ScoringOverlay
                            sentences={lockedSentences}
                            onComplete={handleCompleteRun}
                            targetScore={targetScore}
                            practice={isPractice}
                            ante={ante}
                            upgrades={activeUpgrades} rules={rules} market={market} tipMode={wordTipMode}
                        />
                    )}

                    {(gameState === 'LOST' || gameState === 'VICTORY') && (
                        <div className="result-screen">
                            <section className={`result-card ${gameState === 'VICTORY' ? 'won' : 'lost'}`} aria-labelledby="result-title">
                                <p className="result-kicker">{gameState === 'VICTORY' ? 'All eight rounds cleared' : timeLeft <= 0 ? 'Out of time' : 'Below the target'}</p>
                                <h1 id="result-title">{gameState === 'VICTORY' ? 'You broke the scale.' : 'Run over.'}</h1>
                                <dl className="result-stats">
                                    <div><dt>Round reached</dt><dd>{ante} of {MAX_ANTE}</dd></div>
                                    <div><dt>Banked score</dt><dd>{formatScore(totalScore)}</dd></div>
                                    <div><dt>Credits earned</dt><dd>{market.totalEarned || 0}¢</dd></div>
                                </dl>
                                <button className="result-primary" onClick={handleStartNewGame}>Play again</button>
                                <button className="result-link" onClick={() => setShowCommandsModal(true)}>Rules</button>
                            </section>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

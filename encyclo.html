        function extractSentencesFromParagraph(pEl, pageId, initialCounter) {
            let sentenceIdCounter = initialCounter;
            const cleaned = flattenToChars(pEl);

            // Split into sentences on .!? followed by trailing citations + space + capital letter
            const sentences = [];
            let current = [];
            let i = 0;
            while (i < cleaned.length) {
                if (current.length === 0 && cleaned[i].c === ' ') { i++; continue; }
                current.push(cleaned[i]);

                if (/[.!?]/.test(cleaned[i].c)) {
                    let j = i + 1;
                    const trailingCit = [];
                    while (j < cleaned.length && cleaned[j].cit) {
                        trailingCit.push(cleaned[j]);
                        j++;
                    }

                    let hasSpace = false;
                    if (j < cleaned.length && cleaned[j].c === ' ') { hasSpace = true; j++; }

                    const atEnd = j >= cleaned.length;
                    const startsNew = hasSpace && !atEnd && /[A-Z]/.test(cleaned[j].c);

                    if (atEnd || startsNew) {
                        if (trailingCit.length > 0) current.push(...trailingCit);
                        sentences.push({ id: `${pageId}-${sentenceIdCounter++}`, chars: current });
                        current = [];
                        i = j - 1;
                    }
                }
                i++;
            }
            if (current.length > 0) {
                sentences.push({ id: `${pageId}-${sentenceIdCounter++}`, chars: current });
            }
            return sentences;
        }

        /* ================================================================
           RENDERED TEXT — formatted span tree from char array
           ================================================================ */
        const RenderedText = React.memo(({ chars, matchState, onNavigate, typedLength }) => {
            // Group consecutive chars sharing the same format into spans
            const spans = useMemo(() => {
            const spans = [];
            let buf = [];
            let curFmt = null;
            let curTarget = null;

            const flush = () => {
                if (buf.length > 0) {
                    spans.push({ text: buf.join(''), fmt: curFmt, target: curTarget });
                    buf = [];
                }
            };

            chars.forEach(charObj => {
                const fmtStr = `${charObj.b}-${charObj.i}-${charObj.l}-${charObj.cit}-${!!charObj.bul}`;
                if (fmtStr !== curFmt || charObj.target !== curTarget) {
                    flush();
                    curFmt = fmtStr;
                    curTarget = charObj.target;
                }
                buf.push(charObj.c);
            });
            flush();
            return spans;
            }, [chars]);

            const containerClass =
                matchState === 'GREEN'    ? 'state-locked'   :
                matchState === 'USED'     ? 'state-used'     :
                matchState === 'COMPLETE' ? 'state-complete' :
                matchState === 'YELLOW'   ? 'state-yellow'   : '';

            return (
                <span className={`excerpt-text relative ${containerClass}`}>
                    {(() => {
                        let charOffset = 0;
                        return spans.map((span, idx) => {
                            const [b, i, l, cit, bul] = span.fmt.split('-');
                            const classes = [];
                            if (b === 'true')   classes.push('fmt-bold');
                            if (i === 'true')   classes.push('fmt-italic');
                            if (l === 'true')   classes.push('fmt-link');
                            if (cit === 'true') classes.push('fmt-cit');
                            if (bul === 'true') classes.push('fmt-bullet');

                            // Only split at the typing boundary, not at every character.
                            // The range-based inspector still reads the exact hovered character.
                            const typed = Math.max(0,Math.min(span.text.length,(typedLength || 0)-charOffset));
                            charOffset += span.text.length;
                            const inner = <span className="typeable-char" data-fmt={span.fmt}>
                                {typed > 0 && <span className="char-typed">{span.text.slice(0,typed)}</span>}
                                {span.text.slice(typed)}
                            </span>;

                            // Render hyperlinks as clickable anchors (except inside locked or fully-typed sentences)
                            if (l === 'true' && span.target && onNavigate && matchState !== 'GREEN' && matchState !== 'USED' && matchState !== 'COMPLETE') {
                                return (
                                    <a
                                        key={idx}
                                        className={classes.join(' ') + " cursor-pointer hover:bg-blue-100/50 hover:text-blue-900 rounded px-0.5 transition-colors"}
                                        onClick={(e) => { e.preventDefault(); e.stopPropagation(); onNavigate(span.target); }}
                                        title={`Navigate to [ ${span.target} ]`}
                                    >
                                        {inner}
                                    </a>
                                );
                            }

                            return <span key={idx} className={classes.join(' ')}>{inner}</span>;
                        });
                    })()}
                </span>
            );
        });

        /* ================================================================
           HTML BLOCK W/ FRAGMENTS — preserves raw Wikipedia layout
           (infoboxes, tables, captions, headings, hatnotes) and portals
           a typeable RenderedText into each [data-frag-id] node.
           ================================================================ */
        const HtmlBlockWithFragments = ({ block, lockedSentences, usedSentenceIds, matchStates, typedLength, onNavigate }) => {
            const containerRef = React.useRef(null);
            const [portalTargets, setPortalTargets] = useState([]);

            // After the raw HTML mounts, locate every fragment-bearing node,
            // strip its original text, and remember it so we can portal a
            // RenderedText component into it on every render.
            useEffect(() => {
                if (!containerRef.current) return;
                const els = Array.from(containerRef.current.querySelectorAll('[data-frag-id]'));
                els.forEach(el => {
                    // Drop original children — RenderedText reproduces them
                    while (el.firstChild) el.removeChild(el.firstChild);
                    el.classList.add('frag-host');
                });
                setPortalTargets(els.map(el => ({ fragId: el.getAttribute('data-frag-id'), el })));
            }, [block.id]);

            const fragmentMap = useMemo(() => {
                const m = new Map();
                (block.fragments || []).forEach(f => m.set(f.id, f));
                return m;
            }, [block.fragments]);

            return (
                <>
                    <div ref={containerRef} dangerouslySetInnerHTML={{ __html: block.html }} style={{ display: 'contents' }} />
                    {portalTargets.map(({ fragId, el }) => {
                        const sentence = fragmentMap.get(fragId);
                        if (!sentence) return null;
                        let state = 'NONE';
                        if (lockedSentences.some(ls => ls.id === fragId))   state = 'GREEN';
                        else if (usedSentenceIds && usedSentenceIds.has(fragId)) state = 'USED';
                        else if (matchStates[fragId] === 'COMPLETE')        state = 'COMPLETE';
                        else if (matchStates[fragId] === 'YELLOW')          state = 'YELLOW';
                        return ReactDOM.createPortal(
                            <RenderedText chars={sentence.chars} matchState={state} typedLength={state === 'YELLOW' ? typedLength : null} onNavigate={onNavigate} />,
                            el,
                            fragId
                        );
                    })}
                </>
            );
        };

        /* ================================================================
           SCORING OVERLAY — animated yield ledger
           ================================================================ */
        /* ================================================================
           SENTENCE SCORING — shared by ScoringOverlay and live preview
           ================================================================ */
        function findIdleHint(sentences,buffer,locked,used) {
            if(!buffer.length)return null;
            const eligible=sentences.filter(s=>!used.has(s.id)&&!locked.some(x=>x.id===s.id));
            const matches=(s,n)=>s.chars.length>=n&&buffer.slice(0,n).every((b,i)=>{const c=s.chars[i];return charMatch(b.c,c.c)&&['b','i','l','cit','bul'].every(k=>!!b[k]===!!c[k]);});
            let candidates=eligible.filter(s=>matches(s,buffer.length));
            let index=buffer.length,correction=false;
            if(!candidates.length&&buffer.length>1){index--;correction=true;candidates=eligible.filter(s=>matches(s,index));}
            if(!candidates.length||candidates.some(s=>s.chars.length<=index))return null;
            const char=candidates[0].chars[index];
            if(!candidates.every(s=>{const c=s.chars[index];return c.c===char.c&&['b','i','l','cit','bul'].every(k=>!!c[k]===!!char[k]);}))return null;
            return {char,correction};
        }

        // Scores are pure functions of (excerpt, build, rules); memoise them so the HUD and pace
        // meter can re-read locked excerpts on every keystroke without rescoring.
        const sentenceScoreCache = new WeakMap();
        function scoreSentence(s, upgrades, rules = DEFAULT_SCORING) {
            let byUpgrades = sentenceScoreCache.get(s);
            if (!byUpgrades) { byUpgrades = new WeakMap(); sentenceScoreCache.set(s, byUpgrades); }
            let byRules = byUpgrades.get(upgrades);
            if (!byRules) { byRules = new WeakMap(); byUpgrades.set(upgrades, byRules); }
            let result = byRules.get(rules);
            if (!result) { result = computeSentenceScore(s, upgrades, rules); byRules.set(rules, result); }
            return result;
        }
        function computeSentenceScore(s, upgrades, rules) {
            const wordUpgrades = upgrades.filter(u => u.type === 'WORD');
            const words = [];
            let current = [];
            let citationBlocks = 0;
            let inCit = false;

            s.chars.forEach(charObj => {
                if (charObj.cit) {
                    if (!inCit) { citationBlocks++; inCit = true; }
                } else {
                    inCit = false;
                    if (charObj.c === ' ') {
                        if (current.length > 0) { words.push(current); current = []; }
                    } else {
                        current.push(charObj);
                    }
                }
            });
            if (current.length > 0) words.push(current);

            // Score each word
            const wordScores = words.map((wChars, idx) => {
                const text = wChars.map(c => c.c).join('');
                const charDetails = wChars.map(co => ({
                    c: co.c,
                    score: getCharScore(co.c, rules) + letterBoost(co.c, upgrades),
                    b: co.b, i: co.i, l: co.l, cit: false
                }));

                let base = charDetails.reduce((acc, cd) => acc + cd.score, 0);
                const len     = wChars.length;
                const isFirst = idx === 0;
                const isLast  = idx === words.length - 1;

                const lenMult = len > rules.lengthStart ? (1 + (len - rules.lengthStart) * rules.lengthStep) : 1;

                let formatMult = 1.0;
                let formatAdd  = 0;
                if (wChars.some(c => c.b)) formatMult *= rules.bold;
                if (wChars.some(c => c.i)) formatMult *= rules.italic;
                if (wChars.some(c => c.l)) formatAdd += rules.link;

                const posMult = (isFirst || isLast) ? rules.position : 1;

                let upgradeBase = 0;
                let upgradeMult = 0;
                const appliedWordUpgrades = [];
                const wordEffects = [];

                wordUpgrades.forEach(u => {
                    const effect = u.action({ len, isFirst, isLast, charDetails, text });
                    if (effect) {
                        if (effect.baseAdd) upgradeBase += effect.baseAdd * rules.wordBonus;
                        if (effect.multAdd) upgradeMult += effect.multAdd * rules.wordBonus;
                        appliedWordUpgrades.push(u.name);
                        wordEffects.push({name:u.name,base:(effect.baseAdd||0)*rules.wordBonus,mult:(effect.multAdd||0)*rules.wordBonus});
                    }
                });

                const characterBase=base, formatBaseMult=formatMult;
                base       += formatAdd + upgradeBase;
                formatMult += upgradeMult;

                const total = Math.floor(base * lenMult * formatMult) * posMult;

                return {
                    chars: wChars,
                    charDetails,
                    base, characterBase, upgradeBase, upgradeMult, formatBaseMult, len, lenMult, formatMult, formatAdd,
                    isFirstLast: isFirst || isLast,
                    posMult, total,
                    text,
                    appliedWordUpgrades, wordEffects
                };
            });

            let sBase = wordScores.reduce((acc, w) => acc + w.total, 0);
            let sMult = Math.pow(rules.citation, citationBlocks);
            const appliedSentenceUpgrades = [];
            const sentenceEffects = [];
            const triggeredUpgrades = new Set(wordScores.flatMap(w => w.appliedWordUpgrades));

            if (citationBlocks > 0) appliedSentenceUpgrades.push(`${citationBlocks} Citation(s)`);

            upgrades.filter(u => u.type === 'SENTENCE').forEach(u => {
                const effect = u.action({ words: wordScores, citationBlocks });
                if (effect) {
                    if (effect.baseAdd) sBase += effect.baseAdd * rules.sentenceBonus;
                    if (effect.multAdd) sMult += effect.multAdd * rules.sentenceBonus;
                    appliedSentenceUpgrades.push(u.name);
                    sentenceEffects.push({name:u.name,base:(effect.baseAdd||0)*rules.sentenceBonus,mult:(effect.multAdd||0)*rules.sentenceBonus});
                    triggeredUpgrades.add(u.name);
                }
            });

            // Each distinct WORD/SENTENCE upgrade that actually fires extends
            // a purchased Chain. Additional triggers keep increasing the bonus without a cap.
            const chainStrength = hasUpgrade(upgrades,'chain-forged') ? 2 : 1;
            const chainMultiplier = hasUpgrade(upgrades,'chain') ? 1 + rules.chain * chainStrength * Math.max(0, triggeredUpgrades.size - 1) : 1;
            const sentenceTotal = Math.floor(sBase * sMult * chainMultiplier);
            return {
                id: s.id,
                text: s.chars.map(c => c.c).join(''),
                words: wordScores,
                citationBlocks, sentenceBase: sBase, sentenceMultiplier: sMult, chainMultiplier, triggeredUpgrades: [...triggeredUpgrades],
                sentenceTotal,
                appliedSentenceUpgrades, sentenceEffects
            };
        }

        /* ================================================================
           PACE METER — see CSS comment for the model.
           progress(list): 3 − (excerpts left) × (score each still needs ÷ starting pace).
             · exactly on pace after k excerpts  → k
             · target already guaranteed        → 3 (GOAL)
             · final excerpt: 3 + (score − needed) ÷ pace, so it can pass GOAL.
           ratio(list): average excerpt strength vs starting pace (geometric), for the headline %.
           ================================================================ */
        const PACE_MAX=3.5;
        // Exact (un-rounded) pace basis: base³ = target ÷ guaranteed run multiplier, in (score + Symmetric) units.
        function paceBasis(upgrades,rules,target){
            const sym=hasUpgrade(upgrades,'symmetric')?rules.symmetric:0;
            const M=guaranteedRunMultiplier(upgrades,rules);
            return {sym,M,base:Math.cbrt(Math.max(0,target)/M)};
        }
        function meterProgress(list,upgrades,rules,target){
            const k=list.length,{sym,M,base}=paceBasis(upgrades,rules,target);
            if(!k||!(base>0))return 0;
            if(k<REQUIRED_SENTENCES){
                const P=list.reduce((n,x)=>n*(scoreSentence(x,upgrades,rules).sentenceTotal+sym),1);
                if(!(P>0))return -Infinity;
                const n=REQUIRED_SENTENCES-k;
                return REQUIRED_SENTENCES-n*Math.pow(target/(M*P),1/n)/base;
            }
            const req=thirdExcerptRequirement(list.slice(0,2),list[2],upgrades,rules,target).needed;
            const sc=scoreSentence(list[2],upgrades,rules).sentenceTotal;
            return Number.isFinite(req)?REQUIRED_SENTENCES+(sc-req)/base:-Infinity;
        }
        function meterRatio(list,upgrades,rules,target){
            const k=list.length,{sym,base}=paceBasis(upgrades,rules,target);
            if(!k||!(base>0))return null;
            if(k<REQUIRED_SENTENCES){
                const P=list.reduce((n,x)=>n*(scoreSentence(x,upgrades,rules).sentenceTotal+sym),1);
                return Math.pow(Math.max(0,P),1/k)/base;
            }
            return Math.cbrt(Math.max(0,scoreRun(list,upgrades,rules).runTotal)/target);
        }
        const fmtLead=r=>r===null?'—':!Number.isFinite(r)?'MAX':(()=>{const p=Math.round((r-1)*100);return p===0?'±0%':`${p>0?'+':'−'}${Math.abs(p)>999?'999':Math.abs(p)}%`;})();

        const PaceMeter=React.memo(({locked,live,liveScore,needed,upgrades,rules,target})=>{
            const k=locked.length;
            const preview=live&&k<REQUIRED_SENTENCES&&!locked.some(x=>x.id===live.id)?[...locked,live]:null;

            const banked=meterProgress(locked,upgrades,rules,target);
            const ahead=preview?meterProgress(preview,upgrades,rules,target):null;
            const r=meterRatio(locked,upgrades,rules,target);
            const rNext=preview?meterRatio(preview,upgrades,rules,target):null;
            const pct=r===null?null:Math.round((r-1)*100);
            const state=k===0?'idle':!Number.isFinite(r)||pct>0?'ahead':pct<0?'behind':'even';

            const clamp=x=>Math.max(0,Math.min(PACE_MAX,x));
            const pos=x=>clamp(x)/PACE_MAX*100;
            const b=pos(banked),g=ahead===null?null:pos(ahead),notch=pos(k);
            const need=Number.isFinite(needed)?needed:null;
            const good=liveScore!==null&&need!==null&&liveScore>=need;
            const isLast=k===REQUIRED_SENTENCES-1;
            const landsAhead=rNext!==null&&rNext>=1; // ghost colour: where you'd stand after locking

            let next='',nextCls='';
            if(preview&&isLast){
                const f=scoreRun(preview,upgrades,rules).runTotal/target;
                next=f>=1?'CLEARS ✓':`${Math.min(99,Math.ceil((1-f)*100))}% SHORT`;nextCls=f>=1?'up':'down';
            }else if(preview){
                next=`→ ${fmtLead(rNext)}`;nextCls=rNext>=1?'up':'down';
            }

            const aria=k===0?'No excerpts banked yet':`${k} of 3 excerpts banked, ${pct===null?'':Math.abs(pct)+' percent '+(pct>=0?'above':'below')+' pace'}`;
            return <aside className={`pace-meter ${state}`} aria-label="Round pace"
                title={'Solid fill: what you have banked. Notch: where exactly-on-pace excerpts would put you — fill above it means you are ahead.\nStriped: the excerpt you are typing, if you lock it now. Reach GOAL to clear the round.\nHeadline: how far your locked excerpts average above or below the pace.'}>
                <span className="pm-label">PACE</span>
                {(()=>{const t=k?fmtLead(r):'—';return <strong key={k} className={`pm-head ${k?'pop':''} ${t.length>5?'xlong':t.length>4?'long':''}`}>{t}</strong>;})()}
                <span className="pm-sub">{state==='ahead'?'AHEAD':state==='behind'?'BEHIND':state==='even'?'ON PACE':'0/3 BANKED'}</span>
                <div className="pm-bar" role="progressbar" aria-valuemin={0} aria-valuemax={3} aria-valuenow={Math.round(clamp(banked)*100)/100} aria-valuetext={aria}>
                    <div className="pm-clip">
                        <i className="pm-zone" style={{bottom:`${pos(3)}%`,top:0}}/>
                        <i className="pm-fill" style={{height:`${b}%`}}/>
                        {state==='behind'&&g===null&&<i className="pm-gap" style={{bottom:`${b}%`,height:`${Math.max(0,notch-b)}%`}}/>}
                        {g!==null&&g>b&&<i className={`pm-ghost ${landsAhead?'good':'bad'}`} style={{bottom:`${b}%`,height:`${g-b}%`}}/>}
                        {g!==null&&g<b&&<i className="pm-loss" style={{bottom:`${g}%`,height:`${b-g}%`}}/>}
                        {k>0&&<i key={`f${k}`} className="pm-flash"/>}
                        {[1,2].map(t=><span key={t} className="pm-tick" style={{bottom:`${pos(t)}%`}}/>)}
                    </div>
                    {[1,2].map(t=><span key={t} className="pm-tickmark" style={{bottom:`${pos(t)}%`}}/>)}
                    <span className="pm-goal" style={{bottom:`${pos(3)}%`}}><em>GOAL</em></span>
                    {k>0&&k<REQUIRED_SENTENCES&&<span className="pm-notch" style={{bottom:`${notch}%`}}/>}
                </div>
                <div className={`pm-live ${liveScore===null?'':good?'good':'bad'}`}>
                    <span className="pm-cap">{isLast?'LAST ONE':k>=REQUIRED_SENTENCES?'DONE':'THIS ONE'}</span>
                    <span className="pm-score"><b>{liveScore===null?'—':formatScore(liveScore)}</b><small>/{need===null?'∞':formatScore(need)}</small></span>
                    <span className={`pm-next ${nextCls}`}>{next}</span>
                </div>
            </aside>;
        });

        const ScoringOverlay = ({sentences,onComplete,targetScore,ante,upgrades,rules,market,practice=false}) => {
            const [step,setStep]=useState(0);
            const [selected,setSelected]=useState([0,0]);
            const [inspectorOpen,setInspectorOpen]=useState(false);
            const dialogRef=useRef(null);
            const details=useMemo(()=>sentences.map(s=>scoreSentence(s,upgrades,rules)),[sentences,upgrades,rules]);
            const result=useMemo(()=>scoreRun(sentences,upgrades,rules,details),[sentences,upgrades,rules,details]);
            const word=selected ? details[selected[0]]?.words[selected[1]] : null;
            const success=result.runTotal>=targetScore;
            useEffect(()=>{const dialog=dialogRef.current;dialog.showModal();return ()=>dialog.close();},[]);
            useEffect(()=>{const timer=setInterval(()=>setStep(n=>{if(n>=6){clearInterval(timer);return 6;}return n+1;}),250);return ()=>clearInterval(timer);},[]);
            return <dialog ref={dialogRef} className="tally-dialog" aria-labelledby="tally-title" onCancel={e=>e.preventDefault()}>
                <header className="tally-head"><div><span className="print-label">ROUND {ante} / 7</span><h1 id="tally-title">THE TALLY.</h1></div>{step<6 && <button onClick={()=>setStep(6)}>SKIP ↗</button>}</header>
                <div className="tally-body">
                    <section className="tally-ledger" aria-label="Excerpt scores">{details.map((d,i)=><article key={d.id}>
                        <div className="tally-excerpt-head"><span className="print-label">EXCERPT 0{i+1}</span><strong title={result.finalSentenceTotals[i].toLocaleString()}>{step>=3?formatScore(result.finalSentenceTotals[i]):'—'}</strong></div>
                        <p className="tally-quote">{d.text}</p>
                        <div className="tally-words">{d.words.map((w,j)=><button key={j} className={selected?.[0]===i&&selected?.[1]===j?'selected':''} aria-pressed={selected?.[0]===i&&selected?.[1]===j} aria-label={`${w.text}: ${w.total.toLocaleString()} points. Inspect word`} onMouseEnter={()=>setSelected([i,j])} onFocus={()=>setSelected([i,j])} onClick={()=>{setSelected([i,j]);setInspectorOpen(true);}}><span>{w.text}</span><b>{step>=2?formatScore(w.total):'—'}</b></button>)}</div>
                        {step>=3&&<><ScoreEffects detail={d} rules={rules}/><div className="excerpt-calculation">
                            <div><span>Word scores added together</span><b>{d.words.reduce((n,w)=>n+w.total,0).toLocaleString()}</b></div>
                            {d.sentenceEffects.filter(e=>e.base).map(e=><div key={e.name}><span>{e.name}</span><b>+{e.base.toLocaleString()}</b></div>)}
                            <div><span>Sentence subtotal</span><b>{d.sentenceBase.toLocaleString()}</b></div>
                            {d.citationBlocks>0&&<div><span>{d.citationBlocks} citation block{d.citationBlocks===1?'':'s'} · {rules.citation}<sup>{d.citationBlocks}</sup></span><b>×{Number(Math.pow(rules.citation,d.citationBlocks).toFixed(3))}</b></div>}
                            {d.sentenceEffects.filter(e=>e.mult).map(e=><div key={e.name}><span>{e.name} · added to sentence multiplier</span><b>+{e.mult}</b></div>)}
                            <div><span>Combined sentence multiplier</span><b>×{Number(d.sentenceMultiplier.toFixed(3))}</b></div>
                            <div><span>{d.triggeredUpgrades.length} distinct upgrade triggers · chain</span><b>×{d.chainMultiplier}</b></div>
                            <p>{d.triggeredUpgrades.join(' + ')||'No scoring upgrades triggered'}</p>
                            <div className="calculation-total"><span>floor({d.sentenceBase.toLocaleString()} × {Number(d.sentenceMultiplier.toFixed(3))} × {d.chainMultiplier})</span><b>{d.sentenceTotal.toLocaleString()}</b></div>
                            {upgrades.some(u=>u.id==='symmetric')&&<div><span>Symmetric · added before round multiplication</span><b>+{rules.symmetric}</b></div>}
                        </div></>}

                    </article>)}</section>
                    <aside className={`word-inspector ${inspectorOpen?'inspector-open':''}`} tabIndex={0} aria-label="Word breakdown"><button className="word-inspector-toggle" aria-expanded={inspectorOpen} onClick={()=>setInspectorOpen(x=>!x)}>WORD DETAILS · {word?.text} <span>{inspectorOpen?'HIDE −':'SHOW +'}</span></button><span className="print-label">SELECT A WORD TO INSPECT</span>{word&&<><h2>{word.text}</h2><dl>
                        <div><dt>Character points</dt><dd>{word.characterBase}</dd></div><div className="character-score-sum">{word.charDetails.map((c,i)=><span key={i}>{c.c}: {c.score}{i<word.charDetails.length-1?' + ':''}</span>)}</div>
                        {word.formatAdd>0&&<div><dt>Linked word</dt><dd>+{word.formatAdd}</dd></div>}
                        {word.wordEffects.filter(e=>e.base).map(e=><div key={e.name}><dt>{e.name}</dt><dd>+{e.base}</dd></div>)}
                        <div><dt>Word subtotal</dt><dd>{word.base}</dd></div>
                        {word.lenMult!==1&&<div><dt>Length · {word.len} characters</dt><dd>×{Number(word.lenMult.toFixed(3))}</dd></div>}
                        {word.chars.some(c=>c.b)&&<div><dt>Bold</dt><dd>×{rules.bold}</dd></div>}
                        {word.chars.some(c=>c.i)&&<div><dt>Italic</dt><dd>×{rules.italic}</dd></div>}
                        {word.wordEffects.filter(e=>e.mult).map(e=><div key={e.name}><dt>{e.name} · added to format multiplier</dt><dd>+{e.mult}</dd></div>)}
                        <div><dt>Combined format multiplier</dt><dd>×{Number(word.formatMult.toFixed(3))}</dd></div>
                        {word.isFirstLast&&<div><dt>First / last word</dt><dd>×{word.posMult}</dd></div>}
                    </dl><p className="word-formula">floor({word.base} × {Number(word.lenMult.toFixed(3))} × {Number(word.formatMult.toFixed(3))}) × {word.posMult}</p><div className="word-total"><span>WORD TOTAL</span><strong>{word.total.toLocaleString()}</strong></div></>}</aside>
                </div>
                <footer className="tally-footer"><div className="tally-result"><span className="print-label">{step<5?'COUNTING':practice?'PRACTICE COMPLETE':success?'TARGET CLEARED':'BELOW TARGET'}</span><strong title={result.runTotal.toLocaleString()}>{step>=5?formatScore(result.runTotal):'—'}</strong></div>
                    <div className="tally-equation"><b>Multiply the three excerpt totals: </b>{step>=4?result.finalSentenceTotals.map(n=>formatScore(n)).join(' × '):'—'}{step>=4&&result.multiplier!==1&&` × ${Number(result.multiplier.toFixed(3))} (run bonuses)`}</div>
                    {step>=5&&result.appliedRunUpgrades.length>0&&<p className="tally-run-effects">{result.appliedRunUpgrades.map(name=>{const u=upgrades.find(u=>u.name===name);if(u.id==='symmetric')return `Symmetric: +${rules.symmetric} to each excerpt${rules.runTrigger!==1?` · amplifier ×${rules.runTrigger}`:''}`;return `${name}: ×${Number(((1+(u.action(sentences)?.multAdd||0)*rules.runBonus)*rules.runTrigger).toFixed(3))}`;}).join(' · ')}</p>}
                    {!practice&&step>=5&&market&&(()=>{const pay=shopIncome(sentences,upgrades,market);return <p className={`tally-pay ${success?'':'is-lost'}`}>{success?<>Payout <b>+{pay.earned}¢</b> · {pay.lastWords} words{pay.lastIncome.interest?` · interest +${pay.lastIncome.interest}¢`:''} · you’ll have <b>{market.credits+pay.earned}¢</b></>:<>No payout · {pay.lastWords} words would have paid +{pay.earned}¢</>}</p>;})()}
                    <div className="tally-next">{!practice&&step>=5&&<p>Target <b>{formatScore(targetScore)}</b> · {success?'surplus':'short'} <b>{formatScore(Math.abs(result.runTotal-targetScore))}</b></p>}<button autoFocus disabled={step<6} onClick={()=>onComplete(result.runTotal,success)}>{practice?'FINISH PRACTICE':success?(ante>=MAX_ANTE?'COMPLETE RUN':'VISIT THE SHOP'):'VIEW RESULTS'} ↗</button></div>
                </footer>
            </dialog>;
        };

        /* ================================================================
           MAIN APP
           ================================================================ */
        const ScoreEffects = ({detail:d,rules,compact=false}) => {
            const count=key=>d.words.filter(w=>w.chars.some(c=>c[key])).length;
            const facts=[
                ['bold',count('b'),`Bold ×${rules.bold}`],['italic',count('i'),`Italic ×${rules.italic}`],['link',count('l'),`Link +${rules.link}`],
                ['citation',d.citationBlocks,`Citations ×${Number(Math.pow(rules.citation,d.citationBlocks).toFixed(3))}`]
            ];
            return <div className={`score-effects ${compact?'compact':''}`} aria-label="Active score contributions">{facts.filter(([,n])=>n>0).map(([key,n,label])=><span className={`effect-${key}`} key={key}>{label}<small>{n} {key==='citation'?'blocks':'words'}</small></span>)}
                {d.words.some(w=>w.lenMult>1)&&<span>Length ×{[...new Set(d.words.filter(w=>w.lenMult>1).map(w=>Number(w.lenMult.toFixed(2))))].sort((a,b)=>a-b).filter((x,i,a)=>i===0||i===a.length-1).join('–')}<small>{d.words.filter(w=>w.lenMult>1).length} words</small></span>}
                <span>First/last ×{rules.position}</span>
                {d.words.some(w=>w.upgradeBase>0)&&<span>Word upgrades +{d.words.reduce((n,w)=>n+w.upgradeBase,0)}<small>base points</small></span>}
                {d.words.some(w=>w.upgradeMult>0)&&<span>Word format +{[...new Set(d.words.filter(w=>w.upgradeMult>0).map(w=>w.upgradeMult))].sort((a,b)=>a-b).filter((v,i,a)=>i===0||i===a.length-1).join('–')}<small>multiplier</small></span>}
                {d.sentenceEffects.some(e=>e.base)&&<span>Sentence +{d.sentenceEffects.reduce((n,e)=>n+e.base,0)}</span>}
                {d.sentenceEffects.some(e=>e.mult)&&<span>Sentence ×{Number(d.sentenceMultiplier.toFixed(3))}<small>combined</small></span>}
                {d.chainMultiplier>1&&<span className="effect-chain" title={d.triggeredUpgrades.join(' + ')}>Chain ×{Number(d.chainMultiplier.toFixed(2))}<small>{d.triggeredUpgrades.length} triggers</small></span>}
            </div>;
        };

        const ManualDialog = ({ onClose, children }) => {
            const ref = useRef(null);
            useEffect(() => {
                const previous = document.activeElement;
                const dialog = ref.current;
                dialog.showModal();
                return () => { dialog.close(); previous?.focus(); };
            }, []);
            return <dialog ref={ref} className="manual-dialog" aria-label="Rules" onCancel={e => { e.preventDefault(); onClose(); }}>{children}</dialog>;
        };

        const upgradeDescription = (u, rules = DEFAULT_SCORING) => {
            if(SHOP_BALANCE[u.id]?.desc)return u.desc;
            const precise = {
                plain: '+3 word base when no character is bold, italic or linked. Bullet text can qualify.',
                capitalist: '+20 word base for an A–Z capital at the start of any word except the first word.',
                doubled: '+25 word base for adjacent repeated characters, ignoring letter case.',
                syllabic: '+0.10 to the sentence multiplier per word of 8+ characters, with no cap.',
                palindromic: '+140 word base when the letters and digits read the same backwards, ignoring case and punctuation; at least 3 letters or digits required.',
                consonantal: '+45 word base for words containing letters but no A, E, I, O or U; Y counts as a consonant.',
                tonal: '×1.35 round score when all three excerpts end with the same character (trailing spaces ignored).',
                vintage: '×1.2 round score if an excerpt contains a whole year from 1000 through 2029.',
                orthography: '×1.25 round score if no excerpt contains ! ? " ( ) [ ] { } — or –.',
                pyramidal: '×1.5 round score if each locked excerpt has more characters than the previous one, including spaces and citations.'
            };
            const runEffects = {
                mosaic: [3, 'the three excerpts collectively contain bold, italic, linked and citation characters'],
                encyclopedist: [11, 'all three excerpts come from different articles and each contains a citation'],
                rooted: [0.8, 'all three excerpts come from the same article'],
                divergent: [5, 'all three excerpts come from different articles'],
                pyramidal: [1.5, 'each excerpt has more characters than the previous one, in lock order (spaces and citations included)'],

        const HINT_KEYS=['a','s','d','f','g','h','j','k','e','u','y','p','c','x','z','v','4','5','6','7','8','9','0'];

        const CharPanel = ({ entries, prefix, pinned, onPick, onClose }) => <div className={`char-panel ${pinned?'is-pinned':''}`} role="dialog" aria-label="Special characters on this page">

        const RulesDialog = ({ onClose, rules = DEFAULT_SCORING }) => <ManualDialog onClose={onClose}>
            <header className="rule-head"><div><span className="print-label">ENC / REFERENCE</span><h2>THE RULES<span>.</span></h2></div><button autoFocus onClick={onClose} aria-label="Close rules">CLOSE ×</button></header>
            <div className="rule-body">
                <p className="rules-edition">{rules === DEFAULT_SCORING ? 'STANDARD SCORING' : 'CUSTOM DEV SCORING'} · Values below match the active rules.</p>
                <details open><summary>01 / The run</summary><p>Lock three different excerpts before the clock runs out. Their scores multiply together. Reach the round’s target to advance, then visit the shop to buy permanent upgrades and consumables. Clear all seven rounds to win. Banked score is the sum of cleared rounds; it does not pay the next target.</p><p>Sentences, headings and captions can be excerpts. Start at the beginning of a highlighted excerpt and type its complete text, including spaces, punctuation and citations. Match the formatting of each character, then press Enter or select LOCK to lock it. Used excerpts are marked and unavailable on that article visit. The third lock starts scoring automatically. Once your typing matches only one excerpt, EXCERPT shows its full score, including word bonuses, sentence bonuses and chains, before Symmetric and run multipliers. PACE / EXCERPT is the minimum equal score needed from each unfilled slot, after locked scores and Symmetric. It shows two numbers: <b>no bonuses</b> counts only guaranteed multipliers (Symmetric, Carbon Copy); the green <b>all bonuses</b> figure assumes every conditional run upgrade your locked excerpts have not already ruled out also lands (hover it to see which). It is a guide, not a per-excerpt minimum: a stronger excerpt can compensate for a weaker one. On the third excerpt, NEEDED shows the same pair as minimum pre-Symmetric scores to clear the round; the pace meter’s THIS ONE figure uses the uniquely matched excerpt’s actual run conditions, including its article and lock order. EXCERPT also shows the credits that excerpt’s words will pay, and CREDITS shows what you hold plus what your locked excerpts pay if the round clears. Symmetric is included in the requirement calculation, so excerpt and needed scores use the same units. The left gauge shows projected round points divided by the target: 50% fills halfway and 100% reaches the GOAL at the top. Above target, the bar stays full and the percentage keeps increasing. It uses locked excerpts plus the current uniquely matched excerpt. Until all three are known, missing excerpts are estimated at the geometric mean of the known scores, including Symmetric and an active Carbon Copy; conditional run bonuses are excluded. With all three known it uses the exact run scorer. This is a forecast, not banked points or elapsed-time progress. Once the last excerpt is unique, ROUND IF LOCKED shows the complete forecast including run upgrades. Nothing is locked until you press Enter or select LOCK.</p><table><thead><tr><th>Round</th><th>Target</th><th>Clock</th></tr></thead><tbody>{ROUND_SECONDS.map((seconds,i) => <tr key={i}><td>{i+1}</td><td>{formatScore(getRoundTarget(i+1))}</td><td>{seconds}s</td></tr>)}</tbody></table></details>
                <details><summary>02 / Typing & formatting</summary><p>Click the typing field to focus it. Formatting buttons are toggles, not keys you hold down. Turn each required format on before typing that part, then off when it ends. Multiple formats can be on at once. The toggles stay on until you change them, including between excerpts. After three seconds without typing in an unfinished excerpt, a hint appears above the input when the next character is unambiguous. It shows the character and any formatting toggles that need changing. If only the last character is wrong, it shows how to replace it. Typing or changing a format dismisses the hint. The format-button values show the standard word multiplier for bold/italic, link points per word, and citation multiplier per citation block; bullet formatting itself adds no points.</p><table><thead><tr><th>Action</th><th>Shortcut</th></tr></thead><tbody>{[['Bold','B'],['Italic','I'],['Link','L'],['Citation',';'],['Bullet','O'],['Compose','M']].map(([label,key]) => <tr key={key}><td>{label}</td><td>Ctrl / ⌘ + {key}</td></tr>)}<tr><td>Special characters</td><td>Hold Ctrl, then Ctrl + shown key</td></tr><tr><td>Use item in bag slot 1–3</td><td>Ctrl + 1–3</td></tr></tbody></table><p>Enter locks only a complete match. Backspace removes the last character. Ctrl, ⌘ or Alt + Backspace clears the input. Escape clears the input when not composing. An unmatched character or format turns the input red; edit it to restore a match. Straight quotes also match curly quotes; a hyphen matches an en dash or em dash. Spaces still require the correct formatting.</p><p>Citation mode applies to the citation characters, including their brackets. Bullet mode matches the text of a list item; do not type its decorative bullet. Special characters typed from the Ctrl panel use your active formats.</p><p>Practice has three excerpts, no clock and no target. Complete the plain, bold and italic excerpts to finish; it does not replace your saved run.</p></details>
                <details><summary>03 / Navigation, clock & saving</summary><p>The clock starts with your first typed character, inserted special character or article link, except for an unused Scout’s Honor free click. Following a link clears unfinished input after the new article loads; locked excerpts and upgrades remain. Back returns to a previously visited article.</p><p>The clock pauses while the game menu is open, during article loading, Rules, dev mode and scoring. Practice is untimed. Switching browser tabs alone does not pause a running clock. Save & leave stores the run in this browser; Continue resumes with the clock paused until typing or navigation begins. The run also autosaves while playing. New run replaces the saved run.</p></details>
                <details><summary>04 / Every point, in order</summary><p>Split an excerpt at spaces to form words. Punctuation counts toward word length. Citation characters are excluded from word scores and word length; each uninterrupted citation block supplies a sentence multiplier instead.</p><p>Letter values: A E I L N O R S T U = 1; D G = 2; B C M P = 3; F H V W Y = 4; K = 5; J X = 8; Q Z = 10. Uppercase A–Z multiplies its value by {rules.capital}. Digits use their numeric value. Ordinary punctuation (. , ! ? ; : quotes parentheses brackets braces hyphens dashes underscore) scores {rules.punctuation}; other characters score {rules.special}.</p><p>Add character values, +{rules.link} if any character is linked, and qualifying word upgrade base bonuses ×{rules.wordBonus}. Length multiplier is 1 up to {rules.lengthStart} characters, then +{rules.lengthStep} per additional character, with no cap. Any bold character supplies ×{rules.bold}; any italic character supplies ×{rules.italic}; these multiply together. Word upgrade multiplier additions ×{rules.wordBonus} are added after those format multipliers.</p><p className="rule-equation">Word = floor(base × length multiplier × format multiplier) × position multiplier</p><p>The first and last word each receive ×{rules.position}. A one-word excerpt receives it once. Sum the word totals and add sentence upgrade base bonuses ×{rules.sentenceBonus}. The sentence multiplier starts at {rules.citation} raised to the number of citation blocks, then adds qualifying sentence multiplier bonuses ×{rules.sentenceBonus}.</p><p>Each distinct word or sentence upgrade that actually triggers counts once toward that excerpt’s chain. Chain is off until purchased. With Chain, each extra trigger adds {Math.round(rules.chain*100)}%, with no cap. Forged Links doubles that per-trigger bonus. Repeated triggers of the same upgrade do not extend the chain. Formatting and citations alone do not count as upgrade triggers.</p><p className="rule-equation">Excerpt = floor(sentence base × sentence multiplier × chain)</p><p>With Symmetric, add {rules.symmetric} to each excerpt total before multiplying. Multiply all three excerpt totals. Each qualifying run upgrade then multiplies this product by (1 + its bonus ×{rules.runBonus}) ×{rules.runTrigger}; Symmetric supplies ×{rules.runTrigger} without another bonus multiplier. All qualifying run multipliers multiply together. Round down the final result. For standard rules, Rooted alone gives ×1.8, and Rooted with Tonal gives ×2.88. The dev run amplifier defaults to ×1; run upgrades receive no blanket amplification.</p></details>
                <details><summary>05 / The shop, rarity & consumables</summary><p>Start with 7 credits. Earn 1 credit per 8 total words in successfully locked excerpts of cleared rounds. The HUD shows each excerpt’s credits as you type it, the tally shows the payout, and the shop itemises what you earned. Partial credits carry forward across rounds and saves, so 15 words followed by 9 pays 3 credits in total. Words must contain a letter or digit; citations, punctuation-only tokens, discarded input and practice do not earn money. Round number and score no longer grant money. Patron adds 25% to word income, Long-form Royalties adds 0.1 credit per word of 8+ letters or digits, and Savings Account pays 1 credit per 10 saved before the payout. All money buffs apply on future clears; their bonuses stack and have no caps. Unspent credits carry over. Points and credits are separate. Buy any number of items you can afford, then select the next round. You can leave without buying. The same article carries over.</p><p>Permanent upgrade base prices and offer weights: Common 6 credits / 45%, Uncommon 9 / 30%, Rare 13 / 16%, Epic 18 / 7%, Legendary 26 / 2%. Individual card prices override the base; the displayed price is what you pay. Specialist cards need a trigger in the current article. Chain needs two trigger upgrades; Forged Links needs Chain and six. Resonance needs two word upgrades, Singularity three. Patron only appears through shop four; Wider Lens and Second Opinion through shop five. Pocket Dictionary, Number Cruncher and Palindromic are retired from new offers; owned copies still work. Each slot rolls a rarity, then uniformly chooses an eligible upgrade. Owned upgrades and duplicate offers are excluded; at most one run upgrade appears per stock. Empty rarity weights are removed and the rest renormalized. Shops offer four upgrades, or five with Wider Lens. Restocking replaces unsold upgrades and supplies. Replaced upgrades cannot appear in the immediate restock. Restocks cost 3 credits, then 5, 7, and so on; Second Opinion grants one free restock each shop without raising the paid price.</p><p>Card replays rescore your last three excerpts with your current build plus the offered upgrade. These are comparisons, not guarantees for the next round. Time and economy upgrades do not increase replay points; Chain does. Permanent effects start in the next round, except shop effects, which work immediately when applicable. Time rewards stack and can exceed the starting clock.</p><p>Letter packs: a Small pack (4 credits) reveals 3 characters and a Large pack (7 credits) reveals 5; keep one as a permanent boost. Each pack can be opened once per shop. Characters are drawn from letters, digits, accented Latin, symbols, Greek, IPA, Cyrillic, Hebrew, Arabic, Devanagari, Chinese, Japanese and Korean, plus any special character in your current article. The rarer a character is on English Wikipedia, the less often it appears in a pack, and the larger its boost: roughly +2 for E, +30 for Q, +50 for É, +500 for the stress mark ˈ, +2,500 for ʃ or π, +8,000 for 中, and far more for truly rare characters. Every copy of that character in an excerpt adds the boost to its word base, in either case, before word multipliers. Each character can reach level three, and levels stack. Revealed cards show matching excerpts in this article and an example gain when available; this is an opportunity, not a guaranteed round payoff. Boosts never count as Chain triggers and survive saves. Finish or skip an open pack before leaving.</p><p>Clock: before each round you can buy +5 seconds for the next round only (1 credit) or +5 seconds on every future round (3 credits), as many times as you like. Pocket Watch is retired from offers; owned copies still work.</p><p>Carry up to three consumables in three bag slots, including duplicates. A new item goes in the lowest empty slot, and using an item empties its slot without moving the others. Use them during play with Ctrl+1–3 for slots 1–3 (Control on a Mac too; Alt/Option+1–3 also works), by clicking them next to the score, or from MENU, which pauses the clock. Each purchase is one use. Borrowed Time costs 4 and adds 20 seconds immediately. Fresh Ink costs 5: +8 word base and one word-upgrade chain trigger in every excerpt this round. Carbon Copy costs 5: ×2 final round score, without a chain trigger. Scoring consumables also affect already locked excerpts and expire when you enter the shop. Two copies of the same scoring effect cannot be active together. Unused items stay in your bag across rounds. Restocks offer two different consumables, chosen uniformly. Saves retain credits, stock, purchases, bag and active round effects.</p><p>Word upgrades apply to every qualifying word. Sentence upgrades apply once per qualifying excerpt. Run upgrades apply to the three locked excerpts in lock order. Base bonuses and multiplier additions use the scaling factors in section 04, including scoring consumables. Missing article categories grant no affinity; nature and history can both qualify. Back navigation does not earn exploration rewards.</p><div className="rules-catalogue">{UPGRADE_POOL.filter(u=>!u.retired).map(u => <section key={u.id}><span className={`rarity-badge rarity-${u.rarity}`}>{RARITIES[u.rarity].label}</span> <span className="print-label">{u.type}</span><h3>{u.name}{u.temporary?' · THIS ROUND':''}</h3><p>{upgradeDescription(u,rules)}</p></section>)}</div></details>
                <details><summary>06 / Special characters</summary><p>Hold Ctrl for a moment to open the character panel: every special character on the current page, each with a key. While still holding Ctrl, press that key to type the character with your active formatting; release Ctrl to close the panel. Keys are fixed for the whole article, with the most frequent characters on single keys. Pages with more characters than keys use two-key labels (for example Ctrl+0 then Ctrl+S). Experienced players can press Ctrl+key without waiting for the panel. The Ω button pins the panel open for mouse and touch; click a character to type it. Hint keys never reuse the format toggles (B I L ; O M) or the item slots (1–3). Characters that match plain keys are left out: straight quotes match curly quotes, a hyphen matches en and em dashes, and superscript digits accept ordinary digits (² → 2); exponents do not require Citation mode. Combining marks are shown on a dotted circle for legibility; only the mark is inserted.</p><p>Compose also works for common Latin accents and typography: toggle Compose, then type a two-character combination. A supported pair inserts one character with the active formatting and exits Compose. An unsupported pair inserts both characters literally. Escape or Enter cancels composition without clearing the existing input.</p><table><thead><tr><th>Pair</th><th>Character</th></tr></thead><tbody>{Object.entries(COMPOSE_SYMBOLS).map(([pair,char]) => <tr key={pair}><td><code>{pair}</code></td><td>{char}</td></tr>)}</tbody></table><p>Combine a letter with an accent marker in either order: apostrophe for acute, backtick for grave, double quote for diaeresis, ^ for circumflex, ~ for tilde, comma for cedilla, / for stroke, or o for ring. An accented character is inserted when the combination forms a single character; otherwise the pair is inserted literally. Example: apostrophe + e gives é.</p></details>
                <details><summary>07 / Dev mode & sandbox</summary><p>DEV pauses the clock. Tab completes an excerpt only when the current input matches exactly one available excerpt. The scoring sandbox previews actual article excerpts or your own text, with any combination of upgrades. Preview upgrades do not change your equipped upgrades. Time upgrades affect the sandbox’s trial budget, including when lock refunds arrive. Draft upgrades do not affect trial points or time. A trial starts a fresh hypothetical round; it does not inherit already-spent utility effects from your live round.</p><p>Select three different excerpts for a trial. Time is an estimate: character count ÷ (WPM × 5) × 60 seconds, plus 7% for corrections, 0.55 seconds per formatting change, one second per lock, and four seconds to find each excerpt after the first. Each article change adds seven seconds unless Scout’s Honor covers the first hop. Clock-paused network loading is excluded. Affinity rewards use saved article categories; missing categories grant no estimated reward. A lock must finish before the clock expires to receive Second Wind. The time-budget column includes all modeled rewards; a late refund cannot rescue an earlier timeout. Trials can include previously used excerpts. Each ladder row tests the same selection and build; it is not a simulation of earning upgrades over seven rounds.</p><p>Parameter edits affect the sandbox immediately. “Use these rules while playing in dev mode” also changes live previews and results, including already locked excerpts. Leaving dev mode restores standard scoring. Settings are stored in this browser; Reset defaults restores standard values and Export settings downloads them as JSON.</p></details>

        const ScoringSandbox = ({ rules, onChange, onClose, sentences, locked, upgrades, target, applied, onApply, article, onRules, categories = [], ante = 1 }) => {

                    ...Array.from(`[${i + 1}]`, c => ({ c, b: false, i: false, l: false, cit: true, bul: false })),

                ]).flat()
            ] }), [text, sampleFormat, citations, article]);
            const sourceSample = source === 'custom' ? custom : sentences.find(s => String(s.id) === source) || custom;

            const selectedUpgrades = useMemo(() => upgradeByIds(selectedIds), [selectedIds]);

            const trialSeconds=timing.seconds;

            const baseline = useMemo(() => scoreSentence(sample, selectedUpgrades), [sample, selectedUpgrades]);

            const setRule = (key, value, min, max) => {

            return <dialog ref={dialogRef} className="sandbox" aria-labelledby="sandbox-title" onCancel={e => { e.preventDefault(); onClose(); }}>
                <header className="sticky top-0 z-10 bg-[#faf9f5] border-b-2 border-zinc-900 px-5 py-4 flex items-start justify-between gap-4">
                    <div><div className="text-[10px] font-bold tracking-widest uppercase text-orange-700">DEV / LAB 007</div>
                        <h2 id="sandbox-title" className="font-marker text-3xl mt-1">Scoring sandbox</h2>

                            <div className="bg-blue-50 border border-blue-200 rounded p-3"><div className="text-xs text-blue-800">Three-excerpt trial</div><output className="block font-mono text-2xl font-bold break-all">{trialReady ? formatScore(run.runTotal) : '—'}</output><div className="text-xs text-zinc-600 mt-1">{trialReady ? (run.runTotal >= target ? 'Goal reached' : `${formatScore(target - run.runTotal)} short`) : `${trial.length}/3 excerpts selected`} · goal {formatScore(target)}</div></div>
                        </div>
                        <div className="border border-zinc-300 bg-white rounded p-3 mb-4">
                            <div className="flex justify-between gap-2 items-center"><h3 className="font-bold text-sm">Build a real round</h3><button className="text-xs underline" onClick={() => setTrial([])}>Clear trial</button></div>

                            <button className="border border-zinc-400 rounded px-3 py-2 text-xs font-bold disabled:opacity-40" disabled={trialReady || trial.some(s => s.id === sample.id)} onClick={() => setTrial(xs => [...xs, sample])}>Add current excerpt ({trial.length}/3)</button>
                            <label className="flex items-center gap-2 text-xs mt-3">Typing pace <input aria-label="Trial WPM" type="number" min="20" max="200" value={wpm} onChange={e => setWpm(Math.max(20, Math.min(200, Number(e.target.value) || 60)))} /> WPM</label>
                            <p className="text-xs text-zinc-600 mt-2">{trialReady ? `Estimated: ${trialSeconds}s · ${timing.budget}s available${timing.fits ? ` · ${timing.remaining}s spare` : ' · over time'}` : `${trial.length} / 3 trial excerpts`}</p>
                        </div>
                        <details open className="bg-white border border-zinc-300 rounded p-3">
                            <summary className="font-bold text-sm cursor-pointer">How the points add up</summary>
                            <div className="overflow-x-auto mt-3"><table className="w-full text-xs text-right font-mono"><caption className="text-left text-zinc-500 mb-2">Each word: floor(base × length × format) × position</caption><thead><tr className="border-b"><th className="text-left py-2">Word</th><th>Base</th><th>Length ×</th><th>Format ×</th><th>Pos ×</th><th>Total</th></tr></thead><tbody>{detail.words.map((w, i) => <tr key={i} className="border-b border-zinc-100"><td className="text-left py-2 max-w-[120px] truncate" title={w.appliedWordUpgrades.join(', ')}>{w.text}</td><td>{Number(w.base.toFixed(2))}</td><td>{w.lenMult.toFixed(2)}</td><td>{w.formatMult.toFixed(2)}</td><td>{w.posMult}</td><td className="font-bold">{w.total.toLocaleString()}</td></tr>)}</tbody></table></div>
                            <p className="text-xs mt-3">Sentence: floor({Number(detail.sentenceBase.toFixed(2)).toLocaleString()} × {Number(detail.sentenceMultiplier.toFixed(3))} × {detail.chainMultiplier}) = {detail.sentenceTotal.toLocaleString()}</p>

                        </details>
                        <details className="bg-white border border-zinc-300 rounded p-3 mt-3">
                            <summary className="font-bold text-sm cursor-pointer">Try upgrades ({selectedIds.length} selected)</summary>

                            <div className="space-y-2">{[...UPGRADE_POOL.filter(u=>!u.retired||selectedIds.includes(u.id)),...ROUND_EFFECTS].map(u => <label key={u.id} className="flex items-start gap-2 text-sm"><input className="mt-1" type="checkbox" checked={selectedIds.includes(u.id)} onChange={e => setSelectedIds(ids => e.target.checked ? [...ids, u.id] : ids.filter(id => id !== u.id))} /><span><strong>{u.name}</strong> <span className={`rarity-badge rarity-${u.rarity}`}>{RARITIES[u.rarity].label}</span> <span className="text-xs text-zinc-500">{u.type.toLowerCase()}</span><span className="block text-xs text-zinc-600">{upgradeDescription(u, rules)}</span></span></label>)}</div>
                        </details>
                    </section>
                    <section aria-label="Scoring parameters" className="min-w-0">
                        <h3 className="text-sm font-bold mb-3">Bonuses & multipliers</h3>
                        <div className="grid sm:grid-cols-2 gap-x-5 gap-y-3">{SCORE_FIELDS.map(([key, label, min, max, step]) => <div key={key}>
                            <div className="flex items-center justify-between gap-2"><label htmlFor={`score-${key}`} className="text-xs font-medium">{label}</label><input id={`score-${key}`} type="number" min={min} max={Number.isFinite(max)?max:undefined} step={step} value={rules[key]} onChange={e => setRule(key, e.target.value, min, max)} /></div>
                            <input aria-label={`${label} slider`} type="range" min={min} max={Number.isFinite(max)?max:undefined} step={step} value={rules[key]} onChange={e => setRule(key, e.target.value, min, max)} />
                        </div>)}</div>
                        <div className="mt-5 border-t border-zinc-300 pt-4">
                            <label className="flex gap-2 items-start text-sm font-bold"><input className="mt-1" type="checkbox" checked={applied} onChange={e => onApply(e.target.checked)} />Use these rules while playing in dev mode</label>
                            <p className="text-xs text-zinc-600 mt-2">{applied ? 'CUSTOM SCORING ACTIVE IN DEV' : 'STANDARD SCORING ACTIVE'}</p>
                            <div className="flex flex-wrap gap-3 mt-4"><button onClick={() => { onChange({ ...DEFAULT_SCORING }); setNotice('Default scoring restored.'); }} className="bg-white border border-zinc-400 rounded px-3 py-2 text-sm font-bold">Reset defaults</button><button onClick={exportSettings} className="bg-white border border-zinc-400 rounded px-3 py-2 text-sm font-bold">Export settings</button></div>
                            <p role="status" className="text-xs text-blue-700 mt-2">{notice}</p>
                        </div>
                    </section>
                </div>
            </dialog>;
        };

        const App = () => {
            // Game flow
            const [gameState, setGameState] = useState('START'); // START | LOADING | PLAYING | SCORING | UPGRADE_SELECT | LOST | VICTORY | FETCH_ERROR
            const [ante, setAnte]           = useState(1);
            const [totalScore, setTotalScore] = useState(0);
            const [fetchError, setFetchError] = useState(null);
            const [isPractice, setIsPractice] = useState(false);
            const [savedRun, setSavedRun] = useState(readSavedRun);
            const [saveNotice, setSaveNotice] = useState('');
            const [utilityUsed,setUtilityUsed]=useState([]);
            const [scoutUsed,setScoutUsed]=useState(false);
            const [rerollUsed,setRerollUsed]=useState(false);
            const [market,setMarket]=useState(newMarket);
            const marketRef=useRef(market);marketRef.current=market;
            const updateMarket=next=>{marketRef.current=next;setMarket(next);};
            const [utilityNotice,setUtilityNotice]=useState('');
            const itemHotkeyRef=useRef(null);
            const [itemNudge,setItemNudge]=useState(null); // {id,n} — shakes a tray chip when it can't be used
            const [menuOpen,setMenuOpen]=useState(false);
            useEffect(()=>{if(gameState!=='PLAYING')setMenuOpen(false);},[gameState]);
            useEffect(()=>{if(!utilityNotice)return;const timer=setTimeout(()=>setUtilityNotice(''),3500);return ()=>clearTimeout(timer);},[utilityNotice]);
            const targetScore = isPractice ? 0 : getRoundTarget(ante);

            // Article / navigation
            const [article, setArticle]             = useState(null);
            const [contentBlocks, setContentBlocks] = useState([]);
            const [navHistory, setNavHistory]       = useState([]);
            const [isNavigating, setIsNavigating]   = useState(false);
            const [articleMeta, setArticleMeta]     = useState({ leadImageUrl: null, era: null });
            const [halftoneBg, setHalftoneBg]       = useState(null);  // data URL for tiled bg

            // Player input
            const [buffer, setBuffer]                   = useState([]);
            const [format, setFormat]                   = useState({ b: false, i: false, l: false, cit: false, bul: false });
            const [lockedSentences, setLockedSentences] = useState([]);
            const [usedSentenceIds, setUsedSentenceIds] = useState(new Set());
            const [roundStarted, setRoundStarted]       = useState(false);
            const [timeLeft, setTimeLeft]               = useState(GAME_DURATION_BASE);

            const [roundClock, setRoundClock]           = useState(GAME_DURATION_BASE); // starting seconds, for the timer bar
            // Special-character panel: open while Ctrl is held (or pinned from the Ω button)
            const [charPanel, setCharPanel] = useState({ open: false, pinned: false, prefix: '' });
            const charPanelRef = useRef(charPanel); charPanelRef.current = charPanel;
            const ctrlTimerRef = useRef(null);

            // Compose mode
            const [isComposing, setIsComposing] = useState(false);
            const [composeSeq, setComposeSeq]   = useState("");

            // Roguelike augments
            const [activeUpgrades, setActiveUpgrades] = useState([]);
            const [upgradeOptions, setUpgradeOptions] = useState([]);

            // UI overlays
            const [isDevMode, setIsDevMode]                 = useState(false);
            const [showSandbox, setShowSandbox] = useState(false);
            const [scoringRules, setScoringRules] = useState(readScoring);
            const [useCustomScoring, setUseCustomScoring] = useState(false);
            const rules = isDevMode && useCustomScoring ? scoringRules : DEFAULT_SCORING;
            const [navigationError, setNavigationError] = useState('');
            useEffect(() => {
                try { localStorage.setItem('encyclo.scoring.balance.v5', JSON.stringify(scoringRules)); } catch {}
            }, [scoringRules]);
            const [showCommandsModal, setShowCommandsModal] = useState(false);
            const [idleHint, setIdleHint]             = useState(null);
            const [muted, setMuted]                         = useState(false);
            const [mood, setMood]                           = useState(null);
            const [flash, setFlash]                         = useState(null);  // 'mid' | 'late' | 'final'

            const snapshotRef = useRef(null);
            snapshotRef.current = !isPractice && ['PLAYING', 'SCORING', 'UPGRADE_SELECT'].includes(gameState) && contentBlocks.length && !isNavigating ? {
                version: 1, balanceVersion: 10, market, gameState, ante, totalScore, timeLeft, article, contentBlocks, navHistory, articleMeta,
                buffer, format, lockedSentences, usedSentenceIds: [...usedSentenceIds],
                upgradeIds: activeUpgrades.map(u => u.id), optionIds: upgradeOptions.map(u => u.id),
                utilityUsed, scoutUsed, rerollUsed, isDevMode, useCustomScoring, scoringRules, roundClock, savedAt: Date.now()
            } : null;
            const persistRun = useCallback(() => {
                const snapshot = snapshotRef.current;
                if (!snapshot) return false;
                try {
                    localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot));
                    setSavedRun(snapshot); setSaveNotice('Saved on this browser'); return true;
                } catch { setSaveNotice('Saving is unavailable. Keep this tab open to continue your run.'); return false; }
            }, []);
            useEffect(() => {
                const saveBeforeLeaving = () => persistRun();
                const timer = setInterval(saveBeforeLeaving, 3000);
                window.addEventListener('pagehide', saveBeforeLeaving);
                document.addEventListener('visibilitychange', saveBeforeLeaving);
                return () => { clearInterval(timer); window.removeEventListener('pagehide', saveBeforeLeaving); document.removeEventListener('visibilitychange', saveBeforeLeaving); };
            }, [persistRun]);
            useEffect(() => {
                if (!isPractice && ['LOST', 'VICTORY'].includes(gameState)) {
                    try { localStorage.removeItem(SAVE_KEY); } catch {}
                    setSavedRun(null); setSaveNotice('');
                } else if (['PLAYING','SCORING', 'UPGRADE_SELECT'].includes(gameState)) persistRun();
            }, [gameState, isPractice, persistRun, market, activeUpgrades, upgradeOptions]);
            const leaveRun = () => {
                if (isPractice || persistRun()) { AudioEngine.stopAmbient(); setGameState('START'); setIsPractice(false); }
            };
            const resumeRun = () => {
                const saved = readSavedRun();
                if (!saved) { setSavedRun(null); setSaveNotice('That save could not be opened. You can start a new run.'); return; }
                setIsPractice(false); setAnte(saved.ante); setTotalScore(saved.totalScore); setTimeLeft(saved.timeLeft + (saved.balanceVersion < 5 || !saved.balanceVersion ? 10 : 0));
                setUtilityUsed(Array.isArray(saved.utilityUsed)?saved.utilityUsed.filter(x=>['nature','history','wayfarer'].includes(x)):[]);setScoutUsed(!!saved.scoutUsed);setRerollUsed(!!saved.rerollUsed);setUtilityNotice('');
                setArticle(saved.article); setContentBlocks(saved.contentBlocks); setArticleMeta(saved.articleMeta || {});
                setNavHistory(saved.navHistory); setBuffer(saved.buffer); setFormat(saved.format || EMPTY_FORMAT);
                setLockedSentences(saved.lockedSentences); setUsedSentenceIds(new Set(saved.usedSentenceIds));
                setActiveUpgrades(upgradeByIds(saved.upgradeIds));
                const prior=saved.market;
                if(prior && (saved.balanceVersion||0)<9)prior.incomeRemainder=(prior.incomeRemainder||0)*4;
                // Older saves: bags were packed arrays and packs could hold retired Worlds of Type cards.
                if(prior && (saved.balanceVersion||0)<10)prior.bag=(prior.bag||[]).filter(id=>CONSUMABLES.some(c=>c.id===id));
                if(prior?.pack){const choices=(prior.pack.choices||[]).filter(id=>boosterById(id));prior.pack=choices.length&&PACKS[prior.pack.kind]?{...prior.pack,choices}:null;}
                const seconds=n=>Number.isFinite(n)&&n>0?Math.floor(n):0;
                updateMarket(prior?{...newMarket(),...prior,credits:Math.max(0,Number.isFinite(prior.credits)?Math.floor(prior.credits):7),bag:normalizeBag(prior.bag),stock:(prior.stock||[]).filter(id=>CONSUMABLES.some(c=>c.id===id)),extraSeconds:seconds(prior.extraSeconds),nextSeconds:seconds(prior.nextSeconds)}:{...newMarket(),credits:7,stock:drawConsumables()});
                setRoundClock(Number.isFinite(saved.roundClock)?Math.max(saved.roundClock,saved.timeLeft):Math.max(saved.timeLeft,getRoundDuration(saved.ante)));
                setUpgradeOptions(UPGRADE_POOL.filter(u => saved.optionIds.includes(u.id)&&shopEligible(u,upgradeByIds(saved.upgradeIds),saved.ante)));
                setIsDevMode(!!saved.isDevMode); setUseCustomScoring(saved.balanceVersion >= 7 && !!saved.useCustomScoring);
                if (saved.balanceVersion >= 7 && saved.scoringRules) setScoringRules(Object.fromEntries(SCORE_FIELDS.map(([key,,min,max]) => [key, Number.isFinite(saved.scoringRules[key]) ? Math.max(min, Math.min(max, saved.scoringRules[key])) : DEFAULT_SCORING[key]])));
                setRoundStarted(false); setIsNavigating(false); setIsComposing(false); setComposeSeq('');
                setShowCommandsModal(false); setShowSandbox(false); setFlash(null); setNavigationError('');
                setGameState(saved.gameState); AudioEngine.playBell();
            };
            const startPractice = () => {
                setUtilityUsed([]);setScoutUsed(false);setRerollUsed(false);setUtilityNotice('');
                updateMarket(newMarket());
                setIsPractice(true); setAnte(1); setTotalScore(0); setActiveUpgrades([]); setUpgradeOptions([]);
                setArticle('A little curiosity'); setContentBlocks(PRACTICE_EXCERPTS.map((s,i) => ({ type: 'PARAGRAPH', id: `practice-p-${i}`, tag: 'p', sentences: [s] })));
                setArticleMeta({ leadImageUrl: null, allImages: [] }); setNavHistory([]); setBuffer([]); setFormat({ ...EMPTY_FORMAT });
                setLockedSentences([]); setUsedSentenceIds(new Set()); setTimeLeft(GAME_DURATION_BASE); setRoundClock(GAME_DURATION_BASE); setRoundStarted(false);
                setIsDevMode(false); setShowSandbox(false); setShowCommandsModal(false); setIsNavigating(false); setIsComposing(false); setComposeSeq(''); setFlash(null); setNavigationError('');
                setGameState('PLAYING'); AudioEngine.playBell();
            };

            useEffect(() => {
                if (showCommandsModal || showSandbox) setIdleHint(null);
            }, [showCommandsModal, showSandbox]);

            useEffect(() => {
                if (gameState === 'PLAYING' && !showSandbox && !showCommandsModal && !isNavigating && !menuOpen) {
                    document.querySelector('[data-typing-surface]')?.focus({ preventScroll: true });
                }
            }, [gameState, showSandbox, showCommandsModal, isNavigating, menuOpen]);

            // Build one tall halftone bg that stacks every article image
            // vertically. Tiles down the page; if only one image exists, that
            // single halftone repeats. CSS `background-repeat: repeat-y` then
            // loops the whole stack.
            useEffect(() => {
                setHalftoneBg(null);
                const sources = (articleMeta.allImages || []).slice(0, 6);
                if (sources.length === 0) return;

                const imgs = sources.map(src => {
                    const im = new Image();
                    im.crossOrigin = 'anonymous';
                    im.src = src.startsWith('//') ? 'https:' + src : src;
                    return im;
                });

                let cancelled = false, frameId = null, objectUrl = null, wakeFrame = null;
                Promise.all(imgs.map(im => new Promise((resolve) => {
                    if (im.complete && im.naturalWidth) resolve();
                    else { im.onload = () => resolve(); im.onerror = () => resolve(); }
                }))).then(async () => {
                    if (cancelled) return;
                    const SIZE = 800;
                    const valid = imgs.filter(im => im.naturalWidth);
                    if (valid.length === 0) return;

                    const stack = document.createElement('canvas');
                    stack.width = SIZE;
                    stack.height = SIZE * valid.length;
                    const stx = stack.getContext('2d');
                    stx.fillStyle = '#f4f6fc';
                    stx.fillRect(0, 0, stack.width, stack.height);

                    valid.forEach((im, i) => {
                        const sw = im.naturalWidth, sh = im.naturalHeight;
                        const side = Math.min(sw, sh);
                        try {
                            stx.drawImage(im, (sw-side)/2, (sh-side)/2, side, side, 0, i*SIZE, SIZE, SIZE);
                        } catch (e) {}
                    });

                    let pixels;
                    try { pixels = stx.getImageData(0, 0, stack.width, stack.height).data; }
                    catch (e) { return; }

                    const out = document.createElement('canvas');
                    out.width = stack.width;
                    out.height = stack.height;
                    const octx = out.getContext('2d');
                    octx.fillStyle = '#f4f6fc';
                    octx.fillRect(0, 0, out.width, out.height);

                    const step = 4;
                    const maxR = step * 0.7;

                    let sliceStart = performance.now();
                    for (let y = 0; y < out.height; y += step) {
                        if (cancelled) return;
                        if (performance.now()-sliceStart > 4) {
                            await new Promise(resolve => { wakeFrame=resolve;frameId=requestAnimationFrame(resolve); });
                            wakeFrame=null;if(cancelled)return;sliceStart=performance.now();
                        }
                        for (let x = 0; x < out.width; x += step) {
                            const idx = (y * out.width + x) * 4;
                            let r = pixels[idx], g = pixels[idx+1], b = pixels[idx+2];
                            const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
                            const radius = (1 - lum) * maxR + 0.5;
                            const avg = (r+g+b)/3;
                            const boost = 1.4;
                            r = Math.max(0, Math.min(255, avg + (r-avg)*boost));
                            g = Math.max(0, Math.min(255, avg + (g-avg)*boost));
                            b = Math.max(0, Math.min(255, avg + (b-avg)*boost));
                            octx.fillStyle = `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
                            octx.beginPath();
                            octx.arc(x + step/2, y + step/2, radius, 0, Math.PI * 2);
                            octx.fill();
                        }
                    }
                    out.toBlob(blob => {
                        if(cancelled || !blob)return;
                        objectUrl=URL.createObjectURL(blob);
                        setHalftoneBg(objectUrl);
                    }, 'image/png');
                });
                return () => {
                    cancelled = true;
                    if(frameId!==null)cancelAnimationFrame(frameId);
                    wakeFrame?.();
                    imgs.forEach(im=>{im.onload=null;im.onerror=null;});
                    if(objectUrl)URL.revokeObjectURL(objectUrl);
                };
            }, [articleMeta.allImages]);

            // Tell the audio engine about the era so typewriter clicks adjust
            // (older = duller/lower freq, modern = crisper).
            useEffect(() => {
                AudioEngine.setEra(articleMeta.era);
            }, [articleMeta.era]);
            useEffect(() => {
                if (!contentBlocks.length) return;
                let disposed=false;
                const t = setTimeout(async () => {
                    const root = document.querySelector('.wiki-content');
                    if (!root) return;
                    const candidates = [];
                    root.querySelectorAll('audio source, audio').forEach(el => {
                        const s = el.getAttribute('src');
                        if (s) candidates.push(s);
                    });
                    // Wikipedia audio links: <a href="//upload.../File.ogg"> or .mp3/.wav
                    root.querySelectorAll('a').forEach(a => {

        const shopBlurb = (u, rules) => SHOP_BLURBS[u.id] || upgradeDescription(u, rules).replace(/^Multiply the round score by (\S+) when/, '×$1 round score when').replace(/ \([^)]*\)\.$/, '.');
        const ITEM_BLURBS = { hourglass:'+20 seconds on the clock.', carbon:'Doubles one round’s score.', ink:'+8 base per word for one round.', loupe:'Outlines the three best unused excerpts on this article.', highlighter:'×2 word multiplier on formatted words for one round.' };
        const listNames = names => names.length <= 3 ? names.join(', ').replace(/, ([^,]*)$/, ' & $1') : `${names.slice(0, 3).join(', ')} & ${names.length - 3} more`;

        // Slots full: pick which buff the new card replaces, with each swap's last-round replay.
        const SwapDialog = ({ opt, owned, credits, locked = [], lastScore = null, rules, onSwap, onClose }) => {
            const ref = useRef(null);
            useEffect(() => { const d = ref.current; d.showModal(); d.querySelector('.swap-list button:enabled')?.focus(); return () => d.close(); }, []);
            const price = shopPrice(opt), slots = slottedBuffs(owned);
            return <dialog ref={ref} className="pack-dialog swap-dialog" aria-labelledby="swap-title" onCancel={e => { e.preventDefault(); onClose(); }}>
                <header className="pack-dialog-head"><div><span className="print-label">Slots full · {opt.name} costs {price}¢ · you have {credits}¢</span><h2 id="swap-title">Swap out</h2></div><button onClick={onClose}>Cancel</button></header>
                <div className="swap-list">{slots.map(u => {
                    const sell = sellValue(u), net = price - sell, after = owned.map(x => x === u ? opt : x);
                    const fits = slotUse(after) <= BUFF_SLOTS, can = fits && credits + sell >= price;
                    const replay = lastScore !== null && locked.length === REQUIRED_SENTENCES ? scoreRun(locked, after, rules).runTotal : null;
                    return <button key={u.id} disabled={!can} onClick={() => onSwap(u.id)}>
                        <span className="swap-out"><b><RichText text={u.richName || u.name}/></b><small>{!fits ? `${opt.name} needs ${opt.slots} slots` : `sells for ${sell}¢`}</small></span>
                        <span className="swap-cost">{!can && fits ? `need ${net - credits}¢ more` : net > 0 ? `pay ${net}¢` : net < 0 ? `get ${-net}¢` : 'even'}</span>
                        <span className="swap-replay">{replay === null ? <em>no replay</em> : replay === lastScore ? <em>no change</em> : <>{formatScore(lastScore)}<i>→</i><b className={replay > lastScore ? 'up' : 'down'}>{formatScore(replay)}</b></>}</span>
                    </button>;
                })}</div>
                <p className="pack-dialog-note">Each row rescores your last round with that swap. {opt.name}: <RichText text={shopBlurb(opt, rules)}/></p>
            </dialog>;
        };

        const PackDialog = ({ pack, sentences, owned, rules, locked = [], lastScore = null, onChoose, onSkip }) => {
            const ref = useRef(null);
            useEffect(() => {
                const previous = document.activeElement, dialog = ref.current;
                dialog.showModal();
                dialog.querySelector('.pack-dialog-cards button')?.focus();
                return () => { dialog.close(); previous?.focus?.(); };
            }, []);
            return <dialog ref={ref} className="pack-dialog" aria-labelledby="pack-dialog-title" onCancel={e => e.preventDefault()}>
                <header className="pack-dialog-head">
                    <div><span className="print-label">{PACKS[pack.kind].name}</span><h2 id="pack-dialog-title">Pick one</h2></div>
                    <button onClick={onSkip}>Skip</button>
                </header>
                <div className="pack-dialog-cards">{pack.choices.map((id, i) => {
                    const u = boosterById(id); if (!u) return null;
                    const proof = boosterEvidence(u, sentences, owned, rules);
                    const replay = lastScore !== null && locked.length === REQUIRED_SENTENCES ? scoreRun(locked, [...owned, u], rules).runTotal : null;
                    return <button key={id} onClick={() => onChoose(id)} style={{ animationDelay: `${i * 70}ms`, '--sweep-delay': `${.6 + i * .35}s` }} className={`rarity-${u.rarity}-card`}>
                        <span className="pack-dialog-plate" aria-hidden="true"><b className="pack-dialog-glyph" lang="und">{u.glyph}</b>{u.rarity === 'legendary' && <i className="pack-sparks" />}</span>
                        <span className={`rarity-badge rarity-${u.rarity}`}>{RARITIES[u.rarity].label}</span>
                        <strong>{u.name}</strong>
                        <em className="pack-dialog-boost">+{u.boostAmount.toLocaleString()} <span>per character</span></em>
                        <small>{u.desc.replace(/\s*Permanent; each level stacks\.$/, '')}</small>
                        {replay !== null && <span className="shop-preview pack-replay"><small>Last round</small>{replay === lastScore ? <span>No change</span> : <span>{formatScore(lastScore)}<i aria-hidden="true">→</i><b>{formatScore(replay)}</b></span>}</span>}
                        <span className="pack-dialog-proof"><span>{proof.count ? `${proof.count} excerpt${proof.count === 1 ? '' : 's'} here` : 'No matches here · explore other articles'}</span>{proof.best && <em>Best +{formatScore(proof.best.gain)}</em>}</span>
                        {proof.best && <q>{proof.best.sample.chars.map(c => c.c).join('')}</q>}
                    </button>;
                })}</div>
                <p className="pack-dialog-note">Permanent. Levels stack up to three. Skipping gives no refund.</p>
            </dialog>;
        };

        /* ================================================================
           SPECIAL-CHARACTER PANEL — hold Ctrl to see a key for every special
           character on the page, then press Ctrl+key to type it. Keys skip the
           format toggles (B I L ; O M), the item slots (1–3) and keys browsers
           will not release (N T W Q R). Labels are stable for the whole article,
           most frequent characters first; big pages get two-key labels.
           ================================================================ */
        const HINT_KEYS=['a','s','d','f','g','h','j','k','e','u','y','p','c','x','z','v','4','5','6','7','8','9','0'];
        function hintLabels(n, keys = HINT_KEYS) {
            const leaves=[...keys];
            while(leaves.length<n){
                // Expand the least-preferred of the shortest labels into a two-key prefix.
                const shortest=Math.min(...leaves.map(l=>l.length));
                let at=leaves.length-1;while(leaves[at].length!==shortest)at--;
                const [prefix]=leaves.splice(at,1);
                leaves.push(...keys.map(k=>prefix+k));
            }
            return leaves.slice(0,n).sort((a,b)=>a.length-b.length);
        }
        function hintKeyFromEvent(e) {
            const key=(e.key||'').toLowerCase();
            if(/^[a-z0-9]$/.test(key))return key;
            const code=/^(?:Key([A-Z])|Digit([0-9])|Numpad([0-9]))$/.exec(e.code||'');
            return code?(code[1]||code[2]||code[3]).toLowerCase():null;
        }
        const codePointLabel=c=>Array.from(c).map(ch=>'U+'+ch.codePointAt(0).toString(16).toUpperCase().padStart(4,'0')).join(' ');
        const CharPanel = ({ entries, prefix, pinned, onPick, onClose }) => <div className={`char-panel ${pinned?'is-pinned':''}`} role="dialog" aria-label="Special characters on this page">
            <header className="char-panel-head">
                <span><b>Ctrl</b> + key types a character{prefix?<> · <kbd>{prefix.toUpperCase()}</kbd>…</>:''}</span>
                <span>{entries.length} on this page{pinned?<button onClick={onClose} aria-label="Close special characters">Close ×</button>:' · release Ctrl to close'}</span>
            </header>
            <div className="char-panel-grid">{entries.map(e => {
                const dim=prefix&&!e.hint.startsWith(prefix);
                return <button key={e.c} type="button" className={dim?'is-dim':''} onMouseDown={ev=>ev.preventDefault()} onClick={()=>onPick(e.c)} title={`${e.c} · ${codePointLabel(e.c)} · appears ${e.count}× · Ctrl+${e.hint.toUpperCase().split('').join(' then Ctrl+')}`}>
                    <span className="char-panel-glyph" lang="und">{/\p{M}/u.test(e.c)?`◌${e.c}`:e.c}</span>
                    <kbd>{prefix&&e.hint.startsWith(prefix)?<><s>{prefix.toUpperCase()}</s>{e.hint.slice(prefix.length).toUpperCase()}</>:e.hint.toUpperCase()}</kbd>
                </button>;
            })}</div>
        </div>;

        // Owned buffs, always in view: the slotted cards, this round's item effects, and letter levels in one line.
        // In the shop each card can be sold and, for Understudy, moved. Cards the current excerpt triggers light up;
        // run cards already ruled out dim.
        const sellValue = u => Math.floor(shopPrice(u) / 2);
        // Buff icons: the buff's own token when it has one (T, 10+, –ing, a bold B), else a mark for its kind.
        const BUFF_MARKS = { length:'↔', double:'×2', position:'#', lexical:'“”', flourish:'~', resonant:'≈', morpheme:'-', figures:'9', summit:'▲', alliterative:'AA', snowball:'◢', count:'W', span:'↔', census:'Σ', ending:'.', mark:'( )', cited:'†', 'citation-content':'†', echo:'↻', overprint:'▣', vintage:'⌛', pyramid:'△', every:'∞', 'round-tally':'Σ', shape:'Aa',
            bookends:'[ ]', illuminated:'Aa', footnotes:'†', resonance:'≈', pocketwatch:'◷', breathing:'~', scout:'◎', curator:'⊕', mulligan:'⟲', naturalist:'❦', historian:'Ⅻ', wayfarer:'→', prismatic:'◆', singularity:'●', mosaic:'▦', encyclopedist:'E', patron:'¢', 'clean-copy':'✓', tempo:'♩', marginalia:'✎', lede:'¶', 'title-drop':'H', polyglot:'αβ',
            'rabbit-hole':'⤵', 'safety-net':'#', understudy:'⇡', 'tip-jar':'¢', bounty:'★', 'long-form':'≡', anchor:'⚓︎', frugal:'□', 'face-value':'¤', 'glass-cannon':'×5', royalties:'¢', interest:'%', chain:'∞', 'chain-forged':'∞', diacritics:'é', numerologist:'123', tiny:'a',
            'carbon-effect':'⧉', 'ink-effect':'✒︎', 'highlighter-effect':'▬', hourglass:'⧗', loupe:'⌕' };
        const TOKEN_MARKS = { Bold:<b key="b">B</b>, Italic:<i key="i">I</i>, Linked:'↗', Bullet:'•', Cited:'[1]', Rising:'↗', Falling:'↘', 'Country name':'⚑' };
        const buffIcon = u => {
            const tokens = [...(u.richName || '').matchAll(/⟦([^⟧]+)⟧/g)].map(m => m[1]).filter(t => t !== '×');
            const kind = BUFF_MARKS[u.template] || BUFF_MARKS[u.id];
            if (!tokens.length) return { main: kind || u.name.split(/\s+/).map(w => w[0]).join('').slice(0, 2), mark: null };
            const t = tokens[0].replace(/[“”"]/g, '');
            const main = t.split(/\s*\+\s*/).map(x => TOKEN_MARKS[x] ?? TOKEN_MARKS[x.split(' ')[0]] ?? (x.length > 5 ? x.slice(0, 4) : x));
            const mark = ['letter', 'ink', 'format-combo'].includes(u.template) ? (tokens[1] || null) : tokens[1] ? `${kind || ''}${tokens[1]}` : kind;
            return { main, mark };
        };
        const BuffTile = ({ u, rules, gain, live, off, effect, children }) => {
            const { main, mark } = buffIcon(u);
            return <li data-name={u.name} tabIndex={0} aria-label={u.name} className={`rail-item rail-tile type-${(u.type || 'UTILITY').toLowerCase()}${live ? ' is-live' : ''}${off ? ' is-off' : ''}${effect ? ' is-effect' : ''}${u.slots > 1 ? ' is-double' : ''}`}>
                <span className={`rt-glyph${[].concat(main).map(x => typeof x === 'string' ? x : 'x').join('').length > 3 ? ' is-long' : ''}`} lang="und">{main}</span>{mark && <sup className="rt-mark">{mark}</sup>}{u.times && <sub className="rt-times">×</sub>}
                <div className="rt-card" role="tooltip">
                    <b><RichText text={u.richName || u.name}/>{effect && <em>this round</em>}{u.slots > 1 && <em>2 slots</em>}</b>
                    {gain && <em className="rail-gain">{gain}</em>}
                    <span><RichText text={upgradeDescription(u, rules)}/></span>
                    {children}
                </div>
            </li>;
        };
        const BuildList = ({ upgrades, rules, fired = [], lost = [], onSell, onMove, detail }) => {
            const gains = buffGains(detail);
            const showEmpty = !!onSell;
            const on = new Set(fired), off = new Set(lost);
            const [armed, setArmed] = useState(null);
            useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(null), 3000); return () => clearTimeout(t); }, [armed]);
            const slotted = slottedBuffs(upgrades), effects = upgrades.filter(u => u.temporary), letters = upgrades.filter(u => u.booster);
            const reorder = onMove && slotted.some(u => u.id === 'understudy');
            const gainOf = u => gains.has(u.name) ? gainText(gains.get(u.name)) : null;
            return <>
                <ul className={`rail-tiles${slotted.some(u => on.has(u.name)) || effects.some(u => on.has(u.name)) ? ' has-live' : ''}`}>{slotted.map((u, i) => <BuffTile key={u.id} u={u} rules={rules} gain={gainOf(u)} live={on.has(u.name)} off={off.has(u.name)}>
                        {u.id === 'understudy' && <small className="rt-note">{i && ['WORD','SENTENCE','RUN'].includes(slotted[i - 1].type) && slotted[i - 1].id !== 'safety-net' ? `Copying ${slotted[i - 1].name}.` : 'Copies nothing: put a scoring buff directly above it.'}</small>}
                        {(onSell || reorder) && <div className="rail-actions">
                            {reorder && <><button type="button" aria-label={`Move ${u.name} up`} disabled={!i} onClick={() => onMove(u.id, -1)}>↑</button><button type="button" aria-label={`Move ${u.name} down`} disabled={i === slotted.length - 1} onClick={() => onMove(u.id, 1)}>↓</button></>}
                            {onSell && <button type="button" className={`rail-sell${armed === u.id ? ' is-armed' : ''}`} onClick={() => { if (armed === u.id) { setArmed(null); onSell(u.id); } else setArmed(u.id); }}>{armed === u.id ? `Confirm +${sellValue(u, upgrades)}¢` : `Sell ${sellValue(u, upgrades)}¢`}</button>}
                        </div>}
                    </BuffTile>)}
                    {showEmpty && Array.from({ length: Math.max(0, BUFF_SLOTS - slotUse(upgrades)) }, (_, i) => <li key={`empty-${i}`} className="rail-slot" aria-label="Empty slot"/>)}
                    {effects.map(u => <BuffTile key={u.id} u={u} rules={rules} gain={gainOf(u)} live={on.has(u.name)} effect/>)}
                </ul>
                {!showEmpty && !slotted.length && !effects.length && <p className="rail-empty">No buffs yet</p>}
                {letters.length > 0 && <p className="rail-letters" title={letters.map(u => u.name).join(', ')}>{letters.map(u => <i key={u.id} lang="und">{u.glyph}<sup>{u.level}</sup></i>)}</p>}
            </>;
        };
        const BuildRail = ({ label = 'Your buffs', ...props }) => <aside className="build-rail" aria-label={label}>
            <div className="rail-head" title={`${label}: ${slotUse(props.upgrades)} of ${BUFF_SLOTS} slots`}><b>{slotUse(props.upgrades)}/{BUFF_SLOTS}</b></div>
            <BuildList {...props}/>
        </aside>;

        const BuildDrawer = (props) => {
            const ref = useRef(null);
            useEffect(() => {
                const close = e => { if (ref.current?.open && !ref.current.contains(e.target)) ref.current.open = false; };
                document.addEventListener('pointerdown', close);
                return () => document.removeEventListener('pointerdown', close);
            }, []);
            const onKeyDown = e => { if (e.key === 'Escape' && ref.current.open) { e.stopPropagation(); ref.current.open = false; ref.current.querySelector('summary').focus(); } };
            return <details ref={ref} className="shop-build" onKeyDown={onKeyDown}>
                <summary>Buffs <b>{slotUse(props.upgrades)}/{BUFF_SLOTS}</b></summary>
                <div className="shop-build-panel build-rail-list"><BuildList {...props}/></div>
            </details>;
        };

        const RulesDialog = ({ onClose, rules = DEFAULT_SCORING }) => <ManualDialog onClose={onClose}>
            <header className="rule-head"><div><h2>Rules</h2></div><button autoFocus onClick={onClose} aria-label="Close rules">Close</button></header>
            <div className="rule-body">
                <p className="rules-edition">{rules === DEFAULT_SCORING ? 'Standard scoring' : 'Custom dev scoring'} · values below match the active rules.</p>
                <details open><summary>01 / The run</summary><p>Lock three different excerpts before the clock runs out. Their scores multiply together. Reach the round’s target to advance, then visit the shop to buy permanent upgrades and consumables. Clear all eight rounds to win. Banked score is the sum of cleared rounds; it does not pay the next target.</p><p>Sentences, headings and captions can be excerpts; captions and infobox cells show a faint dotted underline. Start at the beginning of one and type its complete text, including spaces, punctuation and citations, matching the formatting of every character. Press Enter or Lock to bank it. Used excerpts are greyed out for the rest of that article visit, and the third lock starts the tally.</p>
                    <p>The top bar reads left to right. <b>Target</b> is the round goal. <b>This sentence</b> appears once your typing matches exactly one excerpt and shows its full score, with the credits its words will pay. <b>Aim per sentence</b> (<b>Still needed</b> on the last one) is the equal score each open slot needs to clear the round, counting only guaranteed multipliers; hover it for the version where every run bonus still in reach also lands. It is a guide: a strong excerpt can carry a weak one. <b>Credits</b> is what you hold. On the last excerpt, <b>Round if locked</b> gives the finished forecast.</p>
                    <p>The pace gauge on the left fills toward <b>Goal</b> as you bank excerpts. The notch marks exactly-on-pace; fill above it means you are ahead. The striped segment previews the excerpt you are typing, and <b>This one</b> compares it to what the slot needs.</p><table><thead><tr><th>Round</th><th>Target</th><th>Clock</th></tr></thead><tbody>{ROUND_SECONDS.map((seconds,i) => <tr key={i}><td>{i+1}</td><td>{formatScore(getRoundTarget(i+1))}</td><td>{seconds}s</td></tr>)}</tbody></table></details>
                <details><summary>02 / Typing & formatting</summary><p>Click the typing field to focus it. Formatting buttons are toggles, not keys you hold down. Turn each required format on before typing that part, then off when it ends. Multiple formats can be on at once. The toggles stay on until you change them, including between excerpts. After three seconds without typing in an unfinished excerpt, a hint appears above the input when the next character is unambiguous. It shows the character and any formatting toggles that need changing. If only the last character is wrong, it shows how to replace it. Typing or changing a format dismisses the hint. The format-button values show the standard word multiplier for bold/italic, link points per word, and citation multiplier per citation block; bullet formatting itself adds no points.</p><table><thead><tr><th>Action</th><th>Shortcut</th></tr></thead><tbody>{[['Bold','B'],['Italic','I'],['Link','L'],['Citation',';'],['Bullet','O'],['Compose','M']].map(([label,key]) => <tr key={key}><td>{label}</td><td>Ctrl / ⌘ + {key}</td></tr>)}<tr><td>Special characters</td><td>Hold Ctrl, then Ctrl + shown key</td></tr><tr><td>Use item in bag slot 1–3</td><td>Ctrl + 1–3</td></tr></tbody></table><p>Enter locks only a complete match. Backspace removes the last character. Ctrl, ⌘ or Alt + Backspace clears the input. Clear or Escape clears the unfinished sentence and resets formatting; locked sentences stay. Escape first closes Compose or the special-character panel when either is open. An unmatched character or format turns the input red; edit it to restore a match. Straight quotes also match curly quotes; a hyphen matches an en dash or em dash. Spaces still require the correct formatting.</p><p>Citation mode applies to references and annotations such as [which?] and [citation needed], including brackets. These use small baseline brackets with a dotted underline, without internal link or italic toggles. Math superscripts and area exponents are ordinary text, never citations. Each format combination has its own ink color and an underline showing its component colors. Hover a word or check the active-format preview to see the combination; bullet-only text and bullet markers stay green. Bullet mode matches the text of a list item; do not type its decorative bullet. Special characters typed from the Ctrl panel use your active formats.</p><p>Practice has three excerpts, no clock and no target. Complete the plain, bold and italic excerpts to finish; it does not replace your saved run.</p></details>
                <details><summary>03 / Navigation, clock & saving</summary><p>The clock starts with your first typed character, inserted special character or article link, except for an unused Scout’s Honor free click. Following a link clears unfinished input after the new article loads; locked excerpts and upgrades remain. Back returns to a previously visited article.</p><p>The clock pauses while the game menu is open, during article loading, Rules, dev mode and scoring. Practice is untimed. Switching browser tabs alone does not pause a running clock. Save & leave stores the run in this browser; Continue resumes with the clock paused until typing or navigation begins. The run also autosaves while playing. Restart starts at round one with a new article and resets upgrades and credits; Keep playing cancels it. The clock pauses while choosing. New run replaces the saved run.</p></details>
                <details><summary>04 / Every point, in order</summary><p>Scoring has one shape everywhere. A word scores <b>base × mult</b>. An excerpt scores <b>WORDS × MULT</b>: WORDS (blue) is its word scores added up plus sentence base bonuses, MULT (red) is its citations, sentence multiplier bonuses and chain. A round multiplies the three excerpts, then run buffs multiply that. The top bar shows WORDS × MULT live while you type (hover it for the list of contributions), finished words pop their points above the article, the buffs list says what each buff is adding right now, and the tally replays it all step by step. Click any word for its own breakdown, or switch the menu’s Word scores setting to hover.</p><p>Split an excerpt at spaces to form words. Punctuation counts toward word length. Citation characters are excluded from word scores and word length; each uninterrupted citation block supplies a sentence multiplier instead.</p><p>Letter values: A E I L N O R S T U = 1; D G = 2; B C M P = 3; F H V W Y = 4; K = 5; J X = 8; Q Z = 10. Character boosters are added first, then uppercase A–Z multiplies the combined value by {rules.capital}. Digits use their numeric value. Ordinary punctuation (. , ! ? ; : quotes parentheses brackets braces hyphens dashes underscore) scores {rules.punctuation}; other characters score {rules.special}.</p><p>Add character values, +{rules.link} if any character is linked, and qualifying word upgrade base bonuses ×{rules.wordBonus}. Length multiplier is 1 up to {rules.lengthStart} characters, then +{rules.lengthStep} per additional character, with no cap. Any bold character supplies ×{rules.bold}; any italic character supplies ×{rules.italic}; these multiply together. Word upgrade multiplier additions ×{rules.wordBonus} are added after those format multipliers. Face Value adds a tenth of a number's value to its word base (1907 adds 191). Glass Cannon takes two buff slots and multiplies every round by 5. Cards marked × multiply the word multiplier instead, after every addition, so they grow with the rest of your build. Click any word, in the article or the tally, to see its base, its multiplier (length × format) and its score. The menu’s Word scores setting switches this to hover.</p><p className="rule-equation">Word = floor(base × length multiplier × format multiplier)</p><p>First and last words have no innate bonus. Position buffs reward them when purchased. Sum the word totals and add sentence upgrade base bonuses ×{rules.sentenceBonus}. The sentence multiplier starts at {rules.citation} raised to the number of citation blocks, then adds qualifying sentence multiplier bonuses ×{rules.sentenceBonus}.</p><p>Each distinct word or sentence upgrade that actually triggers counts once toward that excerpt’s chain. Chain is off until purchased. With Chain, each extra trigger adds {Math.round(rules.chain*100)}%, with no cap. Forged Links doubles that per-trigger bonus. Repeated triggers of the same upgrade do not extend the chain. Formatting and citations alone do not count as upgrade triggers.</p><p className="rule-equation">Excerpt = floor(sentence base × sentence multiplier × chain)</p><p>With Symmetric, add {rules.symmetric} to each excerpt total before multiplying. Multiply all three excerpt totals. Each qualifying run upgrade then multiplies this product by (1 + its bonus ×{rules.runBonus}) ×{rules.runTrigger}; Symmetric supplies ×{rules.runTrigger} without another bonus multiplier. All qualifying run multipliers multiply together. Round down the final result. For standard rules, Rooted alone gives ×1.8, and Rooted with Tonal gives ×2.88. The dev run amplifier defaults to ×1; run upgrades receive no blanket amplification.</p></details>
                <details><summary>05 / The shop, rarity & consumables</summary><p>Start with 7 credits. Earn 1 credit per 5 total words in successfully locked excerpts of cleared rounds. The HUD shows each excerpt’s credits as you type it, the tally shows the payout, and the shop itemises what you earned. Partial credits carry forward across rounds and saves, so 6 words followed by 4 pays 2 credits in total. Words must contain a letter or digit; citations, punctuation-only tokens, discarded input and practice do not earn money. Round number and score no longer grant money. Patron adds 25% to word income, Long-form Royalties adds 0.1 credit per word of 8+ letters or digits, and every clear pays a flat +3 credits plus interest: 1 credit per 10 held before the payout, up to 5 (Savings Account removes the cap). Tip Jar pays per excerpt typed without a mistake, Long Form per excerpt of 25+ words, Bounty per doubling of the target, and Frugal per empty buff slot. All money buffs apply on future clears. Unspent credits carry over. Points and credits are separate. Buy any number of items you can afford, then select the next round. You can leave without buying. Each round starts on a new random article; the Anchor buff keeps you on the one you finished. The first two shops never offer epic or legendary cards.</p><p>You hold up to five buffs. Letter levels and this-round item effects don’t take a slot. When all five are full, sell one from your buffs list in the shop: it pays back half its price. Order matters only for Understudy, which copies the scoring buff directly above it; move buffs up and down in the shop.</p><p>Permanent upgrade base prices and offer weights: Common 6 credits / 45%, Uncommon 9 / 30%, Rare 13 / 16%, Epic 18 / 7%, Legendary 26 / 2%. Individual card prices override the base; the displayed price is what you pay. Specialist cards need a trigger in the current article. Chain needs two trigger upgrades; Forged Links needs Chain and six. Resonance needs two word upgrades, Singularity three. Patron only appears through shop four; Wider Lens and Second Opinion through shop five. Older fixed cards such as Sibilant, Prolix, Verbose and Pocket Dictionary are retired from new offers; owned copies still work. Each slot draws a rarity, then a buff family and a variant. Most scoring cards belong to a family and name a highlighted detail: a letter, a length, a format, a mark, a century, or a word, prefix or suffix from this article. The detail sets the trigger, and how scarce that trigger is sets the reward, rarity and price together, so a common detail pays a little and a scarce one pays far more. A card keeps its detail after purchase and through saves. Only one card of a family appears per stock, and a word or sentence card only appears if it can trigger somewhere in this article. Format Ink buffs reward combinations within one word; three or more formats pay more. Collection buffs count qualifying words across locked excerpts this round. Reference Index uses citation numbers, while Editorial Notes uses annotation letters. Owned upgrades and duplicate offers are excluded; at most one run upgrade appears per stock. Empty rarity weights are removed and the rest renormalized. Shops offer four upgrades, or five with Wider Lens. Restocking replaces unsold upgrades and supplies. Replaced upgrades cannot appear in the immediate restock. Restocks cost 3 credits, then 5, 7, and so on; Second Opinion grants one free restock each shop without raising the paid price.</p><p>Card replays rescore your last three excerpts with your current build plus the offered upgrade. These are comparisons, not guarantees for the next round. Time and economy upgrades do not increase replay points; Chain does. Permanent effects start in the next round, except shop effects, which work immediately when applicable. Time rewards stack and can exceed the starting clock.</p><p>Letter packs: a Small pack (3 credits) reveals 3 characters and a Large pack (4 credits) reveals 5; keep one as a permanent boost. Each pack can be opened once per shop. Characters are drawn from letters, digits, accented and historic Latin, maths, currency and other symbols, Greek, Coptic, IPA, Cyrillic, Armenian, Georgian, Hebrew, Arabic, Syriac, Ethiopic, Devanagari, Bengali, Tamil, Thai, Khmer, Tibetan, runes, Ogham, Chinese, Japanese and Korean, plus any special character in your current article. Boosts rise with scarcity: E pays +6, J +16, é +40, ° +100 and α +400. Pack tier odds are 50% common, 33% uncommon, 12% rare, 4% epic and 1% legendary, renormalized to available characters. A Large pack guarantees at least one uncommon or better and is sold out when all uncommon-or-better characters reach level three. Within each tier, familiar characters are a little more likely. Every copy adds its booster before the A–Z uppercase multiplier, then word multipliers apply. Each character can reach level three, and levels stack. Revealed cards show matching excerpts in this article and an example gain when available; this is an opportunity, not a guaranteed round payoff. Boosts never count as Chain triggers and survive saves. Finish or skip an open pack before leaving.</p><p>Clock: before each round you can buy +5 seconds for the next round only (1 credit) or +5 seconds on every future round (3 credits), as many times as you like. Pocket Watch is retired from offers; owned copies still work.</p><p>Carry up to three consumables in three bag slots, including duplicates. A new item goes in the lowest empty slot, and using an item empties its slot without moving the others. Use them during play with Ctrl+1–3 for slots 1–3 (Control on a Mac too; Alt/Option+1–3 also works), by clicking them next to the score, or from MENU, which pauses the clock. Each purchase is one use. Borrowed Time costs 4 and adds 20 seconds immediately. Fresh Ink costs 5: +8 word base and one word-upgrade chain trigger in every excerpt this round. Carbon Copy costs 5: ×2 final round score, without a chain trigger. Highlighter costs 5: ×2 word multiplier, after every addition, on bold, italic and linked words this round. Loupe costs 4: outlines the three highest-scoring excerpts you have not used on the current article, until you leave it. Scoring consumables also affect already locked excerpts and expire when you enter the shop. Two copies of the same scoring effect cannot be active together. Unused items stay in your bag across rounds. Restocks offer two different consumables, chosen uniformly. Saves retain credits, stock, purchases, bag and active round effects.</p><p>Word upgrades apply to every qualifying word. Sentence upgrades apply once per qualifying excerpt. Run upgrades apply to the three locked excerpts in lock order. Base bonuses and multiplier additions use the scaling factors in section 04, including scoring consumables. Missing article categories grant no affinity; nature and history can both qualify. Back navigation does not earn exploration rewards.</p><div className="rules-catalogue">{FAMILY_CATALOGUE.map(f => <section key={f.key}><span className={`rarity-badge rarity-${f.low}`}>{f.low===f.high?RARITIES[f.low].label:`${RARITIES[f.low].label}–${RARITIES[f.high].label}`}</span> <span className="print-label">{f.type} · FAMILY</span><h3>{f.title}</h3><p><RichText text={f.summary}/></p></section>)}{UPGRADE_POOL.filter(u=>!u.retired).map(u => <section key={u.id}><span className={`rarity-badge rarity-${u.rarity}`}>{RARITIES[u.rarity].label}</span> <span className="print-label">{u.type}</span><h3>{u.name}{u.temporary?' · this round':''}</h3><p>{upgradeDescription(u,rules)}</p></section>)}</div></details>
                <details><summary>06 / Special characters</summary><p>Hold Ctrl for a moment to open the character panel: every special character on the current page, each with a key. While still holding Ctrl, press that key to type the character with your active formatting; release Ctrl to close the panel. Keys are fixed for the whole article, with the most frequent characters on single keys. Pages with more characters than keys use two-key labels (for example Ctrl+0 then Ctrl+S). Experienced players can press Ctrl+key without waiting for the panel. The Ω button pins the panel open for mouse and touch; click a character to type it. Hint keys never reuse the format toggles (B I L ; O M) or the item slots (1–3). Characters that match plain keys are left out: straight quotes match curly quotes, a hyphen matches en and em dashes, and superscript digits accept ordinary digits (² → 2); exponents do not require Citation mode. Combining marks are shown on a dotted circle for legibility; only the mark is inserted.</p><p>Compose also works for common Latin accents and typography: toggle Compose, then type a two-character combination. A supported pair inserts one character with the active formatting and exits Compose. An unsupported pair inserts both characters literally. Escape or Enter cancels composition without clearing the existing input.</p><table><thead><tr><th>Pair</th><th>Character</th></tr></thead><tbody>{Object.entries(COMPOSE_SYMBOLS).map(([pair,char]) => <tr key={pair}><td><code>{pair}</code></td><td>{char}</td></tr>)}</tbody></table><p>Combine a letter with an accent marker in either order: apostrophe for acute, backtick for grave, double quote for diaeresis, ^ for circumflex, ~ for tilde, comma for cedilla, / for stroke, or o for ring. An accented character is inserted when the combination forms a single character; otherwise the pair is inserted literally. Example: apostrophe + e gives é.</p></details>
                <details><summary>07 / Dev mode & sandbox</summary><p>Dev mode pauses the clock. Tab completes an excerpt only when the current input matches exactly one available excerpt. The scoring sandbox previews actual article excerpts or your own text, with any combination of upgrades. Preview upgrades do not change your equipped upgrades. Time upgrades affect the sandbox’s trial budget, including when lock refunds arrive. Draft upgrades do not affect trial points or time. A trial starts a fresh hypothetical round; it does not inherit already-spent utility effects from your live round.</p><p>Select three different excerpts for a trial. Time is an estimate: character count ÷ (WPM × 5) × 60 seconds, plus 7% for corrections, 0.55 seconds per formatting change, one second per lock, and four seconds to find each excerpt after the first. Each article change adds seven seconds unless Scout’s Honor covers the first hop. Clock-paused network loading is excluded. Affinity rewards use saved article categories; missing categories grant no estimated reward. A lock must finish before the clock expires to receive Second Wind. The time-budget column includes all modeled rewards; a late refund cannot rescue an earlier timeout. Trials can include previously used excerpts. Each ladder row tests the same selection and build; it is not a simulation of earning upgrades over seven rounds.</p><p>Parameter edits affect the sandbox immediately. “Use these rules while playing in dev mode” also changes live previews and results, including already locked excerpts. Leaving dev mode restores standard scoring. Settings are stored in this browser; Reset defaults restores standard values and Export settings downloads them as JSON.</p></details>

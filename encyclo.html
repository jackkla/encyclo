            let available = [...UPGRADE_POOL,...familyVariants(sentences)].filter(u=>shopEligible(u,owned,round,sentences) && !ownedIds.has(u.id) && !excluded.includes(u.id) && !gated(u));
            const offers=[];
            while(offers.length<(ownedIds.has('curator')?5:4) && available.length){
                const tiers=Object.entries(RARITIES).filter(([tier])=>available.some(u=>u.rarity===tier));
                let roll=random()*tiers.reduce((sum,[,r])=>sum+r.weight,0);
                const tier=tiers.find(([,r])=>(roll-=r.weight)<0)?.[0] || tiers[tiers.length-1][0];
                const pool=available.filter(u=>u.rarity===tier);
                // Template families share a budget, so hundreds of lexical variants cannot crowd out other buffs.
                const families=[...new Set(pool.map(u=>u.template||u.id))];
                const family=families[Math.min(families.length-1,Math.floor(random()*families.length))];
                const variants=pool.filter(u=>(u.template||u.id)===family);
                let chosen=variants[Math.min(variants.length-1,Math.floor(random()*variants.length))];
                const twin=TIMES_FAMILIES.has(chosen.template)&&random()<TIMES_CHANCE&&timesVariant(chosen);
                if(twin&&!ownedIds.has(twin.id)&&!excluded.includes(twin.id)&&!gated(twin))chosen=twin;
                offers.push(chosen);
                available=available.filter(u=>u.id!==chosen.id && (!chosen.template||u.template!==chosen.template) && (chosen.type!=='RUN'||u.type!=='RUN'));
            }
            return offers;
        }

        /* ================================================================
           COMPOSE-KEY RESOLUTION (typographic shortcuts)
           ================================================================ */
        const COMPOSE_SYMBOLS = {
            "--": "—", "-.": "–", ".-": "–", "<<": "«", ">>": "»",
            "ss": "ß", "ea": "æ", "ae": "æ", "oe": "œ", "eo": "œ",
            "?!": "‽", "!?": "‽",
            "\"<": "“", "<\"": "“", "\">": "”", ">\"": "”",
            "'<": "‘", "<'": "‘", "'>": "’", ">'": "’"
        };

        const COMBINING_MARKS = {
            "'": "\u0301", "`": "\u0300", "\"": "\u0308", "^": "\u0302",
            "~": "\u0303", ",": "\u0327", "/": "\u0338", "o": "\u030A"
        };

        function resolveCompose(seq) {
            const lowerSeq = seq.toLowerCase();
            if (COMPOSE_SYMBOLS[lowerSeq]) {
                const char = COMPOSE_SYMBOLS[lowerSeq];
                return /[A-Z]/.test(seq) ? char.toUpperCase() : char;
            }

            const c1 = lowerSeq[0];
            const c2 = lowerSeq[1];

            let base = null, mark = null;
            if (COMBINING_MARKS[c1] && /[a-z]/i.test(c2))      { mark = COMBINING_MARKS[c1]; base = seq[1]; }
            else if (COMBINING_MARKS[c2] && /[a-z]/i.test(c1)) { mark = COMBINING_MARKS[c2]; base = seq[0]; }

            if (base && mark) {
                const combined = (base + mark).normalize('NFC');
                if (combined.length === 1) return combined;
            }
            return null;
        }

        function getComposeSequence(char) {
            const reverseMap = {
                "—": "--", "–": ".-", "«": "<<", "»": ">>",
                "ß": "ss", "æ": "ae", "œ": "oe", "‽": "?!",
                "“": "\"<", "”": "\">", "‘": "'<", "’": "'>"
            };
            const lowerChar = char.toLowerCase();
            if (reverseMap[lowerChar]) {
                const seq = reverseMap[lowerChar];
                if (char === char.toUpperCase() && char !== lowerChar) {
                    return `CMP + ${seq[0].toUpperCase()} + ${seq[1].toUpperCase()}`;
                }
                return `CMP + ${seq[0]} + ${seq[1]}`;
            }

            const decomposed = char.normalize('NFD');
            if (decomposed.length === 2) {
                const [base, mark] = decomposed;
                const markMap = {
                    "\u0301": "'", "\u0300": "`", "\u0308": "\"", "\u0302": "^",
                    "\u0303": "~", "\u0327": ",", "\u0338": "/", "\u030A": "o"
                };
                if (markMap[mark]) return `CMP + ${markMap[mark]} + ${base}`;
            }
            return null;
        }

        /* ================================================================
           CHARACTER NORMALIZATION & SCORING
           ================================================================ */
        function normalizeChar(c) {
            if (/[—–]/.test(c))   return '-';
            if (/[“”]/.test(c))   return '"';
            if (/[‘’]/.test(c))   return "'";
            if (/^[²³¹⁰⁴⁵⁶⁷⁸⁹]$/.test(c)) return '0123456789'['⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c)];
            if (/^[\u00a0\u202f\u2009]$/.test(c)) return ' ';
            return c;
        }

        function getCharScore(c, rules = DEFAULT_SCORING) {
            const norm = normalizeChar(c);
            if (/[A-Z]/.test(c))                            return (SCRABBLE_VALUES[c.toLowerCase()] || 0) * rules.capital;
            if (/[a-z]/.test(c))                            return SCRABBLE_VALUES[c] || 0;
            if (/[0-9]/.test(c))                            return parseInt(c, 10);
            if (/[.,!?;:'"()\[\]{}\-—–_]/.test(norm))       return rules.punctuation;
            return rules.special; // other special characters
        }

        function getBoostedCharScore(c, upgrades, rules = DEFAULT_SCORING) {
            // Preserve the existing A–Z case rule, including a zero dev multiplier.
            const capital = /^[A-Z]$/.test(c);
            return (getCharScore(capital ? c.toLowerCase() : c, rules) + letterBoost(c, upgrades)) * (capital ? rules.capital : 1);
        }

        function charMatch(c1, c2) {
            return normalizeChar(c1) === normalizeChar(c2);
        }

        /* ================================================================
           WIKIPEDIA API
           ================================================================ */
        const articleCache = new Map();
        async function fetchJSON(url) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 12000);
            try {
                const res = await fetch(url, { signal: controller.signal });
                if (!res.ok) throw new Error(`Wikipedia could not respond (${res.status}). Please try again.`);
                const data = await res.json();
                if (data.error) throw new Error(data.error.info);
                return data;
            } finally { clearTimeout(timeout); }
        }
        async function fetchSpecificWikipediaArticle(title) {
            if (articleCache.has(title)) return articleCache.get(title);
            const data = await fetchJSON(
                `https://en.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(title)}&redirects=1&prop=text|categories&format=json&origin=*`
            );
            const categories = (data.parse.categories || []).map(c => (c['*'] || '').replace(/_/g, ' '));
            const article = { title: data.parse.title, html: data.parse.text['*'], categories };
            articleCache.set(title, article);
            if (articleCache.size > 12) articleCache.delete(articleCache.keys().next().value);
            return article;
        }

        async function fetchRandomWikipediaArticle() {
            const randomData = await fetchJSON(
                "https://en.wikipedia.org/w/api.php?action=query&list=random&rnlimit=1&rnnamespace=0&format=json&origin=*"
            );
            return fetchSpecificWikipediaArticle(randomData.query.random[0].title);
        }

        /* ================================================================
           ARTICLE PARSING
           ================================================================ */

        /* Walk a DOM subtree and flatten into a per-character array, tagging
           format inheritance (bold/italic/link/citation). Shared by paragraph
           sentence extraction and fragment extraction. */
        const CITATION_SELECTOR = '.reference, .mw-ref, [role="doc-noteref"], [typeof~="mw:Extension/ref"], sup.Template-Fact, sup.Inline-Template';
        function isCitationNode(node) {
            if (node.matches(CITATION_SELECTOR)) return true;
            if (node.tagName.toLowerCase() !== 'sup') return false;
            return !!node.querySelector('a[href*="cite_note"], a[href*="Cite_note"], a[href*="Citation_needed"], a[href*="Wikipedia:Inline_citation"], a[href*="Wikipedia:Manual_of_Style/Words_to_watch"]') ||
                /^\[?\s*(?:citation needed|which\??|who\??|when\??|where\??|clarification needed|clarify|verification needed|failed verification|dubious|disputed|better source needed|not verified|by whom\??|according to whom\??)\s*\]?$/i.test(node.textContent.trim());
        }
        function flattenToChars(rootEl) {
            const charArray = [];
            function traverse(node, format) {
                if (node.nodeType === Node.TEXT_NODE) {
                    for (const c of node.textContent.normalize('NFC').replace(/[\u200b\u200e\u200f\u2060\ufeff\u00ad]/g,'')) {
                        charArray.push({ c, ...format });
                    }
                    return;
                }
                if (node.nodeType !== Node.ELEMENT_NODE) return;

                const tag = node.tagName.toLowerCase();
                // Line breaks and stacked blocks read as a space, so "Quebec City<br>Lévis" is not typed as one word.
                if (tag === 'br') { charArray.push({ c: ' ', ...format }); return; }
                const blockEdge = /^(div|p|li|dd|dt|tr|td|th|h[1-6]|ul|ol|dl|table|caption|figcaption)$/.test(tag);
                if (blockEdge) charArray.push({ c: ' ', ...format });
                const newFormat = { ...format };

                if (tag === 'b' || tag === 'strong') newFormat.b = true;
                if (tag === 'i' || tag === 'em')     newFormat.i = true;

                // Bullet/list marker: when entering an <li>, set the bullet
                // flag on all nested content. Player toggles Ctrl+O once.
                if (tag === 'li' && !node.classList.contains('gallerybox')) newFormat.bul = true;

                if (isCitationNode(node)) newFormat.cit = true;
                if (tag === 'sup' && !newFormat.cit) newFormat.exp = true;
                if (tag === 'a' && !newFormat.cit) {
                    newFormat.l = true;
                    const titleAttr = node.getAttribute('title');
                    if (titleAttr && !node.classList.contains('external') && !node.classList.contains('extiw')) {
                        newFormat.target = titleAttr;
                    }
                }
                // Citation annotations have their own toggle; internal links/italics are presentation only.
                if (newFormat.cit) { newFormat.exp = false; newFormat.b = false; newFormat.i = false; newFormat.l = false; newFormat.target = null; }

                for (const child of node.childNodes) traverse(child, newFormat);
                if (blockEdge) charArray.push({ c: ' ', ...format });
            }
            traverse(rootEl, { b: false, i: false, l: false, cit: false, bul: !!rootEl.closest('li:not(.gallerybox)'), target: null });

            // Collapse runs of whitespace
            const cleaned = [];
            let lastWasSpace = false;
            for (const charObj of charArray) {
                const isSpace = /\s/.test(charObj.c);
                if (isSpace) {
                    if (!lastWasSpace) {
                        cleaned.push({ ...charObj, c: ' ' });
                        lastWasSpace = true;
                    }
                } else {
                    cleaned.push(charObj);
                    lastWasSpace = false;
                }
            }
            // trim leading/trailing whitespace
            while (cleaned.length && cleaned[0].c === ' ') cleaned.shift();
            while (cleaned.length && cleaned[cleaned.length-1].c === ' ') cleaned.pop();
            return cleaned;
        }

        /* Walk the article DOM and find typeable fragment-bearing elements
           inside non-paragraph blocks (headings, hatnotes, captions, infobox
           cells, table cells, figcaptions). Marks each with data-frag-id and
           returns a flat list of fragment sentences. Mutates the passed
           element tree by adding the data-frag-id attributes. */
        function extractFragments(rootEl, pageId, startCounter) {
            let counter = startCounter;
            const fragments = [];

            // Selectors for typeable fragments. Order matters for nesting:
            // when a list lives inside an infobox cell, prefer per-li fragments
            // over one giant cell-as-fragment.
            const FRAGMENT_SELECTORS = [
                // Headings: handle both old (<h2><span class="mw-headline">...</span></h2>)
                // and new (<div class="mw-heading"><h2>...</h2></div>) MediaWiki structure.
                // The .mw-heading wrapper itself works for new style; we also list
                // h2-h5 directly so they match in both wrapped and unwrapped contexts.
                'h1.firstHeading',
                'h2', 'h3', 'h4', 'h5',
                '.mw-headline',
                // Hatnotes and disambiguation
                '.hatnote', '.dablink',
                // Image, gallery and multi-image captions
                '.thumbcaption', 'figcaption', '.gallerytext', '.gallerycaption', '.trow .thumbcaption',
                // Infobox titles, captions and rows. List items and captions inside cells win over
                // cells via the leaf-most filter below.
                '.infobox-title', '.infobox-above', '.infobox-header', '.infobox-subheader', '.infobox-caption', '.infobox-below',
                '.infobox li', '.wikitable li', 'table li',
                '.infobox th', '.infobox td',
                '.wikitable th', '.wikitable td',
                'table th', 'table td',
                'caption',
                // Bulleted/numbered list items in body content
                'ul > li', 'ol > li',
                // Description list term/definition pairs (used in some articles)
                'dt', 'dd'
            ];

            // For fragment elements, we want the element itself (not nested duplicates).
            // Collect candidates, dedupe by ancestor relationship.
            const candidates = new Set();
            FRAGMENT_SELECTORS.forEach(sel => {
                // Check if rootEl itself matches the selector (querySelectorAll only finds descendants)
                if (rootEl.matches && rootEl.matches(sel)) candidates.add(rootEl);
                rootEl.querySelectorAll(sel).forEach(el => candidates.add(el));
            });

            // Also: for short top-level elements that are headings/hatnotes themselves,
            // include rootEl directly even if it doesn't match a class selector
            // (e.g. <h2> with mw-headline child where the rootEl is <h2>).

            // Filter: keep only "leaf" candidates — those that don't contain
            // another candidate. This way list items inside a cell win over
            // the cell itself.
            const finalCandidates = [];
            candidates.forEach(el => {
                let containsCandidate = false;
                for (const other of candidates) {
                    if (other !== el && el.contains(other)) {
                        containsCandidate = true; break;
                    }
                }
                if (!containsCandidate) finalCandidates.push(el);
            });

            finalCandidates.forEach(el => {
                // Skip if already inside a paragraph (handled by paragraph parser)
                // or inside a citation/reference block.
                if (el.closest('p, blockquote') || el.closest(CITATION_SELECTOR)) return;
                counter = markFragmentHost(el, pageId, counter, fragments);
            });

            return { fragments, nextCounter: counter };
        }
        // Make one element typeable. Anything with a letter or digit qualifies, in any script; text longer
        // than one excerpt is split at sentence ends, then at spaces, into several targets that share the host.
        function markFragmentHost(el, pageId, counter, fragments) {
            const chars = flattenToChars(el);
            if (chars.length < MIN_FRAGMENT_LEN || !chars.some(c => !c.cit && /[\p{L}\p{N}]/u.test(c.c))) return counter;
            const ids = [];
            for (const piece of splitLongText(chars)) {
                if (!piece.some(c => !c.cit && /[\p{L}\p{N}]/u.test(c.c))) continue;
                const id = `${pageId}-frag-${counter++}`;
                ids.push(id);
                fragments.push({ id, chars: piece, isFragment: true });
            }
            if (ids.length) el.setAttribute('data-frag-id', ids.join(' '));
            return counter;
        }
        function splitLongText(chars) {
            if (chars.length <= MAX_FRAGMENT_LEN) return [chars];
            const out = [];
            for (const sentence of splitSentences(chars)) {
                let rest = sentence;
                while (rest.length > MAX_FRAGMENT_LEN) {
                    let cut = MAX_FRAGMENT_LEN;
                    while (cut > MAX_FRAGMENT_LEN / 2 && !(rest[cut].c === ' ' && !rest[cut].cit)) cut--;
                    if (cut <= MAX_FRAGMENT_LEN / 2) cut = MAX_FRAGMENT_LEN;
                    out.push(rest.slice(0, cut));
                    rest = rest.slice(cut);
                    while (rest.length && rest[0].c === ' ') rest = rest.slice(1);
                }
                if (rest.length) out.push(rest);
            }
            return out;
        }

        // Wikipedia series sidebars are navigation, not article reading/typing material.
        const ARTICLE_NAVIGATION_SELECTOR = '.navbox, .sidebar, .sidebar-collapse, .vertical-navbox';
        function removeArticleNavigation(root) {
            const panels=[...root.querySelectorAll(ARTICLE_NAVIGATION_SELECTOR)];
            panels.forEach(panel=>panel.remove());
            return panels.length;
        }
        function cleanSavedArticleNavigation(blocks) {
            return blocks.flatMap(block=>{
                if(block.type!=='HTML')return [block];
                const doc=new DOMParser().parseFromString(block.html,'text/html');
                if(!removeArticleNavigation(doc))return [block];
                if(!doc.body.textContent.trim()&&!doc.body.querySelector('img,svg,video,audio,math'))return [];
                const remainingIds=new Set([...doc.querySelectorAll('[data-frag-id]')].flatMap(el=>el.getAttribute('data-frag-id').split(' ')));
                return [{...block,html:doc.body.innerHTML,fragments:(block.fragments||[]).filter(f=>remainingIds.has(String(f.id)))}];
            });
        }

        function parseArticleHTML(htmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');

            removeArticleNavigation(doc);

            // Strip elements that break parsing or are pure UI noise
            // (kept .hatnote in — it's typeable as a fragment now)
            doc.querySelectorAll(
                '.mw-empty-elt, .mw-editsection, .navbox, .sistersitebox, script, style, .reference-text, annotation, [style*="display:none"], [style*="display: none"]'
            ).forEach(el => el.remove());

            // Normalize image sources to absolute https URLs
            doc.querySelectorAll('img').forEach(img => {
                let src = img.getAttribute('src') || img.dataset.src;
                if (src) {
                    if      (src.startsWith('//')) img.setAttribute('src', 'https:' + src);
                    else if (src.startsWith('/'))  img.setAttribute('src', 'https://en.wikipedia.org' + src);
                    else                           img.setAttribute('src', src);
                }
                img.removeAttribute('srcset');
                img.removeAttribute('loading');
            });

            const blocks = [];
            const pageId = Math.random().toString(36).substring(2, 9);
            let sentenceIdCounter = 0;

            const root = doc.querySelector('.mw-parser-output') || doc.body;

            Array.from(root.childNodes).forEach(node => {
                if (node.nodeType !== Node.ELEMENT_NODE) return;
                const tag = node.tagName.toLowerCase();

                if (tag === 'p' || tag === 'blockquote') {
                    const sentences = extractSentencesFromParagraph(node, pageId, sentenceIdCounter);
                    sentenceIdCounter += sentences.length;

                    const valid = sentences.filter(s => s.chars.length >= MIN_SENTENCE_LEN && s.chars.length <= MAX_SENTENCE_LEN);
                    if (valid.length > 0) {
                        blocks.push({ type: 'PARAGRAPH', tag, id: Math.random(), sentences: valid });
                    } else {
                        // Too short or too long for an excerpt: still typeable, as one or more fragments.
                        const fragments = [];
                        sentenceIdCounter = markFragmentHost(node, pageId, sentenceIdCounter, fragments);
                        blocks.push({ type: 'HTML', id: Math.random(), html: node.outerHTML, fragments });
                    }
                } else {
                    // Preserve images, infoboxes, tables, headings as raw HTML.
                    // Annotate fragment-typeable elements with data-frag-id and
                    // collect their sentence objects for the global match pool.
                    const { fragments, nextCounter } = extractFragments(node, pageId, sentenceIdCounter);
                    sentenceIdCounter = nextCounter;
                    blocks.push({ type: 'HTML', id: Math.random(), html: node.outerHTML, fragments });
                }
            });

            // Extract article metadata for vibe-shaping features:
            // - leadImageUrl: first decent-sized image (skip tiny icons)
            // - allImages: every reasonable image, used for collage wallpaper
            // - era: median 4-digit year mentioned in article text
            let leadImageUrl = null;
            const allImages = [];
            for (const img of doc.querySelectorAll('img')) {
                const w = parseInt(img.getAttribute('width') || '0', 10);
                const h = parseInt(img.getAttribute('height') || '0', 10);
                const src = img.getAttribute('src');
                if (!src) continue;
                if (w >= 80 && h >= 80) {
                    if (!leadImageUrl) leadImageUrl = src;
                    allImages.push(src);
                }
            }
            const fullText = (doc.querySelector('.mw-parser-output') || doc.body).textContent || '';
            const yearMatches = fullText.match(/\b(1[5-9][0-9]{2}|20[0-2][0-9])\b/g) || [];
            let era = null;
            if (yearMatches.length >= 3) {
                const years = yearMatches.map(Number).sort((a, b) => a - b);
                era = years[Math.floor(years.length / 2)];
            }

            // The lede: sentences of the first body paragraph.
            const lede = blocks.find(b => b.type === 'PARAGRAPH' && b.sentences?.length);
            if (lede) lede.sentences.forEach(x => { x.lede = true; });
            return { blocks, meta: { leadImageUrl, allImages, era } };
        }

        // Pick a mood from the article's title, categories and lead; the audio engine turns it into a musical style.

                hearth:{voices:2,cutoff:1000,air:1800,noise:.025,gap:1.6,rest:.3,decay:1.1,wet:.2,progression:[0,5,0,0]},
                reel:{waves:['triangle','sine'],voices:4,cutoff:1400,detune:5,gap:2.7,attack:.25,decay:3,wet:.6,progression:[0,-2,5,7],phrase:18},
                forum:{voices:3,cutoff:850,gap:1.8,rest:.2,registers:[0],decay:1,wet:.3,progression:[0,5,0,7]},
                ledger:{voices:2,detune:0,noise:0,gap:.65,rest:.2,pluck:'triangle',decay:.3,wet:.2,phrase:8},
                transit:{waves:['triangle'],voices:2,cutoff:1000,air:450,noise:.035,gap:.55,rest:.08,registers:[0,12],decay:.3,wet:.25,progression:[0,0,5,7],phrase:10,glide:1},
                lexical:{voices:2,noise:0,gap:.95,rest:.3,registers:[0,12,24],decay:.65,wet:.4,phrase:12},
                clinical:{waves:['sine'],voices:2,detune:0,cutoff:1600,noise:.005,gap:2,rest:.2,decay:1,wet:.3,progression:[0,5,0,2]},
                couture:{voices:2,cutoff:2300,noise:.005,gap:.75,rest:.25,registers:[12],decay:.4,wet:.3,phrase:8},
                antique:{waves:['triangle','sine'],voices:2,octave:-1,cutoff:650,air:700,noise:.03,gap:3.2,rest:.4,attack:.15,decay:3.5,wet:.7,progression:[0,5,0,3],phrase:25,glide:8}
            };
            // Warm-up pass: every article keeps its own tempo, register, chord family and density,
            // but timbres are always soft (no saw/square, no sub-bass, no heavy detune or hiss)
            // and the reverb/rests are capped so nothing sounds hollow or eerie.
            const soften=p=>({...p,
                waves:p.waves.map(w=>w==='sawtooth'||w==='square'?'triangle':w),
                pluck:p.pluck==='square'||p.pluck==='sawtooth'?'triangle':p.pluck,
                octave:0,
                detune:Math.min(p.detune,4),
                noise:Math.min(p.noise,.008),
                air:Math.max(p.air,700),
                cutoff:Math.max(1300,Math.min(p.cutoff,2400)),
                wet:Math.min(p.wet,.5),
                rest:Math.min(p.rest,.3),
                gap:Math.min(Math.max(p.gap,.6),2.6),
                attack:Math.min(Math.max(p.attack,.02),.35),
                decay:Math.min(p.decay,2.6),
                width:Math.min(p.width,.8),
                pad:p.pad*1.15,
                note:Math.min(p.note,.08),
                phrase:Math.max(p.phrase,12),
                glide:Math.max(p.glide,3),
                progression:p.progression.every(x=>[0,-5,-3,-7,5,7,9,-2,4,2,-4].includes(x))?p.progression:[0,5,7,0]
            });
            return Object.freeze(Object.fromEntries(Object.entries(settings).map(([id,p])=>[id,Object.freeze(soften({...base,...p}))])));
        })();

        // Pick an ambient mood based on article categories. Each mood is a
        // (rootHz, intervals) pair — intervals is a chord shape in semitones.
        // Falls back to a neutral suspended drone if nothing matches.
        function classifyMood(categories, title, excerpt = '') {

            const moods = [
                { keys: ['horror', 'death', 'tragedy', 'disaster', 'massacre', 'extinction', 'crime', 'murder', 'serial killer'],
                  label: 'shadow',    root: 110.00, intervals: [0, 3, 7, 14] },        // half-dim
                { keys: ['battle', 'war', 'military', 'conflict', 'siege', 'army', 'navy', 'regiment'],

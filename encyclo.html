<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENCYCLO — Augmented Edition</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=JetBrains+Mono:wght@500;800&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           BASE TYPOGRAPHY + PAPER FEEL
           ============================================================ */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1efe8;
            color: #18181b;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            /* Subtle paper grain — layered noise + ruled-paper hint */
            background-image:
              radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
              radial-gradient(rgba(0,0,0,0.018) 1px, transparent 1px);
            background-size: 3px 3px, 7px 7px;
            background-position: 0 0, 1px 2px;
        }

        .font-article { font-family: 'PT Serif', serif; }
        .font-mono    { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
        .font-marker  { font-family: 'Inter', sans-serif; font-weight: 900; letter-spacing: -0.02em; }

        /* Marker font — used sparingly for "handwritten" labels only.
           Numeric/UI text stays mono or sans for legibility. */

        /* ============================================================
           INLINE FORMAT MARKERS (text-level accents — sharpie ink)
           ============================================================ */
        .fmt-bold   { font-weight: 800; color: #c2410c; text-shadow: 0 0 0.5px currentColor; }
        .fmt-italic { font-style: italic; color: #7e22ce; }
        .fmt-link   {
            text-decoration: none;
            color: #1d4ed8;
            box-shadow: inset 0 -3px 0 -1px rgba(29, 78, 216, 0.35);
        }
        .fmt-cit    { vertical-align: super; font-size: 0.72em; font-weight: 800; color: #db2777; }
        .fmt-bullet { color: #0d9488; font-weight: 800; }

        /* Already-typed chars within a YELLOW sentence — denser, "locked in" */
        .state-yellow .char-typed {
            background: rgba(234, 88, 12, 0.4);
            color: #431407;
            font-weight: inherit;
            text-shadow: none;
            border-radius: 1px;
        }

        /* Show typed spaces inside the input buffer as a faint dot */
        .input-buffer .typeable-char[data-char=" "] {
            position: relative;
            display: inline-block;
            min-width: 0.45em;
        }
        .input-buffer .typeable-char[data-char=" "]::before {
            content: "·";
            position: absolute;
            inset: 0;
            color: #d6d3d1;
            text-align: center;
            pointer-events: none;
        }
        .state-used {
            color: #a8a29e;
            text-decoration: line-through;
            text-decoration-color: #a8a29e;
            text-decoration-thickness: 1px;
            opacity: 0.55;
        }
        .state-used a, .state-used .fmt-bold, .state-used .fmt-italic, .state-used .fmt-link, .state-used .fmt-cit, .state-used .fmt-bullet {
            color: #a8a29e !important;
        }

        @keyframes flash-once {
            0%   { opacity: 0; }
            20%  { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes flash-pulse {
            0%, 100% { opacity: 0.45; }
            50%      { opacity: 1; }
        }

        /* ============================================================
           MATCH-STATE HIGHLIGHTS — wobbly highlighter strokes
           ============================================================ */
        .state-yellow {
            background:
              linear-gradient(105deg,
                rgba(250, 204, 21, 0.45) 0%,
                rgba(249, 115, 22, 0.35) 50%,
                rgba(250, 204, 21, 0.45) 100%);
            border: 2.5px solid #ea580c;
            border-radius: 4px 18px 6px 14px / 12px 4px 18px 6px;
            box-shadow:
              1px 2px 0 rgba(234, 88, 12, 0.25),
              inset 0 0 12px rgba(250, 204, 21, 0.15);
            color: #1c1917;
            padding: 1px 5px;
            margin: 0 -3px;
        }
        .state-locked {
            background:
              linear-gradient(95deg,
                rgba(37, 99, 235, 0.18) 0%,
                rgba(59, 130, 246, 0.28) 50%,
                rgba(37, 99, 235, 0.18) 100%);
            border: 2.5px solid #1d4ed8;
            border-radius: 14px 6px 18px 4px / 6px 18px 4px 14px;
            box-shadow:
              -1px 2px 0 rgba(29, 78, 216, 0.3),
              inset 0 0 12px rgba(37, 99, 235, 0.08);
            color: #0c0a09;
            text-decoration: none;
            padding: 1px 5px;
            margin: 0 -3px;
        }
        /* state-complete: buffer fully matches sentence — ready to lock.
           A bolder green-leaning highlight + animated dashed outline ring. */
        .state-complete {
            background:
              linear-gradient(105deg,
                rgba(132, 204, 22, 0.45) 0%,
                rgba(34, 197, 94, 0.45) 50%,
                rgba(132, 204, 22, 0.45) 100%);
            border: 2.5px solid #15803d;
            border-radius: 6px 18px 4px 16px / 16px 4px 18px 6px;
            box-shadow:
              0 0 0 2px rgba(34, 197, 94, 0.22),
              1px 2px 0 rgba(21, 128, 61, 0.3),
              inset 0 0 14px rgba(34, 197, 94, 0.18);
            color: #052e16;
            padding: 1px 5px;
            margin: 0 -3px;
            animation: ready-pulse 1.2s ease-in-out infinite;
            position: relative;
        }
        @keyframes ready-pulse {
            0%, 100% { box-shadow:
              0 0 0 2px rgba(34, 197, 94, 0.22),
              1px 2px 0 rgba(21, 128, 61, 0.3),
              inset 0 0 14px rgba(34, 197, 94, 0.18); }
            50%      { box-shadow:
              0 0 0 5px rgba(34, 197, 94, 0.35),
              1px 2px 0 rgba(21, 128, 61, 0.5),
              inset 0 0 18px rgba(34, 197, 94, 0.30); }
        }
        /* Score preview pill — floats above a complete-state sentence */
        .score-preview {
            position: absolute;
            top: -2.4em;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            background: #052e16;
            color: #bef264;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 0.78rem;
            padding: 4px 10px;
            border: 2px solid #15803d;
            border-radius: 4px 12px 4px 10px / 10px 4px 12px 4px;
            box-shadow: 3px 3px 0 -1px #15803d;
            white-space: nowrap;
            letter-spacing: 0.08em;
            z-index: 50;
            pointer-events: none;
            animation: score-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .score-preview::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid #15803d;
        }
        @keyframes score-pop {
            0%   { opacity: 0; transform: translateX(-50%) rotate(-2deg) translateY(6px) scale(0.8); }
            100% { opacity: 1; transform: translateX(-50%) rotate(-2deg) translateY(0) scale(1); }
        }

        /* Fragment hosts: typeable bits inside infoboxes/tables/headings/etc.
           A faint underline tells the player "this is a target too." */
        .frag-host {
            position: relative;
        }
        .frag-host::after {
            content: "";
            position: absolute;
            left: 2px; right: 2px; bottom: -2px;
            height: 1px;
            background-image: linear-gradient(90deg, rgba(120,113,108,0.45) 50%, transparent 50%);
            background-size: 4px 1px;
            background-repeat: repeat-x;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .frag-host:hover::after { opacity: 0.9; }
        /* Don't add an extra underline when the fragment is locked or matching */
        .frag-host:has(.state-locked)::after,
        .frag-host:has(.state-yellow)::after { display: none; }

        /* ============================================================
           MARKER-STYLE UI ACCENTS (irregular hand-drawn borders)
           ============================================================ */
        .marker-box {
            border: 2.5px solid #18181b;
            border-radius: 6px 22px 8px 18px / 18px 8px 22px 6px;
            box-shadow: 5px 5px 0 -1px #18181b;
            background-clip: padding-box;
        }
        .marker-box-blue {
            border: 2.5px solid #1d4ed8;
            border-radius: 22px 8px 18px 6px / 8px 22px 6px 18px;
            box-shadow: 5px 5px 0 -1px #1d4ed8;
            background-clip: padding-box;
        }
        .marker-box-orange {
            border: 2.5px solid #ea580c;
            border-radius: 6px 22px 8px 18px / 22px 6px 18px 8px;
            box-shadow: 5px 5px 0 -1px #ea580c;
            background-clip: padding-box;
        }
        .marker-box-red {
            border: 2.5px solid #b91c1c;
            border-radius: 18px 6px 22px 8px / 6px 18px 8px 22px;
            box-shadow: 5px 5px 0 -1px #b91c1c;
            background-clip: padding-box;
        }
        .marker-box-tight {
            /* same shape, smaller shadow — for inline badges */
            border: 2px solid #18181b;
            border-radius: 4px 14px 5px 12px / 12px 4px 14px 5px;
            box-shadow: 2px 2px 0 -1px #18181b;
        }
        .marker-circle {
            border: 2.5px solid #1d4ed8;
            border-radius: 52% 42% 60% 45% / 55% 48% 52% 60%;
        }

        /* Wobble-rotation helpers for that "scribbled by hand" feel */
        .wobble-l { transform: rotate(-1.2deg); }
        .wobble-r { transform: rotate(1deg); }
        .wobble-l-strong { transform: rotate(-2.4deg); }
        .wobble-r-strong { transform: rotate(2deg); }

        /* Hand-drawn underline using SVG — used on key headings */
        .scribble-underline {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 8' preserveAspectRatio='none'><path d='M2 4 Q 30 1, 60 4 T 120 4 T 198 5' stroke='%23ea580c' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>");
            background-repeat: no-repeat;
            background-position: 0 100%;
            background-size: 100% 6px;
            padding-bottom: 6px;
        }
        .scribble-underline-blue {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 8' preserveAspectRatio='none'><path d='M2 5 Q 30 2, 60 5 T 120 4 T 198 4' stroke='%231d4ed8' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>");
            background-repeat: no-repeat;
            background-position: 0 100%;
            background-size: 100% 6px;
            padding-bottom: 6px;
        }

        /* Press-down interaction for marker boxes */
        .press-marker {
            transition: transform 0.12s ease-out, box-shadow 0.12s ease-out;
        }
        .press-marker:hover {
            transform: translate(-1px, -1px);
            box-shadow: 7px 7px 0 -1px #18181b;
        }
        .press-marker:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0 -1px #18181b;
        }

        /* ============================================================
           ANIMATIONS (red error pulse + shake + subtle shimmer)
           ============================================================ */
        @keyframes sharpie-pulse-error {
            0%, 100% { border-color: #dc2626; background-color: #fef2f2; box-shadow: inset 0 0 0 2px #dc2626, 4px 4px 0 -1px #dc2626; }
            50%      { border-color: #991b1b; background-color: #fee2e2; box-shadow: inset 0 0 0 2px #991b1b, 4px 4px 0 -1px #991b1b; }
        }
        @keyframes sharp-shake {
            0%, 100% { transform: translateX(0)   rotate(0deg); }
            25%      { transform: translateX(-4px) rotate(-0.8deg); }
            50%      { transform: translateX(4px)  rotate(0.8deg); }
            75%      { transform: translateX(-4px) rotate(-0.8deg); }
        }
        @keyframes ink-bleed {
            0%   { filter: drop-shadow(0 0 0 rgba(234, 88, 12, 0)); }
            50%  { filter: drop-shadow(0 0 4px rgba(234, 88, 12, 0.4)); }
            100% { filter: drop-shadow(0 0 0 rgba(234, 88, 12, 0)); }
        }
        @keyframes float-tape {
            0%, 100% { transform: rotate(-2deg) translateY(0); }
            50%      { transform: rotate(-2deg) translateY(-1px); }
        }
        .input-error {
            animation: sharpie-pulse-error 1.2s infinite, sharp-shake 0.32s ease-in-out;
        }
        .ink-bleed { animation: ink-bleed 2.4s ease-in-out infinite; }

        /* Tape strips that sit on top of cards */
        .tape {
            position: absolute;
            background:
              linear-gradient(180deg,
                rgba(254, 240, 138, 0.55) 0%,
                rgba(253, 224, 71, 0.7) 50%,
                rgba(254, 240, 138, 0.55) 100%);
            box-shadow:
              0 1px 2px rgba(0,0,0,0.1),
              inset 0 0 0 1px rgba(255,255,255,0.3);
            border-left: 1px dashed rgba(180, 130, 0, 0.2);
            border-right: 1px dashed rgba(180, 130, 0, 0.2);
        }

        /* ============================================================
           WIKIPEDIA ARTICLE CANVAS
           ============================================================ */
        .wiki-content {
            font-size: 1.05rem;
            line-height: 1.75;
            color: #1c1917;
        }
        .wiki-content p { margin-bottom: 1.2em; }

        .wiki-content a            { color: #1d4ed8; text-decoration: none; cursor: pointer; pointer-events: auto; }
        .wiki-content a:hover      { text-decoration: underline; background-color: rgba(37, 99, 235, 0.1); border-radius: 2px; }
        .wiki-content a.mw-redirect{ color: #1d4ed8; }
        .wiki-content a.new        { color: #b91c1c; }

        .wiki-content h1, .wiki-content h2, .wiki-content h4 {
            font-family: 'Inter', sans-serif;
            color: #0c0a09;
            margin-bottom: 0.4em;
            padding-bottom: 0.3em;
            margin-top: 1.2em;
            font-weight: 800;
            letter-spacing: -0.01em;
            border-bottom: 1.5px solid #a8a29e;
            overflow: hidden;
        }
        .wiki-content h3 {
            font-family: 'Inter', sans-serif;
            color: #0c0a09;
            font-size: 1.22em;
            margin-top: 1.2em;
            margin-bottom: 0.4em;
            font-weight: 800;
            letter-spacing: -0.01em;
        }
        .wiki-content h2 { font-size: 1.55em; }
        /* Modern MediaWiki wraps headings in <div class="mw-heading"> — push
           the underline to the wrapper so it clears floated infoboxes/thumbs */
        .wiki-content .mw-heading {
            border-bottom: 1.5px solid #a8a29e;
            margin: 1.2em 0 0.4em;
            padding-bottom: 0.3em;
            overflow: hidden;
        }
        .wiki-content .mw-heading h1,
        .wiki-content .mw-heading h2,
        .wiki-content .mw-heading h3,
        .wiki-content .mw-heading h4 {
            border-bottom: none;
            margin: 0;
            padding: 0;
            overflow: visible;
        }

        .wiki-content blockquote {
            margin: 1.5em 2em;
            padding: 1em 1.5em;
            border-left: 4px solid #ea580c;
            font-style: italic;
            background: linear-gradient(to right, rgba(249, 115, 22, 0.07), transparent);
            border-radius: 4px 14px 14px 4px / 4px 24px 24px 4px;
        }

        .wiki-content .infobox {
            float: right;
            clear: right;
            border: 2.5px solid #18181b;
            margin: 0.6em 0 1.4em 1.6em;
            padding: 0.8em 0.7em 0.6em;
            background-color: #fefdf9;
            font-size: 88%;
            width: 22em;
            line-height: 1.5em;
            border-radius: 6px 22px 8px 18px / 18px 8px 22px 6px;
            box-shadow: 5px 5px 0 -1px #18181b;
            transform: rotate(-0.4deg);
            position: relative;
        }
        .wiki-content .infobox-title,
        .wiki-content .infobox caption,
        .wiki-content .infobox > tbody > tr:first-child th {
            font-family: 'Inter', sans-serif;
            font-size: 1.6em;
            font-weight: 700;
            text-align: center;
            padding: 0.1em 0 0.3em;
            color: #18181b;
            letter-spacing: -0.01em;
        }
        .wiki-content .infobox th               { text-align: left; vertical-align: top; font-weight: normal; padding: 0.25em 0.4em; }
        .wiki-content .infobox td               { padding: 0.25em 0.4em; }
        .wiki-content .infobox .infobox-header  {
            background-color: #fff7ed;
            color: #7c2d12;
            text-align: center;
            font-weight: 700;
            font-size: 0.95em;
            letter-spacing: 0.04em;
            border-top: 1.5px dashed #ea580c;
            border-bottom: 1.5px dashed #ea580c;
            padding: 0.35em 0.4em;
        }
        .wiki-content .infobox .infobox-image   { text-align: center; padding: 0.4em 0; }
        .wiki-content .infobox .infobox-image img {
            border: 1.5px solid #18181b;
            box-shadow: 2px 2px 0 -1px #ea580c;
            border-radius: 3px 8px 3px 7px;
            max-width: 100%;
            height: auto;
        }
        .wiki-content table.wikitable th        { font-weight: normal; }

        .wiki-content table.wikitable {
            background-color: #fefdf9;
            margin: 1em 0;
            border: 2.5px solid #18181b;
            border-collapse: collapse;
            font-size: 90%;
            box-shadow: 4px 4px 0 -1px #1d4ed8;
            border-radius: 4px 14px 4px 12px;
            overflow: hidden;
        }
        .wiki-content table.wikitable th,
        .wiki-content table.wikitable td { border: 1px solid #d6d3d1; padding: 0.4em 0.6em; }
        .wiki-content table.wikitable th { background-color: #eff6ff; text-align: center; color: #1e3a8a; font-weight: 700; }
        .wiki-content table.wikitable tr:nth-child(even) td { background: rgba(241, 245, 249, 0.5); }

        /* THUMBNAILS — polaroid stack vibe, supports both old (.thumb) and new (<figure>) markup */
        .wiki-content .thumb,
        .wiki-content figure[typeof~="mw:File/Thumb"],
        .wiki-content figure[typeof~="mw:File/Frame"],
        .wiki-content figure.mw-default-size {
            float: right;
            margin: 0.4em 0 1em 1.2em;
            max-width: 280px;
            background: #fefdf9;
            border: 2px solid #18181b;
            padding: 6px 6px 4px;
            border-radius: 4px 14px 6px 12px / 12px 6px 14px 4px;
            box-shadow: 4px 4px 0 -1px #1d4ed8;
            transform: rotate(0.4deg);
            transition: transform 0.25s ease;
            display: block;
        }
        .wiki-content figure.mw-halign-left,
        .wiki-content .tleft       { float: left;  clear: left; margin: 0.4em 1.2em 1em 0; }
        .wiki-content .thumb:nth-of-type(even),
        .wiki-content figure:nth-of-type(even)  { box-shadow: 4px 4px 0 -1px #ea580c; transform: rotate(-0.6deg); }
        .wiki-content .thumb:hover,
        .wiki-content figure:hover { transform: rotate(0deg) translateY(-1px); }
        .wiki-content figure[typeof~="mw:File/Thumb"] > a,
        .wiki-content figure[typeof~="mw:File/Frame"] > a { display: block; }
        .wiki-content figure img,
        .wiki-content .thumbimage   {
            border: 1px solid #44403c;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 1px;
        }
        .wiki-content .thumbinner {
            border: none;
            padding: 0;
            background: transparent;
            font-size: 94%;
            text-align: center;
        }
        .wiki-content .thumbcaption,
        .wiki-content figcaption {
            padding: 5px 4px 2px;
            font-size: 0.82em;
            line-height: 1.35em;
            text-align: left;
            color: #44403c;
            font-weight: 500;
            border-top: 1px dashed #d6d3d1;
            margin-top: 4px;
            font-style: italic;
        }

        /* EDITORIAL META — hatnotes, disambig links, message boxes.
           These are NOT article content; muted + iconified so the player
           doesn't waste effort trying to type them as targets. */
        .wiki-content > *:first-child,
        .wiki-content > div:first-of-type > *:first-child { margin-top: 0 !important; }
        .wiki-content .hatnote,
        .wiki-content .dablink {
            font-size: 0.86em;
            font-style: italic;
            color: #78716c;
            margin: 0.4em 0 0.9em 1.6em;
            padding: 0.3em 0.6em 0.3em 1.8em;
            border-left: 3px dashed #a8a29e;
            background: rgba(245, 245, 244, 0.55);
            position: relative;
            border-radius: 2px 8px 2px 6px;
        }
        .wiki-content .hatnote::before,
        .wiki-content .dablink::before {
            content: "✎";
            position: absolute;
            left: 0.55em;
            top: 0.25em;
            font-style: normal;
            color: #a8a29e;
            font-size: 1em;
        }
        .wiki-content .hatnote a,
        .wiki-content .dablink a { color: #57534e; text-decoration: underline dotted; }

        .wiki-content .ambox,
        .wiki-content .messagebox,
        .wiki-content table.metadata {
            font-size: 0.82em;
            color: #78716c;
            background: repeating-linear-gradient(45deg, rgba(245,245,244,0.6) 0 8px, rgba(231,229,228,0.6) 8px 16px);
            border: 1.5px dashed #a8a29e !important;
            border-radius: 4px 12px 4px 10px;
            padding: 0.5em 0.7em;
            margin: 0.8em 0;
            box-shadow: none !important;
        }
        .wiki-content .ambox::before,
        .wiki-content .messagebox::before {
            content: "EDITORIAL NOTE";
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.18em;
            color: #a8a29e;
            margin-right: 0.6em;
            border: 1px dashed #a8a29e;
            padding: 1px 5px;
            border-radius: 2px;
        }
        /* TOC: same dimming treatment — it's nav, not article */
        .wiki-content .toc {
            font-size: 0.88em;
            background: rgba(245, 245, 244, 0.5);
            border: 1.5px dashed #a8a29e;
            border-radius: 4px 12px 4px 10px;
            padding: 0.5em 1em;
            margin: 1em 0;
            color: #57534e;
        }
        .wiki-content .toctitle h2 {
            font-size: 0.9em;
            border: none;
            margin: 0 0 0.3em;
            padding: 0;
            font-weight: 700;
            color: #78716c;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .wiki-content ul          { list-style-type: disc;    padding-left: 2em; margin-bottom: 1em; }
        .wiki-content ol          { list-style-type: decimal; padding-left: 2em; margin-bottom: 1em; }

        /* GALLERY — polaroid grid with alternating tilts */
        .wiki-content .gallery    { display: flex; flex-wrap: wrap; gap: 18px; margin: 1.4em 0.5em; padding: 0.5em 0; list-style: none; }
        .wiki-content .gallerybox {
            width: 160px;
            background: #fefdf9;
            border: 2.5px solid #18181b;
            padding: 8px 8px 4px;
            border-radius: 4px 14px 4px 12px / 12px 4px 14px 4px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .wiki-content .gallerybox:nth-child(4n+1) { transform: rotate(-1.8deg); box-shadow: 4px 4px 0 -1px #1d4ed8; }
        .wiki-content .gallerybox:nth-child(4n+2) { transform: rotate(1.4deg);  box-shadow: 4px 4px 0 -1px #ea580c; }
        .wiki-content .gallerybox:nth-child(4n+3) { transform: rotate(-0.7deg); box-shadow: 4px 4px 0 -1px #15803d; }
        .wiki-content .gallerybox:nth-child(4n)   { transform: rotate(2deg);    box-shadow: 4px 4px 0 -1px #db2777; }
        .wiki-content .gallerybox:hover           { transform: rotate(0deg) translateY(-3px); }
        .wiki-content .gallerybox img             { border: 1.5px solid #44403c; max-width: 100%; height: auto; display: block; }
        .wiki-content .gallerytext                {
            font-family: 'Inter', sans-serif;
            font-size: 1.05em;
            line-height: 1.25em;
            color: #1d4ed8;
            text-align: left;
            padding: 5px 2px 0;
            border-top: 1px dashed #d6d3d1;
            margin-top: 4px;
        }

        /* ============================================================
           KEYCAPS (formatting toggles) — chunky, satisfying
           ============================================================ */
        .keycap {
            background: #fefdf9;
            border: 2px solid #18181b;
            box-shadow: 0 3px 0 -1px #18181b, inset 0 1px 0 rgba(255,255,255,0.8);
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.08s;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            border-radius: 4px 8px 4px 7px / 7px 4px 8px 4px;
        }
        .keycap:hover { background: #fafaf9; }
        .keycap:active,
        .keycap.active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 -1px #18181b, inset 0 1px 2px rgba(0,0,0,0.1);
            background: #f5f5f4;
        }
        .keycap.toggled-b   { background: #fff7ed; border-color: #ea580c; color: #9a3412; box-shadow: 0 3px 0 -1px #ea580c, inset 0 1px 0 rgba(255,255,255,0.8); }
        .keycap.toggled-i   { background: #faf5ff; border-color: #9333ea; color: #6b21a8; box-shadow: 0 3px 0 -1px #9333ea, inset 0 1px 0 rgba(255,255,255,0.8); }
        .keycap.toggled-l   { background: #f0fdf4; border-color: #15803d; color: #14532d; box-shadow: 0 3px 0 -1px #15803d, inset 0 1px 0 rgba(255,255,255,0.8); }
        .keycap.toggled-cit { background: #fdf2f8; border-color: #db2777; color: #9d174d; box-shadow: 0 3px 0 -1px #db2777, inset 0 1px 0 rgba(255,255,255,0.8); }
        .keycap.toggled-cmp { background: #f5f3ff; border-color: #6d28d9; color: #4c1d95; box-shadow: 0 3px 0 -1px #6d28d9, inset 0 1px 0 rgba(255,255,255,0.8); }
        .keycap.toggled-b.active,
        .keycap.toggled-i.active,
        .keycap.toggled-l.active,
        .keycap.toggled-cit.active,
        .keycap.toggled-cmp.active { box-shadow: 0 1px 0 -1px currentColor, inset 0 1px 2px rgba(0,0,0,0.1); }

        /* Inline keyboard hint — nice tactile look */
        .kbd {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.78em;
            background: #fefdf9;
            border: 1.5px solid #18181b;

        .pace-meter.even .pm-head{color:#151e31;}

        .pm-bar{position:relative;width:18px;height:210px;margin:18px 0 12px;}
        .pm-clip{position:absolute;inset:0;border-radius:10px;overflow:hidden;background:#eef1f6;box-shadow:inset 0 1px 3px #14214516;}
        .pm-clip>i{position:absolute;left:0;right:0;bottom:0;display:block;}
        .pm-zone{background:repeating-linear-gradient(135deg,#1aa37714 0 3px,transparent 3px 6px),#eaf7f1;}
        .pm-fill{transition:height .2s cubic-bezier(.34,1.3,.64,1),background .2s;border-radius:0 0 10px 10px;background:linear-gradient(0deg,#119a67,#48d494);}
        .pace-meter.behind .pm-fill{background:linear-gradient(0deg,#e25a1f,#ffa35c);}
        .pm-gap{background:#f0703a1c;box-shadow:inset 0 -2px 0 #f0703a66;transition:bottom .2s ease-out,height .2s ease-out;}
        .pm-ghost{transition:bottom .08s linear,height .08s linear;background-size:12px 12px;animation:pm-march 1s linear infinite;}
        .pm-ghost.good{background-image:repeating-linear-gradient(135deg,#1aa377aa 0 3px,#1aa37744 3px 6px);box-shadow:inset 0 2px 0 #0e8a5c;}
        .pm-ghost.bad{background-image:repeating-linear-gradient(135deg,#f0703aaa 0 3px,#f0703a44 3px 6px);box-shadow:inset 0 2px 0 #d9531a;}
        .pm-loss{transition:bottom .08s linear,height .08s linear;background:repeating-linear-gradient(135deg,#e0482a 0 3px,#fde4dc 3px 6px);box-shadow:inset 0 -2px 0 #c23d17;}
        .pm-flash{top:0;background:linear-gradient(0deg,transparent,#ffffffd9 50%,transparent);height:36%!important;animation:pm-sweep .85s ease-out forwards;pointer-events:none;}
        .pm-tick{position:absolute;left:0;right:0;height:2px;margin-bottom:-1px;background:#fff;opacity:.85;}
        .pm-tickmark{position:absolute;left:-6px;width:4px;height:1.5px;margin-bottom:-.75px;background:#c2c9d6;border-radius:1px;}
        .pm-goal{position:absolute;left:-7px;right:-7px;height:2px;margin-bottom:-1px;background:#151e31;border-radius:1px;}
        .pm-goal em{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font:800 6.5px/1 'JetBrains Mono',monospace;font-style:normal;letter-spacing:.12em;color:#151e31;}
        .pm-notch{position:absolute;right:-11px;width:0;height:0;margin-bottom:-5px;border-style:solid;border-width:5px 7px 5px 0;border-color:transparent #151e31 transparent transparent;transition:bottom .2s ease-out;}

        .pm-live{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:9px;border-top:1px solid #edf0f5;}
        .pm-cap{font:700 6.5px/1 'JetBrains Mono',monospace;letter-spacing:.12em;color:#9aa4b8;}
        .pm-score{display:flex;align-items:baseline;gap:1px;white-space:nowrap;font-variant-numeric:tabular-nums;}
        .pm-score b{font:800 15px/1 'Inter',sans-serif;letter-spacing:-.03em;color:#b4bccb;}
        .pm-score small{font:600 8.5px/1 'JetBrains Mono',monospace;color:#9aa4b8;}
        .pm-live.good .pm-score b{color:#11875c;}.pm-live.bad .pm-score b{color:#d9531a;}
        .pm-next{min-height:9px;font:800 8px/1 'JetBrains Mono',monospace;letter-spacing:.02em;white-space:nowrap;color:#9aa4b8;}
        .pm-next.up{color:#11875c;}.pm-next.down{color:#d9531a;}

        @keyframes pm-pop{0%{transform:scale(.6);opacity:.2}60%{transform:scale(1.14)}100%{transform:none;opacity:1}}
        @keyframes pm-march{to{background-position:0 -12px}}
        @keyframes pm-sweep{0%{transform:translateY(300%);opacity:0}25%{opacity:1}100%{transform:translateY(-100%);opacity:0}}
        @media(max-width:650px){
            .game-shell>.flex-1.overflow-y-auto{padding-left:60px!important;}
            .pace-meter{left:4px;width:52px;padding:9px 3px 8px;border-radius:13px;}
            .pm-head{font-size:15px;}.pm-head.long{font-size:12px;}.pm-head.xlong{font-size:10px;}.pm-bar{height:140px;width:14px;margin:14px 0 9px;}
            .pm-score b{font-size:12px;}.pm-score small{font-size:7px;}.pm-next{font-size:6.5px;}.pm-sub,.pm-cap{font-size:5.5px;}
        }
        @media(prefers-reduced-motion:reduce){.pace-meter *{animation:none!important;transition:none!important;}}

        /* ---- Quick bag: items usable mid-round via Ctrl/Alt + 1–3 ---- */
        .quick-bag{display:flex;align-items:center;gap:6px;margin-left:auto;min-width:0;}
        .qb-slot{position:relative;display:flex;align-items:center;gap:7px;height:28px;padding:0 9px 0 4px;background:#fff;border:1px solid #d7dcea;border-radius:8px;box-shadow:0 1px 0 #d7dcea;color:#151e31;white-space:nowrap;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;}
        .qb-slot::before{content:'';position:absolute;left:-1px;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:#9aa4b8;}
        .qb-slot[data-rarity=uncommon]::before{background:#1aa377;}.qb-slot[data-rarity=rare]::before{background:#214ee7;}.qb-slot[data-rarity=epic]::before{background:#7432b3;}
        .qb-slot:hover:enabled{transform:translateY(-1px);border-color:#214ee7;box-shadow:0 3px 0 #214ee733;}
        .qb-slot:active:enabled{transform:translateY(1px);box-shadow:none;}
        .qb-slot kbd{font:800 9px/1 'JetBrains Mono',monospace;padding:4px 5px;border-radius:5px;background:#151e31;color:#fff;letter-spacing:.02em;}
        .qb-name{font:600 11px/1 'Inter',sans-serif;letter-spacing:-.01em;}
        .qb-slot b{font:800 10px/1 'JetBrains Mono',monospace;color:#214ee7;}
        .qb-count{font:800 9px/1 'JetBrains Mono',monospace;font-style:normal;color:#fff;background:#214ee7;border-radius:9px;padding:3px 5px;margin-left:-2px;}
        .qb-slot.is-active{opacity:.55;}.qb-slot.is-active b{color:#11875c;}
        .qb-slot.nudge{animation:qb-nudge .38s ease;border-color:#d9531a;}
        @keyframes qb-nudge{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
        .menu-kbd{display:inline-block;margin-right:7px;font:800 9px/1 'JetBrains Mono',monospace;padding:3px 5px;border-radius:4px;background:#151e31;color:#fff;vertical-align:1px;}
        @media(max-width:1180px){.qb-name{display:none;}}
        @media(max-width:650px){.quick-bag{gap:4px;}.qb-slot{height:24px;gap:4px;padding:0 6px 0 3px;}.qb-slot kbd{font-size:8px;padding:3px 4px;}}
        .hud-header{position:relative;z-index:10;}
        .utility-status.under-hud:not(:empty){top:calc(100% + 8px);right:14px;animation:toast-in .22s ease-out;}
        @keyframes toast-in{from{opacity:0;transform:translateY(-4px)}}
        @media(prefers-reduced-motion:reduce){.utility-status.under-hud{animation:none!important}.qb-slot{transition:none}.qb-slot.nudge{animation:none}}

/* Collectible cards and foil packs */

.item-icon{width:76px;height:76px;float:right;color:#7043b5}.character-panel{max-width:min(90vw,500px)!important}.character-panel button{min-width:32px;min-height:32px}@keyframes cardReveal{from{transform:translateY(20px) scale(.9);opacity:0}to{transform:none;opacity:1}}

.qb-slot .item-icon{width:22px;height:22px;float:none;flex-shrink:0}

        /* ============================================================
           THE CURIOSITY SHOP — one screen, same print identity as the title and tally:
           warm stock, 2px ink rules, hard offset shadows, blue + orange spot colour.
           ============================================================ */
        .shop { --ink:#181b20; --paper:#eae6d8; --card:#fffdf4; --muted:#5d6170; --blue:#214ee7; --orange:#f35326;
            --gap:clamp(12px,1.5vw,22px); --vgap:clamp(10px,1.9vh,20px);
            position:relative; height:100vh; height:100dvh; overflow:hidden auto; display:grid; grid-template-columns:minmax(0,1320px); grid-template-rows:auto minmax(min-content,580px) auto; align-content:center; align-content:safe center; justify-content:center; row-gap:var(--vgap);
            padding:clamp(12px,2.6vh,30px) clamp(16px,3.2vw,48px); color:var(--ink); }
        .shop::before { right:-16vw; top:-22vw; }
        .shop-head,.shop-floor,.shop-foot { position:relative; z-index:1; min-width:0; }
        .shop :focus-visible { outline:3px solid var(--blue); outline-offset:4px; }

        .shop-head { display:flex; align-items:flex-end; justify-content:space-between; gap:var(--gap); padding-bottom:var(--vgap); border-bottom:2px solid var(--ink); }
        .shop-kicker { margin:0 0 clamp(6px,1vh,10px); font:800 11px/1 'JetBrains Mono',monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--orange); }
        .shop-title { margin:0; font:900 clamp(30px,min(5.6vh,5vw),58px)/.88 'Inter',sans-serif; letter-spacing:-.065em; text-transform:uppercase; }
        .shop-title span { color:var(--blue); }
        .shop-ledger { display:flex; flex-shrink:0; margin:0; border:2px solid var(--ink); background:var(--card); box-shadow:4px 4px 0 var(--ink); }
        .shop-ledger > div { min-width:clamp(92px,8.6vw,124px); padding:clamp(6px,1.1vh,10px) clamp(12px,1.3vw,18px); }
        .shop-ledger > div + div { border-left:2px solid var(--ink); }
        .shop-ledger dt { display:flex; align-items:center; gap:6px; font:700 9px/1.3 'JetBrains Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
        .shop-ledger dd { margin:clamp(3px,.6vh,6px) 0 0; font:900 clamp(22px,3.5vh,32px)/1 'Inter',sans-serif; letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
        .shop-ledger .is-credits { background:var(--blue); color:#fff; }
        .shop-ledger .is-credits dt { color:#ffffffc7; }
        .shop-ledger .is-credits dt span { padding:1px 4px; background:var(--orange); color:#fff; letter-spacing:.04em; }

        .shop-floor { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-rows:1fr auto; column-gap:var(--gap); row-gap:var(--vgap); }
        .shop-shelf { display:flex; flex-direction:column; min-width:0; }
        .shop-upgrades { grid-column:1 / -1; }
        .shop-label { display:flex; align-items:center; gap:12px; margin-bottom:clamp(8px,1.3vh,12px); font:700 10px/1 'JetBrains Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
        .shop-label h2 { display:flex; align-items:center; gap:12px; flex:1; margin:0; font:inherit; font-weight:800; color:var(--ink); }
        .shop-label h2::after { content:''; flex:1; border-top:1px solid #181b2038; }
        .shop-cards,.shop-row { flex:1; display:grid; gap:var(--gap); }
        .shop-cards { grid-template-columns:repeat(var(--cols,4),minmax(0,1fr)); }
        .shop-row { grid-template-columns:repeat(2,minmax(0,1fr)); }

        /* Every card shares one anatomy: body on top, a ruled price bar underneath. */
        .shop-card,.shop-pack,.shop-item { container-type:inline-size; position:relative; display:flex; flex-direction:column; min-width:0; padding:0; text-align:left; color:var(--ink); background:var(--card); border:2px solid var(--ink); box-shadow:5px 5px 0 var(--ink); transition:transform .14s ease,box-shadow .14s ease; }
        .shop-card-body { flex:1; display:flex; flex-direction:column; min-height:0; padding:clamp(10px,2vh,20px) clamp(10px,6cqi,20px); }
        .shop-card p,.shop-pack p,.shop-item p { margin:0; font:500 clamp(12px,min(1.9vh,5.4cqi),15.5px)/1.45 'Inter',sans-serif; color:#434754; }
        .shop-buy { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:clamp(7px,1.15vh,11px) clamp(10px,6cqi,20px); border-top:2px solid var(--ink); background:var(--card); color:var(--ink); font:800 10px/1 'JetBrains Mono',monospace; letter-spacing:.12em; text-transform:uppercase; transition:background .14s,color .14s; }
        .shop-buy b { font:900 clamp(16px,2.3vh,20px)/1 'Inter',sans-serif; letter-spacing:-.03em; }
        .shop :enabled > .shop-buy > span::after { content:' →'; }
        :is(.shop-card,.shop-pack,.shop-item):enabled:hover { transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--accent,var(--blue)); }
        :is(.shop-card,.shop-pack,.shop-item):enabled:hover .shop-buy { background:var(--ink); color:var(--paper); }
        :is(.shop-card,.shop-pack,.shop-item):enabled:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
        :is(.shop-card,.shop-pack,.shop-item):disabled { cursor:default; box-shadow:3px 3px 0 #181b2040; }
        :is(.shop-card,.shop-pack,.shop-item):disabled .shop-buy { color:var(--muted); }
        :is(.shop-card,.shop-item):disabled .shop-card-body { opacity:.6; }

        .shop-card { --accent:var(--type); }
        .shop-card.type-word { --type:#e5501c; }
        .shop-card.type-sentence { --type:#214ee7; }
        .shop-card.type-run { --type:#7432b3; }
        .shop-card.type-utility { --type:#0e7a6b; }
        .shop-card::before { content:''; height:clamp(5px,.8vh,7px); background:var(--type); border-bottom:2px solid var(--ink); }
        .shop-card-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .shop-type { font:800 10px/1 'JetBrains Mono',monospace; letter-spacing:.14em; color:var(--type); }
        .shop-card h3 { margin:clamp(8px,1.6vh,16px) 0 clamp(5px,1vh,9px); font:900 clamp(18px,min(3.6vh,10.5cqi),33px)/1 'Inter',sans-serif; letter-spacing:-.05em; overflow-wrap:break-word; }
        .shop-card p { margin-bottom:clamp(8px,1.3vh,12px); }
        .shop-preview { margin-top:auto; padding-top:clamp(7px,1.2vh,11px); display:flex; flex-direction:column; gap:clamp(4px,.7vh,7px); border-top:1px dashed #181b2045; }
        .shop-preview small { font:700 9px/1 'JetBrains Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
        .shop-preview > span { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 6px; font:700 clamp(10px,4.6cqi,12px)/1 'Inter',sans-serif; color:var(--muted); font-variant-numeric:tabular-nums; }
        .shop-preview i { font-style:normal; }
        .shop-preview b { font:900 clamp(13px,min(2.4vh,7cqi),20px)/1 'Inter',sans-serif; letter-spacing:-.04em; color:var(--blue); }
        .shop-card.is-owned .shop-card-body { opacity:.4; }
        .shop-stamp { position:absolute; left:50%; top:47%; transform:translate(-50%,-50%) rotate(-9deg); padding:5px 16px 6px; border:3px solid var(--orange); background:#fffdf4d9; color:var(--orange); font:900 clamp(22px,3.3vh,30px)/1 'Inter',sans-serif; letter-spacing:.06em; text-transform:uppercase; pointer-events:none; }

        .shop-pack { --accent:var(--ink); overflow:hidden; color:#fffdf4; background:var(--blue) radial-gradient(#ffffff2b 1.1px,transparent 1.5px) 0 0 / 6px 6px; }
        .shop-pack.pack-large { background-color:var(--orange); }
        .shop-pack::after { content:''; position:absolute; z-index:0; left:-15%; right:-15%; top:clamp(24px,4.4vh,40px); height:clamp(16px,2.8vh,26px); background:var(--orange); transform:rotate(-8deg); pointer-events:none; }
        .shop-pack.pack-large::after { background:var(--blue); }
        .shop-pack > * { position:relative; z-index:1; }
        .shop-pack-art { display:flex; gap:.22em; margin-bottom:auto; padding-bottom:clamp(14px,2.6vh,26px); font:700 clamp(28px,min(6vh,17cqi),58px)/1 'PT Serif',Georgia,serif; color:#fffdf4; text-shadow:3px 3px 0 var(--ink); }
        .shop-pack h3,.shop-item h3 { margin:clamp(8px,1.4vh,12px) 0 clamp(3px,.6vh,6px); font:900 clamp(17px,min(2.8vh,8.4cqi),25px)/1 'Inter',sans-serif; letter-spacing:-.045em; }
        .shop-pack p { color:#fffdf4e6; }
        .shop-pack:disabled .shop-card-body { opacity:.55; }

        .shop-item { --accent:var(--item); }
        .item-hourglass { --item:var(--orange); }
        .item-carbon { --item:var(--blue); }
        .item-ink { --item:#7432b3; }
        .shop-item .item-icon { float:none; flex-shrink:0; width:clamp(32px,5.4vh,50px); height:clamp(32px,5.4vh,50px); margin-bottom:auto; padding-bottom:0; color:var(--item); }
        .shop-item.is-empty { align-items:center; justify-content:center; background:transparent; border:2px dashed #181b2045; box-shadow:none; font:700 10px/1 'JetBrains Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }

        .shop-foot { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px var(--gap); padding-top:var(--vgap); border-top:2px solid var(--ink); }
        .shop-kit,.shop-bag,.shop-exit { display:flex; align-items:center; }
        .shop-kit { gap:clamp(10px,1.4vw,20px); min-width:0; }
        .shop-bag { gap:6px; }
        .shop-foot-label { margin-right:4px; font:800 10px/1 'JetBrains Mono',monospace; letter-spacing:.14em; text-transform:uppercase; }
        .shop-slot { display:flex; align-items:center; gap:6px; height:36px; padding:0 10px 0 6px; border:2px solid var(--ink); background:var(--card); font:700 12px/1 'Inter',sans-serif; letter-spacing:-.01em; white-space:nowrap; }
        .shop-slot kbd { font:800 9px/1 'JetBrains Mono',monospace; padding:4px 5px; background:var(--ink); color:#fff; }
        .shop-slot .item-icon { float:none; flex-shrink:0; width:20px; height:20px; color:var(--item); }
        .shop-slot.is-empty { width:36px; padding:0; border-style:dashed; border-color:#181b2050; background:transparent; }
        .shop-build { position:relative; }
        .shop-build summary { display:flex; align-items:center; gap:8px; height:36px; padding:0 12px; border:2px solid var(--ink); background:var(--card); font:800 10px/1 'JetBrains Mono',monospace; letter-spacing:.14em; text-transform:uppercase; cursor:pointer; list-style:none; user-select:none; }
        .shop-build summary::-webkit-details-marker { display:none; }
        .shop-build summary b { padding:3px 6px; background:var(--ink); color:var(--paper); font:900 11px/1 'Inter',sans-serif; letter-spacing:0; }
        .shop-build summary::after { content:'▴'; font-size:11px; transition:transform .15s; }
        .shop-build[open] summary::after { transform:rotate(180deg); }
        .shop-build summary:hover { background:#fff; }
        .shop-build-panel { position:absolute; left:0; bottom:calc(100% + 12px); z-index:20; width:min(420px,calc(100vw - 32px)); max-height:min(60vh,520px); overflow:auto; padding:4px 18px; background:var(--card); border:2px solid var(--ink); box-shadow:6px 6px 0 var(--blue); }
        .shop-build-panel article { padding:12px 0; }
        .shop-build-panel article + article { border-top:1px solid #181b201f; }
        .shop-build-panel h3 { display:inline; margin-left:8px; font:900 15px/1.2 'Inter',sans-serif; letter-spacing:-.03em; }
        .shop-build-panel p { margin:5px 0 0; font:500 12px/1.45 'Inter',sans-serif; color:#434754; }
        .shop-build-empty { padding:12px 0; }
        .shop-exit { gap:clamp(12px,1.5vw,20px); flex-shrink:0; margin-left:auto; }
        .shop-link { padding:6px 0; font:700 10px/1 'JetBrains Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); border-bottom:1px solid currentColor; white-space:nowrap; }
        .shop-link:hover { color:var(--blue); }
        .shop-restock { display:flex; align-items:center; gap:10px; height:44px; padding:0 16px; border:2px solid var(--ink); background:var(--card); box-shadow:3px 3px 0 var(--ink); font:800 10px/1 'JetBrains Mono',monospace; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; transition:transform .12s,box-shadow .12s; }
        .shop-restock b { font:900 15px/1 'Inter',sans-serif; letter-spacing:-.02em; }
        .shop-restock:enabled:hover { transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--blue); }
        .shop-restock:disabled { opacity:.45; box-shadow:none; cursor:default; }
        .shop-go { display:flex; align-items:center; gap:clamp(18px,2.6vw,40px); height:52px; padding:0 20px; border:2px solid var(--ink); background:var(--ink); color:var(--paper); box-shadow:5px 5px 0 var(--orange); font:900 20px/1 'Inter',sans-serif; letter-spacing:.02em; text-transform:uppercase; white-space:nowrap; transition:transform .12s,background .12s; }

        dialog.pack-dialog { width:min(1080px,calc(100vw - 24px)); max-width:none; max-height:calc(100dvh - 24px); padding:0; overflow:auto; border:2px solid #181b20; background:#f5f1e5; color:#181b20; box-shadow:9px 9px 0 #214ee7; }

        .pack-dialog-head { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 22px; border-bottom:2px solid #181b20; background:#eae6d8 radial-gradient(#214ee72b 1px,transparent 1px) 0 0 / 5px 5px; }
        .pack-dialog-head .print-label { text-transform:uppercase; color:#5d6170; }
        .pack-dialog-head h2 { margin:6px 0 0; font:900 clamp(30px,5vw,46px)/.9 'Inter',sans-serif; letter-spacing:-.065em; text-transform:uppercase; }
        .pack-dialog-head h2 span { color:#214ee7; }
        .pack-dialog-head button { padding:12px 14px; background:#181b20; color:#fffdf4; font:700 10px/1 'JetBrains Mono',monospace; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; }
        .pack-dialog-head button:hover { background:#1c43d1; }

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        /* ================================================================
           CONFIG & CONSTANTS
           ================================================================ */
        const ROUND_SECONDS = [100, 105, 105, 100, 100, 95, 95];
        const GAME_DURATION_BASE = ROUND_SECONDS[0];
        const getRoundDuration = ante => ROUND_SECONDS[Math.max(0, Math.min(6, ante - 1))];
        const REQUIRED_SENTENCES = 3;
        const IDLE_HINT_DELAY_MS = 3000;
        const MIN_SENTENCE_LEN   = 15;
        const MAX_SENTENCE_LEN   = 300;
        const MIN_FRAGMENT_LEN   = 4;
        const MAX_FRAGMENT_LEN   = 220;
        const ANTE_BASE_TARGET   = 5_000_000;
        const MAX_ANTE           = 7;
        const ROUND_TARGETS = [ANTE_BASE_TARGET, 25_000_000, 100_000_000, 300_000_000, 1_000_000_000, 3_500_000_000, 12_000_000_000];
        const getRoundTarget = ante => ROUND_TARGETS[Math.max(0, Math.min(MAX_ANTE - 1, ante - 1))];
        const SAVE_KEY = 'encyclo.run.v1';
        const EMPTY_FORMAT = { b: false, i: false, l: false, cit: false, bul: false };
        const PRACTICE_EXCERPTS = [
            { id: 'practice-1', chars: Array.from('Curiosity opens doors.', c => ({ c, ...EMPTY_FORMAT })) },
            { id: 'practice-2', chars: Array.from('Small details matter.', c => ({ c, ...EMPTY_FORMAT, b: true })) },
            { id: 'practice-3', chars: Array.from('Follow the unexpected.', c => ({ c, ...EMPTY_FORMAT, i: true })) }
        ];
        function readSavedRun() {
            try {
                const run = JSON.parse(localStorage.getItem(SAVE_KEY));
                if (!run || run.version !== 1 || !['PLAYING', 'SCORING', 'UPGRADE_SELECT'].includes(run.gameState)) return null;
                if (!Number.isInteger(run.ante) || run.ante < 1 || run.ante > MAX_ANTE || !Number.isFinite(run.timeLeft) || run.timeLeft <= 0 || !Number.isFinite(run.totalScore)) return null;
                if (typeof run.article !== 'string' || !run.contentBlocks?.length || !Array.isArray(run.lockedSentences) || !Array.isArray(run.buffer)) return null;
                if (!Array.isArray(run.upgradeIds) || !Array.isArray(run.optionIds) || !Array.isArray(run.usedSentenceIds) || !Array.isArray(run.navHistory)) return null;
                const validChars = chars => Array.isArray(chars) && chars.every(c => c && typeof c.c === 'string');
                if (!validChars(run.buffer) || !run.lockedSentences.every(s => validChars(s.chars))) return null;
                if (!run.contentBlocks.every(b => b && (b.type === 'PARAGRAPH' ? Array.isArray(b.sentences) && b.sentences.every(s => validChars(s.chars)) : b.type === 'HTML' && typeof b.html === 'string' && (!b.fragments || b.fragments.every(s => validChars(s.chars)))))) return null;
                return run;
            } catch { return null; }
        }
        const SCORE_FIELDS = [
            ['capital', 'Capital letter ×', 0, Infinity, 0.1, 2],
            ['punctuation', 'Punctuation points', 0, 20, 1, 1],
            ['special', 'Special character points', 0, 30, 1, 5],
            ['bold', 'Bold ×', 1, Infinity, 0.1, 1.5],
            ['italic', 'Italic ×', 1, Infinity, 0.1, 1.5],
            ['link', 'Link bonus per word', 0, 100, 1, 10],
            ['position', 'First / last word ×', 1, Infinity, 0.1, 2],
            ['lengthStart', 'Length bonus after letters', 1, 20, 1, 7],
            ['lengthStep', 'Length bonus per letter', 0, Infinity, 0.05, 0.1],
            ['citation', 'Each citation block ×', 1, Infinity, 0.1, 1.5],
            ['symmetric', 'Symmetric sentence bonus', 0, 200, 1, 80],
            ['wordBonus', 'Word upgrade strength ×', 0, Infinity, 0.1, 1],
            ['sentenceBonus', 'Sentence upgrade strength ×', 0, Infinity, 0.1, 1],
            ['runBonus', 'Run upgrade strength ×', 0, Infinity, 0.1, 1],
            ['chain', 'Chain bonus per extra trigger', 0, Infinity, 0.01, 0.08],
            ['runTrigger', 'Run amplifier (dev) ×', 1, Infinity, 0.5, 1],
        ];
        const DEFAULT_SCORING = Object.freeze(Object.fromEntries(SCORE_FIELDS.map(([key,,,,,value]) => [key, value])));
        function readScoring() {
            try {
                const saved = JSON.parse(localStorage.getItem('encyclo.scoring.balance.v5')) || {};
                return Object.fromEntries(SCORE_FIELDS.map(([key,,min,max,,,]) => [key,
                    Number.isFinite(saved[key]) ? Math.max(min, Math.min(max, saved[key])) : DEFAULT_SCORING[key]]));
            } catch { return { ...DEFAULT_SCORING }; }
        }
        const guaranteedRunMultiplier=(upgrades,rules)=>(hasUpgrade(upgrades,'symmetric')?rules.runTrigger:1)*(hasUpgrade(upgrades,'carbon-effect')?(1+rules.runBonus)*rules.runTrigger:1);
        // Conditional run upgrades whose condition the locked excerpts have not already ruled out,
        // with the largest multiplier each can still pay. Unknown upgrades are assumed possible.
        const RUN_BONUS_MAX={rooted:.8,divergent:5,pyramidal:1.5,bibliophile:3,orthography:.5,vintage:.6,tonal:.6,mosaic:3,encyclopedist:11};
        function runBonusOutlook(locked, upgrades, rules) {
            const conditional=upgrades.filter(u=>u.type==='RUN'&&!['symmetric','carbon-effect'].includes(u.id));
            const text=s=>s.chars.filter(c=>!c.cit).map(c=>c.c).join('');
            const titles=locked.map(s=>s.articleTitle);
            const possible=u=>{
                if(locked.length>=REQUIRED_SENTENCES)return !!u.action(locked);
                switch(u.id){
                    case 'rooted':return new Set(titles).size<=1;
                    case 'divergent':return new Set(titles).size===titles.length;
                    case 'encyclopedist':return new Set(titles).size===titles.length&&locked.every(s=>s.chars.some(c=>c.cit));
                    case 'bibliophile':return locked.every(s=>s.chars.some(c=>c.cit));
                    case 'pyramidal':return locked.every((s,i)=>i===0||s.chars.length>locked[i-1].chars.length)&&(!locked.length||locked[locked.length-1].chars.length<MAX_SENTENCE_LEN);
                    case 'orthography':return locked.every(s=>!s.chars.some(c=>!c.cit&&/[!?"“”()\[\]{}—–]/u.test(c.c)));
                    case 'tonal':{const ends=locked.map(s=>text(s).trim().slice(-1));return ends.every(e=>/^[.!?]$/.test(e)&&e===ends[0]);}
                    default:return true;
                }
            };
            let live=conditional.filter(possible);
            const factor=list=>list.reduce((m,u)=>m*(1+(RUN_BONUS_MAX[u.id]??0)*rules.runBonus)*rules.runTrigger,1);
            // Same-article and all-different-articles bonuses exclude each other: keep the better side.
            const same=live.filter(u=>u.id==='rooted'),different=live.filter(u=>['divergent','encyclopedist'].includes(u.id));
            if(same.length&&different.length)live=live.filter(u=>!(factor(same)>=factor(different)?different:same).includes(u));
            const bonus=factor(live);
            return {live,lost:conditional.filter(u=>!live.includes(u)),multiplier:bonus};
        }
        function remainingExcerptPace(locked, upgrades, rules, target, bonusMultiplier = 1) {
            const count=REQUIRED_SENTENCES-locked.length;
            if(count<=0)return 0;
            const symmetric=hasUpgrade(upgrades,'symmetric')?rules.symmetric:0;
            const multiplier=guaranteedRunMultiplier(upgrades,rules)*bonusMultiplier;
            const product=locked.reduce((n,s)=>n*(scoreSentence(s,upgrades,rules).sentenceTotal+symmetric),1)*multiplier;
            if(!(product>0))return Infinity;
            let needed=Math.max(0,Math.ceil(Math.pow(target/product,1/count)-symmetric));
            const clears=n=>Math.floor(product*Math.pow(n+symmetric,count))>=target;
            if(!clears(needed))needed++;else if(needed>0&&clears(needed-1))needed--;
            return needed;
        }

        function thirdExcerptRequirement(locked, candidate, upgrades, rules, target) {
            if (locked.length !== 2) return null;
            const symmetric = upgrades.some(u=>u.id==='symmetric') ? rules.symmetric : 0;
            const third = candidate || {id:'requirement',chars:[],articleTitle:''};
            const evaluated = scoreRun([...locked,third], candidate ? upgrades : upgrades.filter(u=>u.id==='symmetric'||u.id==='carbon-effect'), rules,
                [...locked.map(s=>scoreSentence(s,upgrades,rules)), {sentenceTotal:0}]);
            const pair = evaluated.finalSentenceTotals[0] * evaluated.finalSentenceTotals[1];
            const factor = pair * evaluated.multiplier;
            const finishes = score => Math.floor(pair * (score + symmetric) * evaluated.multiplier) >= target;
            if (!(factor>0)) return {needed:Infinity, exact:!!candidate};
            let needed=Math.max(0,Math.ceil(target/factor-symmetric));
            // Match the scorer's final floor at floating-point boundaries.
            if(!finishes(needed)) needed++;
            else if(needed>0 && finishes(needed-1)) needed--;
            return {needed,exact:!!candidate};
        }

        function projectRoundPace(locked, candidate, upgrades, rules, target) {
            const known=candidate&&!locked.some(s=>s.id===candidate.id)?[...locked,candidate]:locked;
            if(!known.length||!(target>0))return null;
            let score;
            if(known.length===REQUIRED_SENTENCES){
                score=scoreRun(known,upgrades,rules).runTotal;
            }else{
                const symmetric=hasUpgrade(upgrades,'symmetric')?rules.symmetric:0;
                const product=known.reduce((n,s)=>n*(scoreSentence(s,upgrades,rules).sentenceTotal+symmetric),1);
                // Fill unknown slots with the geometric mean of known excerpt totals.
                // Conditional run bonuses cannot be assumed until all three are known.
                score=Math.floor(Math.pow(product,REQUIRED_SENTENCES/known.length)*guaranteedRunMultiplier(upgrades,rules));
            }
            return {score,ratio:score/target,exact:known.length===REQUIRED_SENTENCES};
        }

        function formatScore(n) {
            if (Math.abs(n) < 1e6) return n.toLocaleString();
            const units = [[1e15,'Q'], [1e12,'T'], [1e9,'B'], [1e6,'M']];
            const [scale, suffix] = units.find(([value]) => Math.abs(n) >= value);
            return `${Number((n / scale).toFixed(2))}${suffix}`;
        }
        function scoreRun(sentences, upgrades, rules = DEFAULT_SCORING, details = sentences.map(s => scoreSentence(s, upgrades, rules))) {
            const appliedRunUpgrades = [];
            let finalSentenceTotals = details.map(d => d.sentenceTotal);
            if (upgrades.some(u => u.id === 'symmetric')) {
                finalSentenceTotals = finalSentenceTotals.map(t => t + rules.symmetric);
                appliedRunUpgrades.push('Symmetric');
            }
            let multiplier = upgrades.some(u => u.id === 'symmetric') ? rules.runTrigger : 1;
            for (const upgrade of upgrades) {
                if (upgrade.type !== 'RUN' || upgrade.id === 'symmetric') continue;
                const effect = upgrade.action(sentences);
                if (effect) {
                    multiplier *= (1 + (effect.multAdd || 0) * rules.runBonus) * rules.runTrigger;
                    appliedRunUpgrades.push(upgrade.name);
                }
            }
            const product = finalSentenceTotals.length ? finalSentenceTotals.reduce((a, b) => a * b, 1) : 0;
            return { runTotal: Math.floor(product * multiplier), multiplier, appliedRunUpgrades, finalSentenceTotals };
        }

        /* ================================================================
           AUDIO ENGINE — typewriter SFX + ambient pipeline
           ================================================================ */
        const AudioEngine = (() => {
            let ctx = null;
            let masterGain = null;
            let noiseBuffer = null;
            let impulseBuffer = null;
            let muted = false;
            let ambientNodes = null;  // { source, gain } when ambient is playing
            let ambientVersion = 0, mediaRequest = null;
            let era = null;           // median article year, shapes click timbre

            function init() {
                if (ctx) return ctx;
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                ctx = new AC();
                masterGain = ctx.createGain();
                masterGain.gain.value = muted ? 0 : 0.55;
                masterGain.connect(ctx.destination);

                // Pre-bake a noise buffer (1s of white noise)
                const sr = ctx.sampleRate;
                noiseBuffer = ctx.createBuffer(1, sr, sr);
                const nd = noiseBuffer.getChannelData(0);
                for (let i = 0; i < sr; i++) nd[i] = (Math.random() * 2 - 1);

                // Synthesize a short reverb impulse (~1.6s exponential decay)
                const irLen = Math.floor(sr * 1.6);
                impulseBuffer = ctx.createBuffer(2, irLen, sr);
                for (let ch = 0; ch < 2; ch++) {
                    const d = impulseBuffer.getChannelData(ch);
                    for (let i = 0; i < irLen; i++) {
                        const decay = Math.pow(1 - i / irLen, 3);
                        d[i] = (Math.random() * 2 - 1) * decay;
                    }
                }
                return ctx;
            }

            function ensureRunning() {
                init();
                if (ctx && ctx.state === 'suspended') ctx.resume();
                return ctx;

            // Ambient: take an audio URL, route through lowpass + reverb, loop

            function playDrone(rootHz, intervals, seed, profile = SOUND_PALETTES.neutral) {

                const t0 = ctx.currentTime;
                const ambGain = ctx.createGain();
                ambGain.gain.value = 0;

                const conv = ctx.createConvolver();
                conv.buffer = impulseBuffer;
                const dryGain = ctx.createGain();
                dryGain.gain.value = 1-profile.wet;
                const wetGain = ctx.createGain();
                wetGain.gain.value = profile.wet;

                lfo.frequency.value = profile.breath;

                // them slowly for chord progression.

                const noise = ctx.createBufferSource();

                fragments.push({ id, chars, isFragment: true });
            });

            return { fragments, nextCounter: counter };
        }

        function parseArticleHTML(htmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');

            // Strip elements that break parsing or are pure UI noise
            // (kept .hatnote in — it's typeable as a fragment now)
            doc.querySelectorAll(
                '.mw-empty-elt, .mw-editsection, .navbox, .sistersitebox, script, style, .reference-text'
            ).forEach(el => el.remove());

            // Normalize image sources to absolute https URLs
            doc.querySelectorAll('img').forEach(img => {
                let src = img.getAttribute('src') || img.dataset.src;
                if (src) {
                    if      (src.startsWith('//')) img.setAttribute('src', 'https:' + src);
                    else if (src.startsWith('/'))  img.setAttribute('src', 'https://en.wikipedia.org' + src);
                    else                           img.setAttribute('src', src);
                }
                img.removeAttribute('srcset');
                img.removeAttribute('loading');
            });

            const blocks = [];
            const pageId = Math.random().toString(36).substring(2, 9);
            let sentenceIdCounter = 0;

            const root = doc.querySelector('.mw-parser-output') || doc.body;

            Array.from(root.childNodes).forEach(node => {
                if (node.nodeType !== Node.ELEMENT_NODE) return;
                const tag = node.tagName.toLowerCase();

                if (tag === 'p' || tag === 'blockquote') {
                    const sentences = extractSentencesFromParagraph(node, pageId, sentenceIdCounter);
                    sentenceIdCounter += sentences.length;

                    const valid = sentences.filter(s => s.chars.length >= MIN_SENTENCE_LEN && s.chars.length <= MAX_SENTENCE_LEN);
                    if (valid.length > 0) {
                        blocks.push({ type: 'PARAGRAPH', tag, id: Math.random(), sentences: valid });
                    } else {
                        blocks.push({ type: 'HTML', id: Math.random(), html: node.outerHTML, fragments: [] });
                    }
                } else {
                    // Preserve images, infoboxes, tables, headings as raw HTML.
                    // Annotate fragment-typeable elements with data-frag-id and
                    // collect their sentence objects for the global match pool.
                    const { fragments, nextCounter } = extractFragments(node, pageId, sentenceIdCounter);
                    sentenceIdCounter = nextCounter;
                    blocks.push({ type: 'HTML', id: Math.random(), html: node.outerHTML, fragments });
                }
            });

            // Extract article metadata for vibe-shaping features:
            // - leadImageUrl: first decent-sized image (skip tiny icons)
            // - allImages: every reasonable image, used for collage wallpaper
            // - era: median 4-digit year mentioned in article text
            let leadImageUrl = null;
            const allImages = [];
            for (const img of doc.querySelectorAll('img')) {
                const w = parseInt(img.getAttribute('width') || '0', 10);
                const h = parseInt(img.getAttribute('height') || '0', 10);
                const src = img.getAttribute('src');
                if (!src) continue;
                if (w >= 80 && h >= 80) {
                    if (!leadImageUrl) leadImageUrl = src;
                    allImages.push(src);
                }
            }
            const fullText = (doc.querySelector('.mw-parser-output') || doc.body).textContent || '';
            const yearMatches = fullText.match(/\b(1[5-9][0-9]{2}|20[0-2][0-9])\b/g) || [];
            let era = null;
            if (yearMatches.length >= 3) {
                const years = yearMatches.map(Number).sort((a, b) => a - b);
                era = years[Math.floor(years.length / 2)];
            }

            return { blocks, meta: { leadImageUrl, allImages, era } };
        }
